<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>大同國中實驗教育評鑑・3D 導覽</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="宜蘭縣立大同國中 115 學年度原住民族實驗教育評鑑網站 3D 導覽：六大構面、17 項指標。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面概念：湖中央是學校島，六座構面小島各掛一面旗，吊橋通往 17 座指標平台；介面像浮在湖面的告示牌 */
:root {
  --ink: #2a211b; --ink-soft: #5c5046; --paper: #fffdf8; --paper-2: #f3efe6; --line: #e2dbcf; --mist: #dfe8e6;
  --red: #be1e2d; --navy: #1d2386;
  --f-display: "Huninn", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --shadow: 0 6px 24px rgba(42, 33, 27, .14), 0 1px 3px rgba(42, 33, 27, .12);
  --r: 14px;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; overflow: hidden; background: var(--mist); color: var(--ink); font-family: var(--f-body); font-size: 18px; line-height: 1.7; -webkit-font-smoothing: antialiased; }
#sky { position: fixed; inset: 0; background: linear-gradient(180deg, #c6dbe2 0%, #dbe7e4 45%, var(--mist) 100%); }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }
a { color: inherit; }

#loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--mist); font-family: var(--f-display); font-size: 22px; color: var(--ink-soft); transition: opacity .8s; z-index: 20; }
body.ready #loading { opacity: 0; pointer-events: none; }

/* 標頭 */
.brand {
  position: fixed; z-index: 5; top: calc(14px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
  background: var(--paper); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px 20px 14px 18px;
  display: flex; gap: 14px; align-items: center; max-width: calc(100vw - 130px); transition: opacity .3s;
}
.brand .mark { width: 46px; height: 46px; flex: none; }
.brand .school { font-size: 15px; color: var(--ink-soft); letter-spacing: .04em; line-height: 1.3; }
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 30px; line-height: 1.2; letter-spacing: .05em; }
.brand .tag { font-size: 16px; color: var(--ink-soft); line-height: 1.35; margin-top: 2px; }
body.focused .brand { opacity: 0; pointer-events: none; }

.tools { position: fixed; z-index: 5; display: flex; flex-direction: column; gap: 10px; top: calc(14px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); }
.tbtn { background: var(--paper); border: 0; border-radius: 12px; box-shadow: var(--shadow); padding: 10px 16px; font-size: 17px; font-weight: 500; display: flex; align-items: center; gap: 8px; min-height: 48px; }
.tbtn svg { width: 20px; height: 20px; flex: none; }
.tbtn:hover { background: var(--paper-2); }
.tbtn[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

/* 圖例 */
#legend { position: fixed; z-index: 5; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transition: opacity .3s; max-width: calc(100vw - 32px); }
#legend .box { background: var(--paper); border-radius: 999px; box-shadow: var(--shadow); padding: 8px 22px; display: flex; align-items: center; gap: 8px 16px; font-size: 16px; line-height: 1.4; white-space: nowrap; }
#legend h4 { margin: 0; font-size: 14px; letter-spacing: .12em; color: var(--ink-soft); font-weight: 700; }
#legend .row { display: flex; align-items: center; gap: 6px; }
#legend .row b { font-variant-numeric: tabular-nums; font-weight: 500; color: var(--ink-soft); font-size: 14px; }
#legend .sw { width: 16px; height: 14px; clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); flex: none; }
#legendToggle { display: none; }
body.focused #legend, body.routing #legend { opacity: 0; pointer-events: none; }
@media (max-width: 1240px) and (min-width: 760px) {
  #legend .box { flex-wrap: wrap; justify-content: center; border-radius: var(--r); max-width: 720px; white-space: normal; }
}
#hint { position: fixed; z-index: 4; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); border-radius: 999px; padding: 10px 22px; font-size: 17px; box-shadow: var(--shadow); transition: opacity .5s, transform .5s; white-space: nowrap; }
#hint.gone { opacity: 0; transform: translate(-50%, 10px); pointer-events: none; }

/* 地圖標籤 */
.ilabel, .dlabel, .slabel, .vlabel { position: absolute; left: 0; top: 0; pointer-events: auto; border: 0; will-change: transform; transition: opacity .3s, background .2s; }
.ilabel::after, .dlabel::after, .slabel::after, .vlabel::after { content: ""; position: absolute; left: calc(50% + var(--tail, 0px)); bottom: -6px; width: 10px; height: 10px; background: inherit; transform: translateX(-50%) rotate(45deg); border-radius: 2px; z-index: -1; }
.ilabel { padding: 4px 12px 4px 4px; display: flex; align-items: center; gap: 7px; background: var(--paper); border-radius: 999px; box-shadow: 0 3px 10px rgba(42,33,27,.18); font-size: 17px; font-weight: 500; line-height: 1.25; white-space: nowrap; }
.ilabel .code { flex: none; min-width: 40px; height: 30px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; display: grid; place-items: center; background: var(--dc); color: #fff; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
.ilabel.compact { padding: 3px; } .ilabel.compact .nm { display: none; }
.ilabel:hover, .ilabel.hover { background: #fff; box-shadow: 0 0 0 3px var(--dc), 0 4px 12px rgba(42,33,27,.2); }
.ilabel.active { opacity: 0; pointer-events: none; }
.ilabel.lift { z-index: 3; }
.ilabel .stem, .dlabel .stem { display: none; }
.dlabel { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 14px; border-radius: 12px; background: var(--dc); color: #fff; box-shadow: 0 4px 14px rgba(42,33,27,.25); line-height: 1.25; white-space: nowrap; }
.dlabel .dn { font-family: var(--f-display); font-size: 20px; letter-spacing: .06em; }
.dlabel .dt { font-size: 16px; font-weight: 500; }
.dlabel .dw { background: rgba(255,255,255,.92); color: var(--dc); border-radius: 8px; padding: 1px 8px; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
.dlabel:hover, .dlabel.hover { filter: brightness(1.08); box-shadow: 0 0 0 3px #fff, 0 4px 14px rgba(42,33,27,.3); }
.dimmed { opacity: .3; }
body.focus-ind .dlabel { opacity: 0; pointer-events: none; }
.slabel { display: flex; flex-direction: column; align-items: center; padding: 6px 18px; border-radius: 14px; background: var(--red); color: #fff; box-shadow: 0 4px 14px rgba(42,33,27,.25); line-height: 1.2; }
.slabel .sm { font-size: 13px; letter-spacing: .1em; opacity: .9; }
.slabel b { font-family: var(--f-display); font-weight: 400; font-size: 24px; letter-spacing: .08em; }
.vlabel { display: flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 8px; background: #6a4432; color: #fff; box-shadow: 0 2px 8px rgba(42,33,27,.22); line-height: 1.3; font-size: 14px; font-weight: 700; }
.vlabel small { display: none; }
body.focused .slabel, body.focused .vlabel { opacity: .0; pointer-events: none; }

/* 側欄 */
.sheet {
  position: fixed; z-index: 10; background: var(--paper); box-shadow: 0 10px 40px rgba(42,33,27,.25);
  top: calc(16px + env(safe-area-inset-top, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  width: min(500px, 42vw); border-radius: 18px; display: flex; flex-direction: column; overflow: hidden;
  transform: translateX(calc(100% + 40px)); transition: transform .45s cubic-bezier(.2,.8,.2,1); visibility: hidden;
}
.sheet.open { transform: none; visibility: visible; }
.ptop { display: flex; align-items: center; gap: 8px; padding: 12px 12px 0 16px; position: relative; }
.ptop .sp { flex: 1; }
.pbtn { border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 6px 14px; font-size: 16px; min-height: 44px; }
.pbtn:hover { background: var(--paper-2); }
.pbtn:disabled { opacity: .4; cursor: default; }
#close, #listClose { width: 44px; padding: 0; font-size: 22px; line-height: 1; }
#panelBody, #listBody { overflow-y: auto; overscroll-behavior: contain; }
#panelBody { padding: 10px 26px 30px; }
.eyebrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.tag { font-size: 15px; font-weight: 500; border-radius: 8px; padding: 3px 10px; line-height: 1.5; background: var(--paper-2); }
.tag.dim { background: var(--dc, var(--paper-2)); color: #fff; }
.tag.w { background: var(--paper-2); color: var(--ink-soft); }
#panel h2 { font-family: var(--f-display); font-weight: 400; font-size: 30px; line-height: 1.3; margin: 14px 0 10px; display: flex; align-items: flex-start; gap: 12px; text-wrap: balance; }
.pnum { flex: none; min-width: 48px; height: 44px; padding: 0 6px; box-sizing: border-box; border-radius: 12px; background: var(--dc, var(--red)); color: #fff; font-family: var(--f-body); font-size: 18px; font-weight: 700; display: grid; place-items: center; font-variant-numeric: tabular-nums; margin-top: 2px; }
.intro { margin: 0 0 6px; font-size: 19px; }
#panel section { margin-top: 24px; }
#panel h3 { font-size: 15px; letter-spacing: .14em; color: var(--ink-soft); font-weight: 700; margin: 0 0 10px; display: flex; align-items: center; gap: 10px; }
#panel h3::after { content: ""; flex: 1; height: 1px; background: var(--line); }
#panel p { margin: 0 0 10px; }
.quote { margin: 0; background: var(--tint, var(--paper-2)); border-left: 5px solid var(--dc); border-radius: 0 12px 12px 0; padding: 10px 16px; font-size: 18px; }
.quote span { display: block; font-size: 14px; letter-spacing: .14em; color: var(--dc); font-weight: 700; }
.acts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.acts .primary { border: 0; background: var(--dc, var(--ink)); color: #fff; border-radius: 12px; padding: 10px 20px; font-size: 18px; font-weight: 700; min-height: 48px; }
.acts .secondary { border: 1.5px solid var(--line); background: var(--paper); border-radius: 12px; padding: 10px 18px; font-size: 17px; font-weight: 500; min-height: 48px; box-sizing: border-box; text-decoration: none; display: inline-flex; align-items: center; }
.acts .secondary:hover { background: var(--paper-2); }
.note { color: var(--ink-soft); font-size: 16px; margin: 8px 0 0 !important; }
.points { margin: 0; padding-left: 1.3em; }
.points li { margin: 4px 0; }
.points li::marker { color: var(--dc); }
.outline { margin: 0; padding-left: 0; list-style: none; counter-reset: none; }
.outline li { padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 17px; }
.strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.strip figure { margin: 0; }
.strip img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 10px; display: block; background: var(--paper-2); }
.strip figcaption { font-size: 14px; line-height: 1.4; color: var(--ink-soft); margin-top: 4px; }
.cards { display: grid; gap: 10px; }
.icard { display: flex; align-items: center; gap: 14px; text-align: left; border: 1px solid var(--line); background: var(--paper); border-radius: 14px; padding: 12px 14px; border-left: 6px solid var(--rc, var(--dc)); width: 100%; }
.icard:hover { background: var(--paper-2); }
.icard .code { flex: none; min-width: 46px; height: 40px; border-radius: 10px; background: var(--rc, var(--dc)); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
.icard.route .code { background: var(--paper-2); font-size: 22px; }
.icard .t { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.45; }
.icard .t b { font-size: 18px; }
.icard .t small { font-size: 15px; color: var(--ink-soft); }
.icard .go { color: var(--ink-soft); font-size: 20px; }
.vision { background: #f7e8e2; border-radius: 14px; padding: 14px 18px; border-left: 6px solid var(--red); margin-top: 6px; }
.vision b { font-size: 15px; letter-spacing: .1em; color: var(--red); }
.vision p { margin: 4px 0 0 !important; font-size: 19px; font-weight: 500; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 0; margin: 0 0 14px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.facts div { padding: 8px 12px; border-bottom: 1px solid var(--line); }
.facts div:nth-child(odd) { border-right: 1px solid var(--line); }
.facts div:nth-last-child(-n+2) { border-bottom: 0; }
.facts dt { font-size: 14px; color: var(--ink-soft); }
.facts dd { margin: 0; font-size: 17px; font-weight: 500; line-height: 1.45; }
.traits { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 6px 0 12px; }
.trait { background: var(--paper-2); border-radius: 12px; padding: 10px 14px; border-top: 4px solid var(--tc); }
.trait b { display: block; font-size: 18px; }
.trait i { display: block; font-style: normal; color: var(--tc); font-size: 15px; font-weight: 500; }
.trait p { margin: 4px 0 0 !important; font-size: 16px; line-height: 1.55; }

/* 清單 */
#listPanel { width: min(440px, 40vw); }
#listBody { padding: 6px 16px 24px; }
.lgroup { margin-top: 16px; }
.lgroup h3 { font-size: 16px; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
.lgroup h3 button { border: 0; background: var(--c); color: #fff; border-radius: 9px; padding: 4px 12px; font-size: 16px; font-weight: 700; text-align: left; }
.lgroup h3 span { font-size: 14px; color: var(--ink-soft); font-weight: 500; }
.lgroup h3::after { content: ""; flex: 1; height: 2px; background: var(--c); opacity: .25; }
.lrow { width: 100%; display: flex; align-items: center; gap: 12px; border: 0; background: none; text-align: left; padding: 8px; border-radius: 10px; min-height: 50px; }
.lrow:hover { background: var(--paper-2); }
.lrow .num { flex: none; min-width: 42px; height: 34px; border-radius: 999px; background: var(--c, var(--paper-2)); color: #fff; display: grid; place-items: center; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
.lrow.school { margin-top: 8px; background: var(--paper-2); }
.lrow.school .num { background: var(--paper); font-size: 20px; }
.lname { flex: 1; min-width: 0; font-size: 17px; font-weight: 500; line-height: 1.35; display: flex; flex-direction: column; }
.lname small { font-size: 14px; color: var(--ink-soft); font-weight: 400; }

/* 導覽路線列 */
#routebar { position: fixed; z-index: 6; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); width: min(560px, calc(100vw - 32px)); background: var(--paper); border-radius: 18px; box-shadow: var(--shadow); padding: 10px 14px 12px; border-top: 5px solid var(--rc); box-sizing: border-box; display: grid; gap: 8px; }
.rhead { display: flex; align-items: center; gap: 10px; }
.rtitle { font-family: var(--f-display); font-weight: 400; font-size: 21px; }
.rcount { color: var(--ink-soft); font-size: 15px; flex: 1; }
#rClose { width: 44px; padding: 0; font-size: 22px; }
.rstops { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.rstop { flex: none; border: 1.5px solid var(--line); background: var(--paper); border-radius: 999px; padding: 2px 12px; font-size: 15px; font-weight: 700; min-height: 36px; font-variant-numeric: tabular-nums; }
.rstop.on { background: var(--rc); border-color: var(--rc); color: #fff; }
.rnav { display: flex; gap: 8px; }
.rtext { margin: 0; font-size: 16px; color: var(--ink-soft); line-height: 1.55; }
.rnav .primary { background: var(--rc); color: #fff; border-color: var(--rc); font-weight: 700; }

/* 手機 */
@media (max-width: 759px) {
  body { font-size: 17px; }
  .brand { padding: 10px 14px; gap: 10px; max-width: calc(100vw - 100px); }
  .brand .mark { width: 36px; height: 36px; }
  .brand h1 { font-size: 22px; }
  .brand .school { font-size: 13px; }
  .brand .tag { display: none; }
  .tbtn span { display: none; }
  .tbtn { padding: 10px 12px; }
  #legendToggle { display: flex; }
  #legend { left: max(16px, env(safe-area-inset-left, 0px)); transform: none; display: flex; flex-direction: column-reverse; align-items: flex-start; }
  #legend .box { display: none; flex-direction: column; align-items: flex-start; border-radius: var(--r); padding: 12px 16px; margin-bottom: 8px; gap: 6px; white-space: normal; }
  #legend.open .box { display: flex; }
  #hint { bottom: calc(78px + env(safe-area-inset-bottom, 0px)); font-size: 16px; }
  .sheet { top: auto; left: 0; right: 0; bottom: 0; width: auto !important; max-height: 60vh; border-radius: 20px 20px 0 0; transform: translateY(105%); padding-bottom: env(safe-area-inset-bottom, 0px); }
  #panelBody { padding: 4px 18px 24px; }
  .ptop::before { content: ""; position: absolute; left: 50%; top: 7px; width: 44px; height: 5px; border-radius: 3px; background: var(--line); transform: translateX(-50%); }
  .ptop { padding-top: 16px; }
  #panel h2 { font-size: 24px; }
  .pnum { min-width: 42px; height: 38px; font-size: 16px; }
  .ilabel { font-size: 15px; }
  .ilabel .code { min-width: 36px; height: 28px; font-size: 14px; }
  .dlabel .dt { display: none; }
  .vlabel small, .slabel .sm { display: none; }
  .slabel b { font-size: 20px; }
  .dlabel .dn { font-size: 17px; }
  .facts, .traits { grid-template-columns: 1fr; }
  .facts div:nth-child(odd) { border-right: 0; }
  .facts div:nth-last-child(2) { border-bottom: 1px solid var(--line); }
  body.routing .sheet.open { max-height: 46vh; }
  #routebar { left: 8px; right: 8px; width: auto; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
  body.routing.focused #routebar { bottom: calc(46vh + 8px); }
}

/* ───────── 閱讀頁 ───────── */
:root { --d1: #337EA9; --d2: #448361; --d3: #9065B0; --d4: #D9730D; --d5: #CB912F; --d6: #C14C8A;
  --n-gray: #F1F1EF; --n-brown: #F4EEEE; --n-orange: #FBECDD; --n-yellow: #FBF3DB; --n-green: #EDF3EC; --n-blue: #E7F3F8; --n-purple: #F6F3F9; --n-pink: #FAF1F5; --n-red: #FDEBEC; }
#reader { position: fixed; inset: 0; z-index: 40; background: var(--paper); display: flex; flex-direction: column; opacity: 0; transition: opacity .25s; }
#reader.in { opacity: 1; }
body.valley #scene, body.valley #labels, body.valley .brand, body.valley .tools, body.valley #legend, body.valley #hint, body.valley #routebar, body.valley .sheet,
body.reading #scene, body.reading #labels, body.reading .brand, body.reading .tools, body.reading #legend, body.reading #hint, body.reading #routebar, body.reading .sheet { visibility: hidden; }
.rbar { flex: none; display: flex; align-items: center; gap: 12px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); padding-top: calc(10px + env(safe-area-inset-top, 0px)); border-bottom: 1px solid var(--line); background: var(--paper); box-shadow: inset 0 4px 0 var(--dc); }
.rbar .rmap, .vbar .rmap { border: 0; background: var(--ink); color: var(--paper); border-radius: 10px; padding: 8px 16px; font-size: 16px; font-weight: 700; min-height: 44px; display: inline-flex; align-items: center; gap: 8px; }
.rbar .rmap svg, .vbar .rmap svg { width: 18px; height: 18px; }
#rdCrumb { color: var(--ink-soft); font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#rdCrumb b { color: var(--dc); }
.rbar .sp { flex: 1; }
.rbar .rsite { font-family: var(--f-display); font-size: 18px; color: var(--ink-soft); white-space: nowrap; }
#rdTocBtn { display: none; }
.rwrap { flex: 1; min-height: 0; display: flex; }
#rdSide { flex: none; width: 300px; overflow-y: auto; border-right: 1px solid var(--line); padding: 14px 10px 40px; background: #fbf8f1; overscroll-behavior: contain; }
#rdSide .sl { display: flex; align-items: baseline; gap: 8px; padding: 7px 10px; border-radius: 9px; text-decoration: none; font-size: 15px; line-height: 1.45; color: var(--ink); }
#rdSide .sl:hover { background: var(--paper-2); }
#rdSide .sl.on { background: var(--paper); box-shadow: inset 4px 0 0 var(--dc, var(--red)), 0 1px 3px rgba(42,33,27,.1); font-weight: 700; }
#rdSide .sg { margin-top: 12px; }
#rdSide .sl.dim { font-weight: 700; color: var(--dc); font-size: 15px; }

<aside id="panel" class="sheet" role="dialog" aria-labelledby="panelTitle" aria-hidden="true">

    <button class="pbtn" id="next" type="button">下一項 →</button>
    <span class="sp"></span>
    <button class="pbtn" id="close" type="button" aria-label="關閉說明">×</button>
  </div>
  <div id="panelBody"></div>
</aside>


<div id="reader" hidden>
  <div class="rbar">
    <button type="button" class="pbtn" id="rdTocBtn" aria-expanded="false" aria-controls="rdSide">☰ 目錄</button>
    <button type="button" class="rmap" id="rdMap" aria-label="回 3D 地圖"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20 9.5 8l4 6 2.5-4L21 20Z"/></svg><span>回 3D 地圖</span></button>
    <div id="rdCrumb"></div>

    <aside id="rdSide"></aside>

      <nav id="rdPager" aria-label="上一頁與下一頁"></nav>
    </div>
  </div>
  <button type="button" id="rdTop" aria-label="回到頁首">↑</button>
</div>

ablewrap"><table class=""><tr><th scope="col">核心特質</th><th scope="col">gaga 文化內涵</th><th scope="col">學生具體行為表現指標</th></tr><tr><td><b>愛土地</b><br>mlahang rhzyal</td><td>與土地共生、謙卑敬山的生態倫理；依歲時與自然共處，理解資源永續利用的祖先智慧。</td><td>主動維護環境與耕地；理解輪耕、狩獵倫理與生物承載量等永續概念；尊重並珍惜自然資源。</td></tr><tr><td><b>負責</b><br>ssyan inlungan</td><td>gaga 規範中對自身行為與群體的承擔；言出必行、把分內之事做好。</td><td>完成分內工作與作品；對品質自我要求；主動利用課餘補足進度；承擔小組共同責任。</td></tr><tr><td><b>合作</b><br>pkrraw</td><td>共食共作、換工（sbayux）互助的部落生活方式；祭儀與農事中的集體分工。</td><td>依分工完成團體任務；主動協助同儕；跨年級混齡互助；於祭儀準備中清楚承擔自己的角色。</td></tr><tr><td><b>感恩</b><br>smyuk kinhuway</td><td>感謝祖靈、敬老惜福的祭儀精神；收穫來自祖靈祝福，應與人共享並回饋。</td><td>敬重耆老並珍惜其身教與技藝傳授；於祭儀中以行動感謝祖靈；珍惜土地與材料的給予；主動回饋群體。</td></tr></table></div><p><b>上述理念透過七至九年級三階段主題式文化課程推動：七年級「燒墾生活」、八年級「gaga 家庭與編織」、九年級「山林智慧」。</b></p><h3 id="s4">（二）理念之檢核與修正機制</h3><ol><li>本校每學期依國立東華大學原住民族課程發展協作中心之輔導諮詢會議，定期檢視民族教育理念及文化課程之落實情形，並據委員意見進行回應與調整。112 學年度第一學期至 114 學年度第一學期共接受五次期中輔導訪視，每次均由委員填寫意見表，學校於次學期提出「前次輔導諮詢會議意見修正情形回饋單」，形成完整之意見回應循環。</li><li>每學年參與實驗教育課程計畫備查會議，依會議結論滾動修正實驗教育課程計畫書，確保課程設計持續符合部落實際文化脈絡與族群發展需求。112 至 115 學年度課程計畫均完成備查，並留有備查紀錄表與修正對照表。</li><li>協作中心指派駐校助理入校協作，除隨班協同教學外，並以文字與影像持續記錄文化課程之實施歷程，累積本校課程發展之歷程性資料。</li></ol><p class="c-gray"><i>（駐校助理之課程紀錄、駐點小誌與文宣設計成果，詳見 </i><i><a class="mention" href="#p3-1" data-page="3-1"><span class="mi">🌿</span>3-1 課程教學、發展與落實</a></i><i> 之「外部專業支持與教學歷程紀錄」）</i></p><h3 id="s5">（三）理念之日常落實機制</h3><div class="callout bg-gray_bg"><span class="ci" aria-hidden="true">🔁</span><div class="cb"><h4 id="s6"><b>定期召開課程教學研究會（每週一次）</b></h4><p>文化教師與協同教師共同進行備課、說課及議課，確保民族教育理念貫串於各年段課程設計與教學實施，並引導學生透過課程活動逐步內化四項核心特質。112 學年度召開 33 場次、113 學年度 30 場次、114 學年度 32 場次，均留有會議紀錄與簽到表。</p></div></div><div class="callout bg-gray_bg"><span class="ci" aria-hidden="true">🌾</span><div class="cb"><h4 id="s7"><b>落實祭儀生活化</b></h4><p>學生從事前籌備到實際參與，全程體驗小米播種祭（Smgatu）、小米收割祭、祖靈感恩祭（Cmyus）等傳統祭儀。籌備階段由師生共同召開籌備會議分工，並於守月（magu byaling）期間持續進行月相觀測，作為祭儀擇日之依據，使學生在親身實踐中感受 gaga 的精神意涵與文化價值。</p></div></div><div class="callout bg-gray_bg"><span class="ci" aria-hidden="true">🔬</span><div class="cb"><h4 id="s8"><b>推動文化回應教學</b></h4><p>於一般領域課程中融入泰雅族文化視角，使民族教育理念不侷限於文化課程，而能延伸至學生整體學習歷程。</p><p>（詳細教案內容請見 <a class="mention" href="#p3-1" data-page="3-1"><span class="mi">🌿</span>3-1 課程教學、發展與落實</a>）</p></div></div><h3 id="s9">（四）四項核心特質融入課程之雙軌設計</h3><p>四項核心特質之融入採「課程即品格」原則，並以雙軌方式落實：</p><ol><li><b>明示融入</b>：於課程設計、課堂常規與公開授課觀察表中明確檢核。公開授課觀察表第 11 項即為「是否將 Tayal balay 的特質融入課程中（明示或暗示）」。</li><li><b>暗示融入</b>：透過歲時農耕、祭儀分工、耆老身教與共作情境，讓特質於文化實踐中自然內化。</li></ol><p>每週教學研究會逐週檢視各單元之特質融入情形與學生表現，並依檢視結果調整後續單元之設計與教學方式。</p><p>四項核心特質之落實並不限於課程。113 學年度守月（magu byaling）期間，學輔工作亦以四項特質作為檢視團體言行之軸線，使特質從課堂延伸至校園生活與人際互動。</p><p class="c-gray"><i>（守月時期之學輔工作機制與學生集體省思，詳見 </i><i><a class="mention" href="#p6-3" data-page="6-3"><span class="mi">💡</span>6-3 學校辦理民族教育之創新與省思</a></i><i> 之「magu byaling 與 sbalay 之校內制度化實踐」）</i></p><hr><h2 id="s10">三、114 學年度四項核心特質融入課程對應總表（互動網頁）</h2><div class="callout bg-brown_bg"><span class="ci" aria-hidden="true">🔗</span><div class="cb"><p><b>互動網頁｜114 學年度四項核心特質融入課程對應說明表</b></p><p>以完整表格呈現七至九年級各課程單元對應四項核心特質之情形。內容較長，建議於新分頁全螢幕檢視。</p><p><a href="https://bacon-sys.github.io/115-eval-4-characters/" target="_blank" rel="noopener">在新分頁開啟完整網頁 ↗</a></p></div></div><p class="c-gray"><i>以下三個年級的對應表為上述完整互動網頁之文字版，可直接於本頁展開閱讀。(</i>◎＝主要特質　○＝輔助特質。<i>)</i></p><details class="tg"><summary>七年級　燒墾生活</summary><div class="tb"><div class="tablewrap"><table class=""><tr><th scope="col">學習面向</th><th scope="col">課程單元</th><th scope="col">愛土地</th><th scope="col">負責</th><th scope="col">合作</th><th scope="col">感恩</th><th scope="col">融入方式與實踐情形</th></tr><tr><td>自然與環境</td><td>燒墾管理</td><td>◎</td><td>○</td><td>○</td><td></td><td>學習開墾、輪耕與砌石（haga），理解保留小石頭以促進水分滲透之永續用地智慧；全校定期除草，親身實踐與土地共生。</td></tr><tr><td>自然與環境</td><td>燒墾管理（三石灶與工寮）</td><td>○</td><td>○</td><td>◎</td><td></td><td>就地取材搭建工寮與三石灶，透過全員互助合作完成。</td></tr><tr><td>組織與結構</td><td>小米祭典儀式</td><td></td><td>○</td><td>○</td><td>◎</td><td>Cmyus 祖靈感恩祭以親手製作之祭品獻祭，回顧一年並感謝祖靈；祭儀分工由學長姊帶領。</td></tr><tr><td>組織與結構</td><td>小米祭饌製作</td><td></td><td>○</td><td>◎</td><td>○</td><td>小米酒、小米醃肉共作，學生主動分工；耆老（yaki）全程以族語教授，學生學習敬老與惜福。</td></tr><tr><td>記憶與技藝</td><td>竹製生活器具（bluku）</td><td></td><td>◎</td><td>○</td><td></td><td>作品進度與品質責任制；同儕小老師協助檢視並修正編製錯誤處。</td></tr><tr><td>記憶與技藝</td><td>木製生活器具（qongu）</td><td>○</td><td>◎</td><td></td><td></td><td>杵臼採傳統木炭燒鑿工法，培養耐心與內在涵養；珍惜木料、就地取材。</td></tr><tr><td>記憶與技藝</td><td>藤製生活器具（takil）</td><td>○</td><td>◎</td><td></td><td></td><td>探究黃藤生長與採收時機，理解永續採集倫理；背籃編作要求學生為作品負責到底。</td></tr><tr><td>省思與回顧</td><td>專題基礎實務</td><td></td><td>◎</td><td>○</td><td>○</td><td>期末成果報告與同儕互評，為一學期文化學習成果負責；回顧單元引導感謝土地、耆老與同儕。</td></tr></table></div></div></details><details class="tg"><summary>八年級　gaga 家庭與編織</summary><div class="tb"><div class="tablewrap"><table class=""><tr><th scope="col">學習面向</th><th scope="col">課程單元</th><th scope="col">愛土地</th><th scope="col">負責</th><th scope="col">合作</th><th scope="col">感恩</th><th scope="col">融入方式與實踐情形</th></tr><tr><td>自然與環境</td><td>苧麻製線與染線</td><td>○</td><td>○</td><td>◎</td><td></td><td>跨年級混齡刮苧麻重現部落換工（sbayux）精神；自製刮麻器學習珍惜工具；草木灰煮線、薯榔染線皆取自土地。</td></tr><tr><td>記憶與技藝</td><td>傳統地機編織</td><td></td><td>◎</td><td>○</td><td></td><td>織作品質自我要求，未達標準即拆掉重編並利用課餘完成進度；進度快者主動協助進度慢者。</td></tr><tr><td>記憶與技藝</td><td>弓織技藝應用</td><td></td><td>○</td><td>◎</td><td></td><td>進階弓織採同儕師徒制，互相檢視織紋、共同解決問題。</td></tr><tr><td>記憶與技藝</td><td>泰雅服飾與工藝</td><td></td><td>◎</td><td></td><td>○</td><td>透過耳飾與服飾製作認識泰雅美學，引導學生珍視文化資產，並培養完成個人作品的責任感。</td></tr><tr><td>組織與結構</td><td>家與 gaga 團體</td><td></td><td>○</td><td>○</td><td>◎</td><td>透過族譜建置，了解家族過往的歷史與事件，培養對根源的情感與感謝；gaga 團體單元理解群體中的責任分工。</td></tr><tr><td>組織與結構</td><td>傳統信仰與生命禮俗</td><td></td><td>○</td><td></td><td>◎</td><td>透過生命禮俗理解對祖靈與長者的敬重，並與學校四項核心特質相互印證。</td></tr><tr><td>省思與回顧</td><td>專題基礎實務</td><td></td><td>◎</td><td>○</td><td></td><td>數位工具應用與口語發表，為學習歷程之呈現負責；小組協作完成簡報。</td></tr></table></div></div></details><details class="tg"><summary>九年級　山林智慧</summary><div class="tb"><div class="tablewrap"><table class=""><tr><th scope="col">學習面向</th><th scope="col">課程單元</th><th scope="col">愛土地</th><th scope="col">負責</th><th scope="col">合作</th><th scope="col">感恩</th><th scope="col">融入方式與實踐情形</th></tr><tr><td>自然與環境</td><td>傳統建築與生活</td><td>○</td><td></td><td>○</td><td>◎</td><td>耆老到校共作穀倉，學生觀察訪談傳統工法；耆老完工後將場地收拾乾淨，成為學生的身教示範，涵養敬老與惜福。</td></tr><tr><td>自然與環境</td><td>漁獵生態體驗</td><td>◎</td><td>○</td><td></td><td>○</td><td>完整論述狩獵倫理與生物承載量觀念；學生為自己設置之陷阱負責；對獵物懷感恩之心，收穫應與他人共享。</td></tr><tr><td>組織與結構</td><td>族群遷徙與歷史</td><td>○</td><td></td><td></td><td>◎</td><td>Pinsbkan 尋根溯源連結族群根源與土地；有學生自發攜自家醃肉至發源地表達對祖靈之感謝。</td></tr><tr><td>記憶與技藝</td><td>藤製生活器具（qbubu／gonyu）</td><td>○</td><td>◎</td><td></td><td>○</td><td>耆老親授藤帽收尾技法，於世代傳承中學習感謝；作品完成度納入評量。</td></tr><tr><td>記憶與技藝</td><td>竹製生活器具（lubuw）</td><td></td><td>◎</td><td>○</td><td></td><td>口簧琴製作與吹奏，個人作品責任制，同儕互教指法。</td></tr><tr><td>記憶與技藝</td><td>竹製生活器具（sguyu）</td><td>○</td><td>◎</td><td></td><td></td><td>魚筌製作結合寒溪移地漁撈課程，理解泰雅族自有之漁撈生態系統知識。</td></tr><tr><td>記憶與技藝</td><td>木製生活器具（bneloq）</td><td>○</td><td>◎</td><td></td><td></td><td>弓箭製作結合狩獵倫理教育；學生自行整理上山裝備，為裝備與安全負責。</td></tr><tr><td>省思與回顧</td><td>專題研究實作</td><td></td><td>○</td><td>◎</td><td></td><td>專題以小組合作完成選題、訪談與發表；成果發表時由在場組員共同承擔缺席組員的報告內容。</td></tr></table></div></div></details><hr><h2 id="s11">四、112～114 學年度民族教育理念與泰雅文化實踐情形（互動網頁）</h2><p>本頁面彙整自 112 至 114 學年度文化領域教學研究會會議紀錄，以三年度時間軸呈現教學研究會運作與各年級課程實施情形，並以四項核心特質為軸線引述師生表現之具體實例。</p><div class="callout bg-brown_bg"><span class="ci" aria-hidden="true">🔗</span><div class="cb"><p><b>互動網頁｜112～114 學年度民族教育理念與泰雅文化實踐情形</b></p><p><a href="https://bacon-sys.github.io/115-eval-tayal-balay/" target="_blank" rel="noopener">在新分頁開啟完整網頁 ↗</a></p></div></div><hr><h2 id="s12">五、精選照片</h2><div class="cols" style="--tpl:50.00fr 50.00fr"><div class="col"><figure class="img"><button type="button" class="ph" data-full="img/full/f3a44d5c7e.jpg" data-cap="文化領域教學研究會，文化教師與協同教師共同檢視各年段課程實施進度與學生學習情形，作為課程滾動修正之依據。" aria-label="放大照片：文化領域教學研究會，文化教師與協同教師共同檢視各年段課程實施進度與學生學習情形，作為課程滾動修正之依據。"><img src="img/full/f3a44d5c7e.jpg" alt="文化領域教學研究會，文化教師與協同教師共同檢視各年段課程實施進度與學生學習情形，作為課程滾動修正之依據。" loading="lazy" width="1600" height="1200"></button><figcaption>文化領域教學研究會，文化教師與協同教師共同檢視各年段課程實施進度與學生學習情形，作為課程滾動修正之依據。</figcaption></figure></div><div class="col"><figure class="img"><button type="button" class="ph" data-full="img/full/06c64ea1c8.jpg" data-cap="113 學年度小米播種祭（Smgatu）籌備會議，師生共同討論祭儀流程與工作分工，落實祭儀由籌備到參與之全程學習。" aria-label="放大照片：113 學年度小米播種祭（Smgatu）籌備會議，師生共同討論祭儀流程與工作分工，落實祭儀由籌備到參與之全程學習。"><img src="img/full/06c64ea1c8.jpg" alt="113 學年度小米播種祭（Smgatu）籌備會議，師生共同討論祭儀流程與工作分工，落實祭儀由籌備到參與之全程學習。" loading="lazy" width="1600" height="1200"></button><figcaption>113 學年度小米播種祭（Smgatu）籌備會議，師生共同討論祭儀流程與工作分工，落實祭儀由籌備到參與之全程學習。</figcaption></figure></div></div><div class="cols" style="--tpl:50.00fr 50.00fr"><div class="col"><figure class="img"><button type="button" class="ph" data-full="img/full/7d42499401.jpg" data-cap="114 學年度守月（magu byaling）期間，每日月相紀錄張貼於校園公共區域，學生於課餘觀看並討論月相變化。" aria-label="放大照片：114 學年度守月（magu byaling）期間，每日月相紀錄張貼於校園公共區域，學生於課餘觀看並討論月相變化。"><img src="img/full/7d42499401.jpg" alt="114 學年度守月（magu byaling）期間，每日月相紀錄張貼於校園公共區域，學生於課餘觀看並討論月相變化。" loading="lazy" width="1477" height="1108"></button><figcaption>114 學年度守月（magu byaling）期間，每日月相紀錄張貼於校園公共區域，學生於課餘觀看並討論月相變化。</figcaption></figure></div><div class="col"><figure class="img"><button type="button" class="ph" data-full="img/full/69c21f6956.jpg" data-cap="114 學年度守月期間月相觀測紀錄（114 年 11 月 26 日），作為小米播種祭擇日之依據。" aria-label="放大照片：114 學年度守月期間月相觀測紀錄（114 年 11 月 26 日），作為小米播種祭擇日之依據。"><img src="img/full/69c21f6956.jpg" alt="114 學年度守月期間月相觀測紀錄（114 年 11 月 26 日），作為小米播種祭擇日之依據。" loading="lazy" width="730" height="730"></button><figcaption>114 學年度守月期間月相觀測紀錄（114 年 11 月 26 日），作為小米播種祭擇日之依據。</figcaption></figure></div></div><hr><h2 id="s13">六、佐證資料清單</h2><div class="drive"><div class="dh"><span class="dico" aria-hidden="true">📁</span><b>佐證資料夾（Google 雲端硬碟）</b><a href="https://drive.google.com/drive/folders/1yjNOq23Lwq4AGvwbp7EiI2TB1WyAPNyV?usp=sharing" target="_blank" rel="noopener">在新分頁開啟 ↗</a></div><iframe src="https://drive.google.com/embeddedfolderview?id=1yjNOq23Lwq4AGvwbp7EiI2TB1WyAPNyV#list" title="佐證資料夾" loading="lazy"></iframe></div>',toc:[{id:"s1",t:"一、指標原文"},{id:"s2",t:"二、學校現況說明"},{id:"s10",t:"三、114 學年度四項核心特質融入課程對應總表（互動網頁）"},{id:"s11",t:"四、112～114 學年度民族教育理念與泰雅文化實踐情形（互動網頁）"},{id:"s12",t:"五、精選照片"},{id:"s13",t:"六、佐證資料清單"}]},"1-2":{html:'<h2 id="s1">一、指標原文</h2><blockquote>依實驗教育計畫之實際執行情況</blockquote><hr><h2 id="s2">二、學校現況說明</h2><p>本校實驗教育之推動，均依據 112 至 114 學年度實驗教育計畫書規劃辦理，課程架構、教學安排及各項活動之實際執行，皆與計畫書之目標精神一致。</p><h3 id="s3">（一）縱向：年段主題課程與計畫書之對應</h3><p>本校文化課程依計畫書所規劃之三學習階段系統性實施，各年段主題與計畫書高度符合。</p><figure class="img"><button type="button" class="ph" data-full="img/full/441254db1a.jpg" data-cap="大同國中整體文化課程架構表" aria-label="放大照片：大同國中整體文化課程架構表"><img src="img/full/441254db1a.jpg" alt="大同國中整體文化課程架構表" loading="lazy" width="1600" height="958"></button><figcaption>大同國中整體文化課程架構表</figcaption></figure><p>七年級以傳統農耕生活為核心，引導學生從土地與自然的關係中認識泰雅傳統生活智慧；八年級以家族規範與傳統編織技藝為核心，深化學生對泰雅社會組織與文化倫理之理解；九年級以部落與山林的互動關係為核心，培養學生對族群歷史脈絡與山林文化之認識。</p><h3 id="s4">（二）橫向：四項學習面向之對應</h3><p>除縱向主題架構外，各年段課程亦依橫向學習面向分為四類，確保課程設計兼顧學習內涵之完整性與系統性，與計畫書規劃一致。</p><div class="cols" style="--tpl:50.00fr 50.00fr"><div class="col"><figure class="img"><button type="button" class="ph" data-full="img/full/b53fdbd1c9.png" data-cap="橫向學習面向重點說明" aria-label="放大照片：橫向學習面向重點說明"><img src="img/full/b53fdbd1c9.png" alt="橫向學習面向重點說明" loading="lazy" width="1362" height="734"></button><figcaption>橫向學習面向重點說明</figcaption></figure></div><div class="col"><figure class="img"><button type="button" class="ph" data-full="img/full/800a944af2.jpg" data-cap="橫向學習面向與各單元對應圖" aria-label="放大照片：橫向學習面向與各單元對應圖"><img src="img/full/800a944af2.jpg" alt="橫向學習面向與各單元對應圖" loading="lazy" width="1600" height="1456"></button><figcaption>橫向學習面向與各單元對應圖</figcaption></figure></div></div><h3 id="s5">（三）滾動修正機制</h3><p>本校自 113 學年度起，依據多年執行經驗啟動課程單元之滾動式修正，調整著重於單元整合、學習脈絡強化及自主學習能力培養，並非變動課程主軸與核心精神。114 學年度已完成課程調整並正式執行，相關調整說明亦依規定提報主管機關備查。</p><div class="tablewrap"><table class=""><tr><th scope="col">階段</th><th scope="col">執行情形</th><th scope="col">對應文件</th></tr><tr><td>啟動檢討</td><td>113 學年度依據多年執行經驗，就單元重複、學習脈絡連貫性提出調整需求</td><td>教學研究會會議紀錄</td></tr><tr><td>諮詢會議</td><td>召開實驗教育課程滾動式修正諮詢會議，就調整方向徵詢意見</td><td>新學期實驗教育課程滾動式修正諮詢會議紀錄</td></tr><tr><td>調整說明</td><td>完成課程滾動式調整說明及調整說明簡報，載明調整前後對照</td><td>大同國中 114 實驗教育課程滾動式調整說明、114 學年度實驗教育課程調整說明簡報</td></tr><tr><td>報請備查</td><td>依規定將課程單元調整報請主管機關同意備查</td><td>新學期課程單元調整同意備查公文</td></tr><tr><td>正式執行</td><td>114 學年度依調整後架構實施，並新增專題研究實作課程</td><td>114 學年度實驗學校課程計畫書</td></tr></table></div><p>本次課程調整確保課程設計持續符合計畫書精神，並進一步回應學生實際學習需求。</p><h3 id="s6">（四）計畫執行與成果結報</h3><p>本校各學年度實驗教育計畫均依核定內容執行，並依規定分期辦理成果報告與經費結報。</p><div class="tablewrap"><table class=""><tr><th scope="col">學年度</th><th scope="col">成果結報情形</th></tr><tr><td>112</td><td>第 1 期、第 2 期成果報告及經費結報表均已完成，並檢附財產增加單</td></tr><tr><td>113</td><td>第 1 期、第 2 期成果報告及經費結報表均已完成；第 2 期並依主管機關來函完成補件、修正及重新送件</td></tr><tr><td>114</td><td>第 1 期、第 2 期成果報告及經費結報表均已完成，並檢附財產增加單</td></tr></table></div><h3 id="s7">（五）外部檢核</h3><p>本校每學期接受國立東華大學原住民族課程發展協作中心期中輔導訪視，由委員就課程設計、教學實施及計畫執行情形提供專業意見，作為檢核實際執行與計畫書符合程度之外部機制。112 學年度第一學期至 114 學年度第一學期共完成五次訪視，各次均留有訪視簡報。</p><hr><div class="callout bg-gray_bg"><span class="ci" aria-hidden="true">ℹ️</span><div class="cb"><p>本指標以計畫書與實際執行之文件對照為主要佐證方式，故未另設精選照片；課程實施照片請見 <a class="mention" href="#p3-1" data-page="3-1"><span class="mi">🌿</span>3-1 課程教學、發展與落實</a> 與 <a class="mention" href="#p6-2" data-page="6-2"><span class="mi">🌾</span>6-2 學生學習部落歲時生活情形</a>。</p></div></div><hr><h2 id="s8">三、佐證資料清單</h2><div class="drive"><div class="dh"><span class="dico" aria-hidden="true">📁</span><b>佐證資料夾（Google 雲端硬碟）</b><a href="https://drive.google.com/drive/folders/1s2ep6dOwsx0UPROGGYfnR4E8aJ8tejXR?usp=sharing" target="_blank" rel="noopener">在新分頁開啟 ↗</a></div><iframe src="https://drive.google.com/embeddedfolderview?id=1s2ep6dOwsx0UPROGGYfnR4E8aJ8tejXR#list" title="佐證資料夾" loading="lazy"></iframe></div>',toc:[{id:"s1",t:"一、指標原文"},{id:"s2",t:"二、學校現況說明"},{id:"s8",t:"三、佐證資料清單"}]},"2-1":{html:'<h2 id="s1">一、指標原文</h2><blockquote>校園環境、學習設備、學校設施</blockquote><hr><h2 id="s2">二、學校現況說明</h2><p>本校積極爭取原住民族委員會、教育部、縣政府、鄉公所等各方資源，持續擴充文化學習環境並改善校園設施。</p><h3 id="s3">（一）文化學習場域</h3><p>本校校園保留山林自然風貌，逐年與部落耆老合作建置泰雅傳統建築群，活化校園空間，供小米播種祭（Smgatu）、祖靈感恩祭（Cmyus）儀式及文化課程實作使用，並針對現有傳統建築進行修繕，提升使用效率與安全性。</p><div class="tablewrap"><table class=""><tr><th scope="col">場域</th><th scope="col">主要教學用途</th></tr><tr><td>小米田</td><td>七年級燒墾管理、開墾播種、摘穗打米；小米生命週期貫穿歲時課程</td></tr><tr><td>苧麻園</td><td>八年級苧麻栽植管理、刮麻製線與染線之原料來源</td></tr><tr><td>傳統家屋</td><td>傳統建築工法教學；祭儀與文化課程情境學習場域</td></tr><tr><td>傳統穀倉</td><td>九年級傳統建築單元，由耆老到校與學生共作</td></tr><tr><td>瞭望台</td><td>傳統聚落空間結構之教學展示</td></tr><tr><td>工寮</td><td>七年級工寮搭建與三石灶實作；戶外課程據點</td></tr><tr><td>文化廊道</td><td>傳統地機編織等技藝課程之操作場域；學生文化作品成果展示</td></tr><tr><td>青年學習場域</td><td>文化課程共作、成果展示、祭儀場域與部落活動使用</td></tr></table></div><p>上述傳統建築場域不僅作為文化課程之重要教學載體，更使校園具備泰雅微型部落之功能。場域建置與修繕主要透過「112 泰雅傳統家屋維護整修計畫」及「112、115 年度營造原住民族文化學習場域實施計畫」爭取經費辦理。</p><h3 id="s4">（二）學習設備</h3><p>本校持續透過原民會及縣府實驗教育補助計畫，逐年規劃資本門經費添購教學輔助設備，配置涵蓋課前備課、課中數位教學、課後省思紀錄，以及田野調查、校外活動拍攝紀錄與成果展示等面向。</p><div class="tablewrap"><table class=""><tr><th scope="col">資本門設備</th><th scope="col">說明</th><th scope="col">經費來源</th></tr><tr><td>固定式投影機</td><td>架設於教室，供日常課程教學使用，提升教材呈現之清晰度與教學效率</td><td>112 學年度實驗教育計畫</td></tr><tr><td>口袋雲台相機</td><td>供教學影片拍攝、田野調查拍攝等用途，完整記錄課程歷程與文化踏查現場</td><td>112 學年度實驗教育計畫</td></tr><tr><td>行動式投影機</td><td>供學生展演、部落宣傳活動及成果發表等場合機動使用</td><td>112 學年度推動實驗計畫</td></tr><tr><td>數位相機</td><td>供課程活動影像紀錄使用，留存教學歷程，作為課程檢討與成果彙整之依據</td><td>113 學年度實驗教育計畫</td></tr><tr><td>雙頻道手提式無線擴音機</td><td>供部落踏查、戶外活動及祭儀辦理等場合使用，確保戶外教學語音傳達清晰</td><td>113 學年度推動實驗計畫</td></tr><tr><td>可移動式智慧液晶顯示器</td><td>於課程進行時播放細部教學影片，並兼作校外成果展示之載具</td><td>114 學年度實驗教育計畫</td></tr><tr><td>筆記型電腦</td><td>供文化教師於課前備課、課中數位教學及課後省思紀錄使用</td><td>114 學年度推動實驗計畫</td></tr></table></div><p>上述設備均已辦理財產增加程序並列冊管理，透過軟硬體設備之逐步充實，使文化教師得以結合數位影音資源進行教學，同時完整保存課程歷程紀錄。</p><h3 id="s5">（三）校園設施改善</h3><p>本校總務處積極爭取縣府工程補助，持續維護與改善校園基礎環境，以確保師生學習與生活之安全與舒適。本評鑑期間執行之工程涵蓋排水工程改善、廚房設施更新、老舊廁所整修、屋頂防水隔熱工程、飲用水設備改善、防災校園建置以及災損復建等。上述設施之改善有助於校園整體學習環境之提升，亦間接支持文化課程於校園各場域之順利實施。（各項工程之核定金額與主責處室詳見 <a class="mention" href="#p4-2" data-page="4-2"><span class="mi">🤝</span>4-2 外部資源之爭取情形</a>）</p><hr><h2 id="s6">三、精選照片</h2><div class="gallery" style="--cols:3"><figure><button type="button" class="ph" data-full="img/full/ef97f0316f.jpg" data-cap="傳統家屋" aria-label="放大照片：傳統家屋"><img src="img/thumb/ef97f0316f.jpg" alt="傳統家屋" loading="lazy" width="1600" height="1200"></button><figcaption>傳統家屋</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/37266da62b.jpg" data-cap="傳統穀倉" aria-label="放大照片：傳統穀倉"><img src="img/thumb/37266da62b.jpg" alt="傳統穀倉" loading="lazy" width="1600" height="1200"></button><figcaption>傳統穀倉</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/dfde80ab16.jpg" data-cap="青年學習場域" aria-label="放大照片：青年學習場域"><img src="img/thumb/dfde80ab16.jpg" alt="青年學習場域" loading="lazy" width="1600" height="1200"></button><figcaption>青年學習場域</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/a7a4d48ff0.jpg" data-cap="瞭望台" aria-label="放大照片：瞭望台"><img src="img/thumb/a7a4d48ff0.jpg" alt="瞭望台" loading="lazy" width="1600" height="1200"></button><figcaption>瞭望台</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/f32dc9381b.jpg" data-cap="文化廊道" aria-label="放大照片：文化廊道"><img src="img/thumb/f32dc9381b.jpg" alt="文化廊道" loading="lazy" width="1600" height="1200"></button><figcaption>文化廊道</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/f36d104035.jpg" data-cap="烤火屋" aria-label="放大照片：烤火屋"><img src="img/thumb/f36d104035.jpg" alt="烤火屋" loading="lazy" width="1600" height="1200"></button><figcaption>烤火屋</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/cb03fcada8.jpg" data-cap="九年級文化教室" aria-label="放大照片：九年級文化教室"><img src="img/thumb/cb03fcada8.jpg" alt="九年級文化教室" loading="lazy" width="1600" height="1200"></button><figcaption>九年級文化教室</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/79873c1e71.jpg" data-cap="八年級文化教室" aria-label="放大照片：八年級文化教室"><img src="img/thumb/79873c1e71.jpg" alt="八年級文化教室" loading="lazy" width="1600" height="1200"></button><figcaption>八年級文化教室</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/0a003c7b83.jpg" data-cap="七年級文化教室" aria-label="放大照片：七年級文化教室"><img src="img/thumb/0a003c7b83.jpg" alt="七年級文化教室" loading="lazy" width="1600" height="1200"></button><figcaption>七年級文化教室</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/766a574a0e.jpg" data-cap="學校後山獵徑" aria-label="放大照片：學校後山獵徑"><img src="img/thumb/766a574a0e.jpg" alt="學校後山獵徑" loading="lazy" width="1600" height="1200"></button><figcaption>學校後山獵徑</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/57a263b525.jpg" data-cap="苧麻園" aria-label="放大照片：苧麻園"><img src="img/thumb/57a263b525.jpg" alt="苧麻園" loading="lazy" width="1600" height="1200"></button><figcaption>苧麻園</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/10d8e2e024.jpg" data-cap="小米田" aria-label="放大照片：小米田"><img src="img/thumb/10d8e2e024.jpg" alt="小米田" loading="lazy" width="1600" height="1200"></button><figcaption>小米田</figcaption></figure></div><hr><h2 id="s7">四、佐證資料清單</h2><div class="drive"><div class="dh"><span class="dico" aria-hidden="true">📁</span><b>佐證資料夾（Google 雲端硬碟）</b><a href="https://drive.google.com/drive/folders/1cdTA0b7YtlapiK3GdMw-OkWgvFOgDGfc?usp=sharing" target="_blank" rel="noopener">在新分頁開啟 ↗</a></div><iframe src="https://drive.google.com/embeddedfolderview?id=1cdTA0b7YtlapiK3GdMw-OkWgvFOgDGfc#list" title="佐證資料夾" loading="lazy"></iframe></div>',toc:[{id:"s1",t:"一、指標原文"},{id:"s2",t:"二、學校現況說明"},{id:"s6",t:"三、精選照片"},{id:"s7",t:"四、佐證資料清單"}]},"2-2":{html:'<h2 id="s1">一、指標原文</h2><blockquote>推動實驗教育歷程中，學生受教權之維護、家長選擇權、學生輔導及生涯發展之辦理情形</blockquote><hr><h2 id="s2">二、學校現況說明</h2><h3 id="s3">（一）入學制度與家長選擇權</h3><p>本校實驗計畫採大學區制，學生入學不受戶籍所在地限制，設籍宜蘭縣之學生均可申請就讀。目前學生主要來自學區內南山、四季、茂安、英士等村之泰雅族學齡學生。</p><div class="tablewrap"><table class=""><tr><th scope="col">學年度</th><th scope="col">全校學生數</th><th scope="col">族群組成</th></tr><tr><td>112</td><td>41 人</td><td>均為泰雅族原住民學生</td></tr><tr><td>113</td><td>37 人</td><td>均為泰雅族原住民學生</td></tr><tr><td>114</td><td>33 人</td><td>均為泰雅族原住民學生</td></tr><tr><td>115</td><td>33 人</td><td>均為泰雅族原住民學生</td></tr></table></div><p>為使家長與學生充分了解本校辦學特色後自主選擇入學，本校每學年度積極辦理<b>學區國小招生宣導</b>，各場次採直接入班方式進行，說明內容涵蓋學校概況、實驗教育課程影片、課程內涵說明、學科學習與升學管道，並開放學生與家長現場提問；說明中發放學校簡介摺頁，供學生帶回由家長參閱。</p><div class="tablewrap"><table class=""><tr><th scope="col">學年度</th><th scope="col">宣導場次</th><th scope="col">宣導學校</th></tr><tr><td>113</td><td>5 場次</td><td>南山國小、四季國小、大同國小本校及松羅分校、樂水分校</td></tr><tr><td>114</td><td>7 場次</td><td>前述各校，另新增四季國小茂安分班、英士分校，並擴及三星國小</td></tr></table></div><p><b>學區學生就學選擇之現況與因應</b></p><p>本校全校學生數由 112 學年度 41 人逐年變動至 115 學年度 33 人。本校實驗計畫採大學區制，學區學齡學生得自由選擇就讀學校，部分學生選擇至平地學校就讀。此一情形於外部學術研究中亦有記錄：國立臺灣大學人類學系碩士論文（鄧教東，2024）指出，本校雖已轉型為民族實驗教育體制，惟周遭部落學生選擇下山就讀之人數逐漸增加；該研究並推測家長對「教育」及「原住民族教育」各有其理解方式，因而影響其教育選擇。</p><p>本校對此之因應，除前述逐年擴增之學區國小招生宣導外，並於 114 學年度配合各村落國小辦理之村校聯運設置實驗教育宣傳攤位，主動向部落居民與家長說明辦學成果，問卷有效回收 98 份，96.9％ 之參與者認同本校推動文化課程之方向；惟同一調查中亦有 9.2％ 之受訪者表示過去從未聽說本校推動實驗教育，顯示學校與部落家長之間的溝通仍待補強。家長溝通與學區宣導為本校持續辦理之工作，相關辦理情形另見指標 6-1 及 6-3。</p><div class="callout bg-brown_bg"><span class="ci" aria-hidden="true">🔍</span><div class="cb"><p><b>互動網頁｜外部觀察與學術研究</b></p><p>上述學術研究之相關發現（含就學選擇一項）及其完整引用資訊，詳見下方互動網頁。</p><p><a href="https://bacon-sys.github.io/115-eval-external-observer/" target="_blank" rel="noopener">在新分頁開啟 ↗</a></p></div></div><h3 id="s4">（二）學生輔導與就學支持</h3><p>學生就學期間，學校輔導室運作正常，由專任輔導教師提供學生個別輔導及諮詢服務，關注學生身心發展與學習適應情形。學校並定期辦理親師交流座談，建立家長與學校間之溝通管道，強化親師生三方連結，確保學生受教品質。</p><h3 id="s5">（三）生涯發展輔導</h3><p>本校持續辦理生涯講座及職涯參訪等活動，協助學生認識自身升學與就業之多元可能性。在升學管道上，除一般高中職及五專外，本校並推動九年級技藝專班，輔導學生發展個人性向，學生得前往聖母護專及羅東高工進行技職課程學習，並提供實用技能班及技優甄審等升學管道。</p><p>本校每學年度辦理學生性向與興趣調查，彙整為生涯輔導相關資料，作為個別輔導與升學建議之依據。</p><h3 id="s6">（四）升學流向</h3><figure class="embed local"><iframe src="embed/graduation_pathways_notion_agent_chart_111_114.html" title="111–114 學年度畢業生升學與就業流向" loading="lazy" data-autosize></iframe><figcaption>111–114 學年度畢業生升學與就業流向</figcaption></figure><p>升學管道以高中職及五專為主，顯示本校在深化學生文化學習之同時，亦能穩定銜接多元升學進路。</p><p>111 至 114 學年度畢業生共 61 人，其中 58 人升學，四年升學率 95.1％（111、112 學年度均為 100％）；未升學之 3 人皆為返家從事農務。入學管道以免試入學 22 人次最多，其次為五專優先免試入學 13 人次、實用技能學程 11 人次，另有以術科甄選或獨招入學者 9 人次、學習區完全免試 3 人次。上述統計以實際畢業生為範圍，不含修業生與非應屆生。</p><h3 id="s7">（五）畢業生後續進路追蹤（互動網頁）</h3><p>本校持續追蹤畢業生進入高中職後的升學與發展情形。109、110 兩學年度畢業生共 15 人（資料來源截至 115 年 3 月），其中 11 人進入大學校院，8 人就讀國立大學，包括國立政治大學（2 人）、國立臺灣師範大學、國立東華大學、國立高雄師範大學、國立體育大學（2 人）及國立暨南國際大學。</p><p>其中 6 人選擇原住民專班或族群相關系所，包括民族學系、民族語言與傳播學系、語言與文化學系原住民專班、體育推廣學系原住民專班及新聞傳播全媒體原住民專班。國中階段之民族文化學習，於數年之後轉化為高等教育階段之科系選擇，此一結果難以自國中教育會考成績預見。其中一名學生自國中文化課程延伸至大學科系選擇之完整歷程，另見指標 3-4 學生民族文化認知與認同。</p><div class="callout bg-brown_bg"><span class="ci" aria-hidden="true">🔗</span><div class="cb"><p><b>互動網頁｜學生基本學力與升學進路</b></p><p>以「起點－歷程－學科表現－升學結果－畢業後追蹤」五段結構，呈現新生入學起點、學習扶助成效、會考十二年趨勢、111～114 學年度升學率與入學管道分布，以及 109、110 學年度畢業生之後續進路一覽。</p><p><a href="https://bacon-sys.github.io/115-eval-academic/" target="_blank" rel="noopener">在新分頁開啟完整統計 ↗</a></p></div></div><hr><h2 id="s8">三、歷年生源分布（互動圖表）</h2><figure class="embed"><iframe src="https://bacon-sys.github.io/115-eval-recruit/2-2.html" title="歷年生源分布（107–114 學年度）" loading="lazy" allowfullscreen></iframe><figcaption>歷年生源分布（107–114 學年度）　<a href="https://bacon-sys.github.io/115-eval-recruit/2-2.html" target="_blank" rel="noopener">在新分頁開啟 ↗</a></figcaption></figure><hr><h2 id="s9">四、精選照片</h2><div class="gallery" style="--cols:3"><figure><button type="button" class="ph" data-full="img/full/191bb6c68e.jpg" data-cap="國小招生摺頁" aria-label="放大照片：國小招生摺頁"><img src="img/thumb/191bb6c68e.jpg" alt="國小招生摺頁" loading="lazy" width="1600" height="1131"></button><figcaption>國小招生摺頁</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/b5c2b00989.jpg" data-cap="南山國小招生宣導" aria-label="放大照片：南山國小招生宣導"><img src="img/thumb/b5c2b00989.jpg" alt="南山國小招生宣導" loading="lazy" width="1600" height="1200"></button><figcaption>南山國小招生宣導</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/c2fd03cd78.jpg" data-c ><figure><button type="button" class="ph" data-full="img/full/ced156f894.jpg" data-cap="九年級職涯參訪" aria-label="放大照片：九年級職涯參訪"><img src="img/thumb/ced156f894.jpg" alt="九年級職涯參訪" loading="lazy" width="1600" height="1200"></button><figcaption>九年級職涯參訪</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/a1623e868f.jpg" data-cap="九年級職涯參訪" aria-label="放大照片：九年級職涯參訪"><img src="img/thumb/a1623e868f.jpg" alt="九年級職涯參訪" loading="lazy" width="1600" height="1200"></button><figcaption>九年級職涯參訪</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/1fbcff0d55.jpg" data-cap="九年級職涯參訪" aria-label="放大照片：九年級職涯參訪"><img src="img/thumb/1fbcff0d55.jpg" alt="九年級職涯參訪" loading="lazy" width="1600" height="1200"></button><figcaption>九年級職涯參訪</figcaption></figure></div><hr><h2 id="s10">五、佐證資料清單</h2><div class="drive"><div class="dh"><span class="dico" aria-hidden="true">📁</span><b>佐證資料夾（Google 雲端硬碟）</b><a href="https://drive.google.com/drive/folders/1m0B8Iiir-PfAPFwr6L9VIY6QdHm-OHst?usp=sharing" target="_blank" rel="noopener">在新分頁開啟 ↗</a></div><iframe src="https://drive.google.com/embeddedfolderview?id=1m0B8Iiir-PfAPFwr6L9VIY6QdHm-OHst#list" title="佐證資料夾" loading="lazy"></iframe></div>',toc:[{id:"s1",t:"一、指標原文"},{id:"s2",t:"二、學校現況說明"},{id:"s8",t:"三、歷年生源分布（互動圖表）"},{id:"s9",t:"四、精選照片"},{id:"s10",t:"五、佐證資料清單"}]},"2-3":{html:'<h2 id="s1">一、指標原文</h2><blockquote>實驗教育相關師培結構（如原住民教師比例、部落耆老參與、族語認證能力、師培進用、師資增能等）</blockquote><hr><h2 id="s2">二、學校現況說明</h2><h3 id="s3">（一）師資結構與原住民族籍比例（互動網頁）</h3><p>本校自 106 學年度籌備期起，持續聘用認同實驗教育理念且具泰雅文化教學知能之師資。現行師資團隊除一般領域教師外，並包含泰雅族籍文化教師、專職族語老師、文化指導員、合理員額文化老師、族語教學支援人員及行政助理等；112 學年度並於宜蘭縣教師甄選中爭取一名文化領域正式教師，提升文化課程之穩定性。整體師資結構具備充足之文化教學能量。</p><div class="tablewrap"><table class=""><tr><th scope="col">項目</th><th scope="col">人數</th><th scope="col">說明</th></tr><tr><td>實驗教育相關教學與行政人力</td><td>19 人</td><td>含校長、專職族語教師、文化指導員、行政助理、教支人員、中教大助理（不含廚工、專任運動教練、幹事、校護、工友）</td></tr><tr><td>原住民族籍</td><td>10 人（約 53％）</td><td>泰雅族 9 人、排灣族 1 人</td></tr><tr><td>具族語能力認證</td><td>11 人（約 58％）</td><td>高級 3 人、中級 7 人、初級 1 人</td></tr><tr><td>方言別分布</td><td>12 人有明確方言別</td><td>賽考利克 8 人、四季 3 人、澤傲利 1 人</td></tr></table></div><div class="callout bg-brown_bg"><span class="ci" aria-hidden="true">🔗</span><div class="cb"><p><b>互動網頁｜師資結構：族語能力及耆老參與</b></p><p>含師資結構總覽圖表（19 人、原住民族籍比例、族語認證與方言別分布）、教職員工完整名冊，以及 20 位講師與部落耆老之授課單元對照。表格較長，建議於新分頁全螢幕檢視。</p><p><a href="https://bacon-sys.github.io/115-eval-teacher-structure/" target="_blank" rel="noopener">在新分頁開啟完整表格 ↗</a></p></div></div><div class="callout bg-gray_bg"><span class="ci" aria-hidden="true">📄</span><div class="cb"><p><b>師資進用管道</b>：本校每學年度依規辦理教師甄選，並分設「一般領域代理教師」與「泰雅文化代理教師」兩類簡章，另辦理教學支援工作人員及兼任教師甄選，確保文化課程師資之專業性與延續性。112 至 115 學年度各年度甄選簡章均列為佐證資料。</p></div></div><h3 id="s4">（二）部落耆老協同教學</h3><p>本校以文化教師為課程教學之主導，並視課程內容邀請具文化技藝專長之部落耆老入班協同教學，使學生得以直接與耆老互動、接受文化智慧之傳授。</p><figure class="embed local"><iframe src="embed/elder_collaboration_trend_notion_agent_chart.html" title="嵌入內容" loading="lazy" data-autosize></iframe></figure><div class="callout bg-gray_bg"><span class="ci" aria-hidden="true">ℹ️</span><div class="cb"><p>耆老協同節數逐年調整，主因為實驗教育補助經費調減致外聘鐘點受限，以及文化教師增能後已能自行主導部分單元教學。考量耆老之生命經驗與部落連結無可取代，本校仍持續邀請耆老入班協同，並非縮減文化課程。此外，每學年並邀請國家文化資產保存者（口簧琴、藤編工藝等領域）擔任授課講師，提升文化課程之深度與品質。</p></div></div><details class="tg"><summary>近三年文化課程外聘講師及耆老授課單元對照表（20 位）</summary><div class="tb"><div class="tablewrap"><table class=""><tr><th scope="col">耆老姓名</th><th scope="col">授課單元</th></tr><tr><td>李高琪</td><td>傳統歌謠與樂舞（社團）</td></tr><tr><td>韋建福</td><td>傳統建築</td></tr><tr><td>羅立雄</td><td>部落遷徙與族群關係（四季部落）、部落山川與傳統領域</td></tr><tr><td>江明清</td><td>竹製器具製作 lubuw（口簧琴）</td></tr><tr><td>陳茂樹</td><td>狩獵生態與體驗</td></tr><tr><td>簡連一</td><td>漁撈器具製作、藤製器具製作（gonyu 男用背簍）、傳統祭儀</td></tr><tr><td>林春勇</td><td>木製器物製作、狩獵器具製作</td></tr><tr><td>柯陳連琴</td><td>小米酒製作、小米醃肉製作</td></tr><tr><td>黃志堅</td><td>漁撈生態與體驗</td></tr><tr><td>溫金粒</td><td>漁撈生態與體驗</td></tr><tr><td>周健三</td><td>漁撈生態與體驗</td></tr><tr><td>彭佳珍</td><td>傳統地機編織</td></tr><tr><td>陳徐菊</td><td>傳統地機編織</td></tr><tr><td>楊三貴</td><td>部落遷徙與族群關係（英士部落）</td></tr><tr><td>黃天金</td><td>部落遷徙與族群關係（英士部落）</td></tr><tr><td>高萬年</td><td>部落遷徙與族群關係（南山部落）</td></tr><tr><td>百列優命</td><td>藤製器具製作</td></tr><tr><td>沈阿琴</td><td>傳統建築、傳統祭儀</td></tr><tr><td>李文幸</td><td>傳統建築</td></tr><tr><td>楊有福</td><td>傳統祭儀</td></tr></table></div></div></details><h3 id="s5">（三）教師族語認證與語言能力</h3><p>本校積極鼓勵教師參加族語認證，文化教師並利用週四上午自主開設族語加強班，持續精進族語能力。校內原住民族籍師資中持有族語認證者達 9 人，認證率 90％，其中高級認證 3 人、中級認證 6 人；非原住民族籍教師亦主動投入族語學習，目前有 1 位取得族語中級認證、1 位取得初級認證。</p><p>114 學年度起並於每週四上午將田野調查影像繕打為逐字稿，作為族語聽、說、讀、寫的實務練習。</p><h3 id="s6">（四）教師文化增能研習</h3><p>本校持續辦理多元教師增能活動，主題涵蓋傳統建築、傳統技藝、民族植物與生態知識、文化資產與知識建構、族語教學及縣外多元文化參訪等面向，系統性強化教師文化知能與課堂應用能力。</p><details class="tg"><summary>本評鑑期間教師增能研習一覽表</summary><div class="tb"><div class="tablewrap"><table class=""><tr><th scope="col">類別</th><th scope="col">研習時間</th><th scope="col">內容</th><th scope="col">地點</th></tr><tr><td>傳統技藝</td><td>112.08.07</td><td>傳統地機配件製作</td><td>大同國中</td></tr><tr><td>傳統技藝</td><td>113.02.27</td><td>傳統漁撈器具製作</td><td>樂水部落</td></tr><tr><td>傳統技藝</td><td>113.07.02</td><td>泰雅傳統漁獵生態體驗</td><td>寒溪部落</td></tr><tr><td>傳統技藝</td><td>113.08.19–20</td><td>傳統地機工字器具製作</td><td>四季部落</td></tr><tr><td>傳統技藝</td><td>114.01.21–22</td><td>傳統建築搭建—工寮</td><td>大同國中</td></tr><tr><td>傳統技藝</td><td>114.11.03、114.11.17</td><td>竹篾取材與處理</td><td>崙埤部落</td></tr><tr><td>傳統技藝</td><td>115.08.06–07</td><td>織足尋麻研習</td><td>大同國中</td></tr><tr><td>民族植物</td><td>113.04.30</td><td>在地民族植物的認識與應用</td><td>四季平台</td></tr><tr><td>民族植物</td><td>114.05.10</td><td>民族植物學</td><td>線上、崙埤</td></tr><tr><td>民族植物</td><td>114.11.27</td><td>手工皂製作</td><td>崙埤</td></tr><tr><td>族語學習</td><td>113 年 11–12 月</td><td>族語教學（高日昌老師）</td><td>大同國中、南山部落</td></tr><tr><td>族語學習</td><td>114 學年度每週四上午</td><td>田調資料逐字稿繕打，練習族語聽說讀寫</td><td>大同國中</td></tr><tr><td>縣外多元文化參訪</td><td>113.07.10–12</td><td>多元族群文化交流</td><td>臺東建和、達魯馬克</td></tr><tr><td>縣外多元文化參訪</td><td>114.07.02–04</td><td>多元族群文化交流</td><td>花蓮卓溪（布農族）</td></tr><tr><td>縣外多元文化參訪</td><td>115.01.27–30</td><td>「Wah！賽，泰精實」教師文化增能</td><td>新竹、苗栗</td></tr><tr><td>縣外多元文化參訪</td><td>115.04.23、115.04.29</td><td>臺博館館藏調研</td><td>國立臺灣博物館</td></tr><tr><td>縣外多元文化參訪</td><td>115.07.23–25</td><td>中投在地文化與美學實踐</td><td>臺中、南投</td></tr><tr><td>田野調查</td><td>113.11.19</td><td>傳統建築田野訪談</td><td>四季部落（沈阿琴）</td></tr><tr><td>田野調查</td><td>114.01.14</td><td>播種祭田野訪談</td><td>崙埤部落（楊有福）</td></tr><tr><td>田野調查</td><td>114.08.20</td><td>祖靈感恩祭田野訪談</td><td>崙埤部落（楊有福）</td></tr></table></div></div></details><h3 id="s7">（五）師資穩定性（互動網頁）</h3><p>本校近 14 年教師流動情形顯示，107 學年度轉型為原住民族實驗教育學校後，師資結構明顯趨於穩定。</p><div class="cols" style="--tpl:50.00fr 50.00fr"><div class="col"><div class="tablewrap"><table class=""><tr><th scope="col">期間</th><th scope="col">平均流動率</th><th scope="col">說明</th></tr><tr><td>轉型前（101–106 學年度）</td><td>約 13.3％</td><td>教師每年異動頻繁，六年共調出 9 人次</td></tr><tr><td>轉型後（107–114 學年度）</td><td>約 4.3％</td><td>師資結構趨於穩定，八年共調出 5 人次</td></tr><tr><td>其中 107–112 學年度</td><td>約 1.1％</td><td>連續六年間僅 1 位教師調動</td></tr></table></div><p>113、114 學年度雖各有 2 位教師調動，惟均為正常人事遞補，新進教師亦認同實驗教育理念，師資核心團隊整體延續性仍維持良好。穩定的師資結構有助於文化課程之持續深耕，亦確保學生在學期間得到連貫一致的教學支持。</p></div><div class="col"><div class="callout bg-brown_bg"><span class="ci" aria-hidden="true">🔗</span><div class="cb"><p><b>互動網頁｜近 14 年教師流動率彙整表（101–114 學年度）</b></p><p>逐年列示調入、調出教師數與全校教師總數（姓名已去識別化）。表格欄位較多，建議於新分頁全螢幕檢視。</p><p><a href="https://bacon-sys.github.io/115-eval-teacher-move/" target="_blank" rel="noopener">在新分頁開啟完整表格 ↗</a></p></div></div></div></div><p class="c-gray"><i>下方為完整網頁之文字版，可直接於本頁展開閱讀。</i></p><details class="tg"><summary>101–114 學年度逐年流動情形（文字版・已去識別化）</summary><div class="tb"><div class="tablewrap"><table class=""><tr><th scope="col">學年度</th><th scope="col">調（出）教師數</th><th scope="col">調（入）教師數</th><th scope="col">全校教師總數</th></tr><tr><td>101</td><td>0</td><td>0</td><td>12</td></tr><tr><td>102</td><td>1</td><td>1</td><td>12</td></tr><tr><td>103</td><td>2</td><td>2</td><td>12</td></tr><tr><td>104</td><td>2</td><td>1</td><td>11</td></tr><tr><td>105</td><td>2</td><td>2</td><td>11</td></tr><tr><td>106</td><td>2</td><td>2</td><td>11</td></tr><tr><td><b>107（轉型實驗教育 ption>司馬庫斯部落走訪</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/20db19b9de.jpg" data-cap="司馬庫斯部落走訪" aria-label="放大照片：司馬庫斯部落走訪"><img src="img/thumb/20db19b9de.jpg" alt="司馬庫斯部落走訪" loading="lazy" width="1280" height="960"></button><figcaption>司馬庫斯部落走訪</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/5911abaee5.jpg" data-cap="中投在地文化與美學實踐" aria-label="放大照片：中投在地文化與美學實踐"><img src="img/thumb/5911abaee5.jpg" alt="中投在地文化與美學實踐" loading="lazy" width="1280" height="960"></button><figcaption>中投在地文化與美學實踐</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/9499c0aa36.jpg" data-cap="中投在地文化與美學實踐" aria-label="放大照片：中投在地文化與美學實踐"><img src="img/thumb/9499c0aa36.jpg" alt="中投在地文化與美學實踐" loading="lazy" width="1280" height="960"></button><figcaption>中投在地文化與美學實踐</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/58455a655a.jpg" data-cap="中投在地文化與美學實踐" aria-label="放大照片：中投在地文化與美學實踐"><img src="img/thumb/58455a655a.jpg" alt="中投在地文化與美學實踐" loading="lazy" width="1280" height="960"></button><figcaption>中投在地文化與美學實踐</figcaption></figure></div><hr><h2 id="s9">四、佐證資料清單</h2><div class="drive"><div class="dh"><span class="dico" aria-hidden="true">📁</span><b>佐證資料夾（Google 雲端硬碟）</b><a href="https://drive.google.com/drive/folders/1NcFkRZ3j2ociJCX8At-Bm6DH5ZYBoaZV?usp=sharing" target="_blank" rel="noopener">在新分頁開啟 ↗</a></div><iframe src="https://drive.google.com/embeddedfolderview?id=1NcFkRZ3j2ociJCX8At-Bm6DH5ZYBoaZV#list" title="佐證資料夾" loading="lazy"></iframe></div>',toc:[{id:"s1",t:"一、指標原文"},{id:"s2",t:"二、學校現況說明"},{id:"s8",t:"三、精選照片"},{id:"s9",t:"四、佐證資料清單"}]},"3-1":{html:'<h2 id="s1">一、指標原文</h2><blockquote>課程設計、教學方法、班級經營、教材研發、教學正常化、文化回應教學</blockquote><hr><h2 id="s2">二、學校現況說明</h2><h3 id="s3">（一）課程設計與教材研發</h3><p>本校課程教學依各學年度實驗教育課程計畫確實執行，採雙文化學習設計，在保障學生一般學科受教權之前提下，同步推動泰雅族民族文化課程。</p><p>民族文化課程以泰雅族傳統歲時生活與 gaga 精神為核心主軸，依部落生活時序安排教學，年段主軸分為七年級「燒墾生活」、八年級「gaga 家庭與編織」、九年級「山林智慧」，並融入泰雅族傳統倫理、生活技能、部落遷徙歷史及社會組織等面向，採主題式教學模式設計。</p><p>文化課程全數採自編教材教案，由教師團隊逐年研發與修訂，並建置文化課程教案網站，系統性整理七至九年級各主題教學活動設計。學校另依課程單元研發族語文本，分賽考利克語與四季語兩種方言別，七至九年級各一冊，共六冊，強化文化課程與族語學習之連結。一般學科領域則依現行審定版本搭配補充教材進行授課。</p><p>自編教材教案亦透過校外甄選接受專業檢視：本校教師曾獲 113 年度原住民族文化優良教案甄選活動國中組甲等（全國），並於宜蘭縣原住民族語文及文化課程優良教案甄選中曾獲特優及佳作，顯示自編教案之品質已取得校外專業社群之肯定。</p><p><b>115 學年度文化課程架構與教案心智圖</b></p><figure class="embed tall"><iframe src="https://www.mindomo.com/mindmap/32fe29752f1342fa8aa5509e0dc15603" title="115 學年度文化課程架構（七年級燒墾生活・八年級 gaga 家庭與編織・九年級山林智慧）" loading="lazy" allowfullscreen></iframe><figcaption>115 學年度文化課程架構（七年級燒墾生活・八年級 gaga 家庭與編織・九年級山林智慧）　<a href="https://www.mindomo.com/mindmap/32fe29752f1342fa8aa5509e0dc15603" target="_blank" rel="noopener">在新分頁開啟 ↗</a></figcaption></figure><p class="c-gray">圖中可拖曳、縮放與展開各層節點，逐層檢視各年段主軸下之學習面向、課程單元與對應教案；亦可 <a href="https://www.mindomo.com/mindmap/32fe29752f1342fa8aa5509e0dc15603" target="_blank" rel="noopener">在新分頁全螢幕開啟 ↗</a>。</p><h3 id="s4">（二）教學方法與協同教學</h3><p>民族文化課程由文化教師主導教學，並依課程性質及單元需求邀請部落耆老入班協同教學，使文化知識之傳遞具備真實的生命經驗與部落脈絡。各年級文化課程除主授文化教師及部落耆老外，另安排文化指導員、東華協作中心駐校助理及行政助理隨班協同教學；部分課程搭配一般領域教師入班協同，專職族語教師則視單元需求入班進行族語文本教學。</p><p>教學方式強調實地學習，善用校園內建置之泰雅傳統建築群作為情境學習場域，並以體驗實作、田野踏查、分組合作、觀摩賞析、引導提問等多元策略實施，重視文化精神、倫理與情意之培養，而不僅止於技能與知識之傳授。</p><div class="tablewrap"><table class=""><tr><th scope="col">學年度</th><th scope="col">外聘耆老協同課程節數</th></tr><tr><td>112</td><td>453 節</td></tr><tr><td>113</td><td>418 節</td></tr><tr><td>114</td><td>291 節</td></tr></table></div><div class="callout bg-gray_bg"><span class="ci" aria-hidden="true">ℹ️</span><div class="cb"><p>耆老協同節數逐年調整，主因為實驗教育補助經費調減致外聘鐘點受限，以及文化教師增能後已能自行主導部分單元教學。考量耆老之生命經驗與部落連結無可取代，本校仍持續邀請耆老入班協同，並未縮減文化課程節數。</p></div></div><h3 id="s5">（三）課程發展機制與滾動修正</h3><p>本校定期召開教學研究會，由文化教師與協同領域教師共同參與，進行教案共備、說課、議課及前週課程教學檢討，作為課程滾動式修正之重要依據。教學研究會每週固定召開，112 學年度共計 33 場次、113 學年度共計 30 場次、114 學年度共計 32 場次。</p><p>每學年並配合國立東華大學原住民族課程發展協作中心期中訪視辦理校內自我評鑑，參採協作中心所訂評鑑內容，據以持續優化課程架構。114 學年度完成課程架構滾動式修正，調整三大年級主軸之單元架構，並新增專題研究實作課程，引導學生結合文化知識進行完整的研究歷程。</p><h3 id="s6">（四）文化回應教學</h3><p>本校積極推動一般領域課程與泰雅文化之整合。114 學年度以自然領域為發展主軸，已完成六份文化回應教學教案，並由自然科教師實際教學：</p><ul><li>無性生殖：苧麻的繁殖智慧（七年級下）</li><li>有性生殖：小米的繁殖智慧（七年級下）</li><li>物質的循環：燒墾的碳循環智慧（七年級下）</li><li>溫度與熱：蒸桶中的熱傳播（八年級上）</li><li>反應速率：苧麻染線的反應速率控制（八年級下）</li><li>日地月相對運動：守月期的天文智慧（九年級上）</li></ul><p>各領域教師亦依循往年慣例，於日常教學中運用泰雅文化背景知識來豐富教學情境，呈現不同程度之文化回應教學樣態。</p><h3 id="s7">（五）教學正常化</h3><p>所有一般學科領域課程均依課程綱要正常安排授課，教師依專長進行授課，評量依課程計畫進度設計，並遵守定期紙筆評量及相關規定，確保學生學科受教權不因實驗教育而有所減損。</p><p>雙文化課程並行之下，一般學科是否確實受到兼顧，學生自身的感受，也可作為另一項值得參考的佐證。九年級學生於漁獵課程省思影片中，向學區國小學弟妹介紹本校時，主動提及一般領域課程之安排：</p><blockquote>我們會有很多活動，還會有認識自己文化的課程，然後我們也有兼顧國語、數學、英文那一些的。<br>—— 九年級學生・漁獵課程省思影片</blockquote><p>該段係學生列舉本校特色時之自述，並非針對教學正常化之提問所得，可作為此一面向於學生端感受之旁證。</p><p class="c-gray"><i>（影片全文與其他學生省思引述，詳見 </i><i><a class="mention" href="#p3-4" data-page="3-4"><span class="mi">🪶</span>3-4 學生民族文化認知與認同</a></i><i> 之「重點引述」）</i></p><h3 id="s8">（六）外部專業支持與教學歷程紀錄（互動網頁）</h3><p>本校與國立東華大學原住民族課程發展協作中心合作，由協作中心指派駐校助理入校協作。駐校助理除隨班協同教學外，並以文字與影像持續記錄文化課程之實施歷程，另協助課程教材、學習單及校園族語環境之設計製作，累積本校課程發展之歷程性資料。</p><div class="callout bg-brown_bg"><span class="ci" aria-hidden="true">🔗</span><div class="cb"><p><b>互動網頁｜東華原民課程發展協作中心　駐校助理協作紀錄</b></p><p>含駐點小誌與課程紀錄 16 篇（連結至本校臉書專頁原始貼文），以及文宣設計與教材產出 11 項。內容較長，建議於新分頁全螢幕檢視。</p><p><a href="https://bacon-sys.github.io/115-eval-assistant/" target="_blank" rel="noopener">在新分頁開啟完整紀錄 ↗</a></p></div></div><h3 id="s9">（七）外部觀察與學術研究（互動網頁）</h3><p>114 學年度上學期，一位國立臺北教育大學教育創新與評鑑碩士班研究生進入本校文化課程進行四場觀課，並訪談文化課程教師三位。其獨立觀察指出，本校文化課以「做中學」與任務驅動為主要操作模式，課堂呈現「教師示範 → 學生觀察 → 學生逐步獨自操作」之學習歷程，學生行動節奏多由工作本身決定而非教師指令。</p><p>另一份為國立臺灣大學人類學系碩士論文（鄧教東，2024），其田野期間涵蓋 112 學年度完整一學年。該研究指出，本校一般課程之時程規劃很大程度上係配合文化課程調整，包括配合歲時祭儀、外聘耆老授課時間及需長時段一氣呵成之課程；亦記錄教學研究會議中教師對教案地方脈絡之相互檢核。</p><div class="callout bg-brown_bg"><span class="ci" aria-hidden="true">🔍</span><div class="cb"><p><b>互動網頁｜外部觀察與學術研究</b></p><p>彙整兩份外部資料：觀課與訪談報告（114 學年度）共 12 項發現，及人類學碩士論文（2024 年）共 14 項發現，可依指標篩選；並一併呈現研究者所指出之限制。</p><p><a href="https://bacon-sys.github.io/115-eval-external-observer/" target="_blank" rel="noopener">在新分頁開啟 ↗</a></p></div></div><hr><h2 id="s10">三、精選照片</h2><div class="gallery" st 09c.jpg" alt="九年級漁撈生態體驗" loading="lazy" width="1600" height="1200"></button><figcaption>九年級漁撈生態體驗</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/1593617990.jpg" data-cap="九年級口簧琴製作與演奏" aria-label="放大照片：九年級口簧琴製作與演奏"><img src="img/thumb/1593617990.jpg" alt="九年級口簧琴製作與演奏" loading="lazy" width="1600" height="1200"></button><figcaption>九年級口簧琴製作與演奏</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/ae7f65da68.jpg" data-cap="九年級藤製生活器具" aria-label="放大照片：九年級藤製生活器具"><img src="img/thumb/ae7f65da68.jpg" alt="九年級藤製生活器具" loading="lazy" width="1200" height="1600"></button><figcaption>九年級藤製生活器具</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/b2d47cc782.jpg" data-cap="九年級南山部落踏查" aria-label="放大照片：九年級南山部落踏查"><img src="img/thumb/b2d47cc782.jpg" alt="九年級南山部落踏查" loading="lazy" width="1477" height="1108"></button><figcaption>九年級南山部落踏查</figcaption></figure></div><hr><h2 id="s11">四、佐證資料清單</h2><div class="drive"><div class="dh"><span class="dico" aria-hidden="true">📁</span><b>佐證資料夾（Google 雲端硬碟）</b><a href="https://drive.google.com/drive/folders/1mEqH-Y4Z7pf-_PqUCEiJU0Q3zFE6k9iq?usp=sharing" target="_blank" rel="noopener">在新分頁開啟 ↗</a></div><iframe src="https://drive.google.com/embeddedfolderview?id=1mEqH-Y4Z7pf-_PqUCEiJU0Q3zFE6k9iq#list" title="佐證資料夾" loading="lazy"></iframe></div>',toc:[{id:"s1",t:"一、指標原文"},{id:"s2",t:"二、學校現況說明"},{id:"s10",t:"三、精選照片"},{id:"s11",t:"四、佐證資料清單"}]},"3-2":{html:'<h2 id="s1">一、指標原文</h2><blockquote>多元學習、差異化學習、學習扶助</blockquote><hr><h2 id="s2">二、學校現況說明</h2><h3 id="s3">（一）多元學習機會</h3><p>本校在實驗教育架構下，透過文化課程與一般領域課程雙軌並行，為學生提供多元學習機會。</p><ol><li><b>文化課程之替代性學習經驗</b>：透過農耕實作、田野踏查、傳統技藝製作及祭儀參與等方式，協助學生發展多元能力。對於在學科領域中遭遇挫折之學生，文化課程之實作情境常成為重拾學習信心之重要契機。</li><li><b>校外學習與國際交流</b>：學校規劃社區產業參訪與體驗實作、環境教育場所參訪、生涯發展與縣內五專參訪等活動。國際文化交流方面，本校與臺北歐洲學校已連續四年辦理跨文化交流活動，並接待新加坡花菲衛理中學及日本田園調布學園師生來訪。</li><li><b>競賽參與</b>：學生近年於族語及文化競賽屢有表現，曾獲全國語文競賽泰雅語朗讀組特優、全國原住民族語戲劇競賽社會組第一名及最佳男演員獎、全國原住民族語單詞競賽全國賽國中組第五名、全國學生舞蹈比賽優等。競賽準備歷程有助學生深化文化知識並展現學習成果。</li><li><b>適性發展管道</b>：九年級提供技藝專班選擇，學生得前往聖母護專及羅東高工進行技職課程學習，拓展升學與就業之多元管道。學校並成立文化青年團，招募本校畢業校友參與泰雅文化知能研習與活動，使文化學習延伸至校園之外。</li></ol><h3 id="s4">（二）差異化學習</h3><p>文化課程中，教師依學生個別差異採取彈性調整機制：對進度落後之學生，利用午休及第八節時間個別陪伴補強；對有特殊需求或情緒狀態不穩定之學生，由協同教師提供個別引導；並允許學生將作品帶回持續完成，尊重不同學生之學習節奏。課堂中廣泛運用分組合作學習，引導進度較快之學生主動協助同儕。</p><h3 id="s5">（三）學習扶助</h3><p>學校規劃第八節學習扶助課後輔導，並與博幼基金會合作於課中進行分組教學，針對不同學習程度之學生提供適切之個別化協助。本校透過學習扶助計畫進行教學診斷，針對學習落差學生提供差異化支持，並落實數位學習輔助。112 學年度曾獲宜蘭縣「學力提升支持與獎勵計畫」國中組（減 C 比率）乙組第一名。</p><p>依教育部國民小學及國民中學學生學習扶助科技化評量系統資料，本校 112 至 114 學年度受輔學生三年累計進步率為 78.44％（167 人次中 131 人次進步），與宜蘭縣全縣水準（76.9％～78.24％）相當。</p><div class="callout bg-gray_bg"><span class="ci" aria-hidden="true">ℹ️</span><div class="cb"><p>本校每年級僅一班，全校每年納入計算之受輔學生為 39 至 66 人次，各年級單科受輔人數多在 10 人以下。在此樣本規模下，一位學生是否達到進步標準，即可能使進步率變動 3％以上，故單一年度或單一科目之百分比波動屬統計常態，判讀時以三年累計與跨年趨勢為主。</p></div></div><h3 id="s6">（四）外部教學人力挹注</h3><p>本校自 113 學年度起爭取教育部「協助公立國民中小學引進部分工時外籍英語教學助理（ELTA）」計畫，由外籍教學助理入班協同英語教學，增加學生英語聽說之真實使用機會。</p><h3 id="s7">（五）學生體育專長之適性發展</h3><p>本校每年級僅一班，惟學生於田徑及長跑項目長期展現優異表現。112 至 115 學年度累計各項競賽獲獎 67 筆，其中體育類 49 筆、文化類 18 筆；就層級而言，全國級 37 筆、縣級 30 筆。體育專長之培養，係本校於文化課程與學科學習之外，為不同性向學生所保留之適性發展管道。</p><ol><li><b>族群性賽事之參與</b>：全國級體育獎項中有 12 筆來自全國原住民族運動會與全國泰雅族運動會，項目包括傳統路跑、4×400 公尺接力等。學生係以泰雅族青少年之身分參賽，體育表現因而不僅是個人性向之發展，亦是族群身分在公共場域中的展現，與本校 Tayal balay 願景相互呼應。</li><li><b>一般田徑賽事之表現</b>：學生曾獲全國中等學校運動會 3000 公尺第一名、全國中等學校田徑錦標賽 1500 公尺第二名、臺北市中正盃田徑賽標槍第一名；112、113 學年度並於臺北市青年盃田徑賽 1500 公尺、3000 公尺及 2000 公尺障礙等項目獲前三名。</li><li><b>縣級賽事之常態參與</b>：縣級獎項 30 筆中，體育類 20 筆，主要為宜蘭縣中小學田徑錦標賽 13 筆與宜蘭縣中小學運動會 7 筆，顯示參賽係逐年持續之常態，而非單一年度之偶發表現。</li></ol><p class="c-gray">各項獲獎之學年度分布、層級結構、賽事屬性與名次分布，詳見下方「師生優良表現四學年度趨勢」互動網頁。</p><h3 id="s8">（六）學生基本學力之現況與成長</h3><p>本校學生之學科學習表現，須置於其入學起點加以理解。依教育部國民小學及國民中學學生學習扶助科技化評量系統資料，本校 113 至 115 學年度入學新生於國小六年級所受篩選測驗之通過情形為：國語文 20 人通過（60.6％）、數學 12 人通過（36.4％）、英語 9 人通過（27.3％），三年合計受測 33 人。換言之，逾六成新生於入學時數學未達基本學力，英語未達基本學力者接近四分之三。</p><ol><li><b>補救教學之歷程</b>：如（三）所述，本校透過第八節學習扶助、博幼基金會課中分組教學及數位學習輔助進行補救，112 至 114 學年度受輔 167 人次中 131 人次於成長測驗呈現進步，三年累計進步率 78.44％。</li><li><b>學科表現之長期趨勢</b>：104 至 115 年國中教育會考，本校五科合計待加強（C）人次比例，由 70.8％（104～109 年，畢業 122 人）降至 62.3％（110～115 年，畢業 100 人），B 以上由 29.2％ 提升至 37.7％；五科均呈改善，其中國文降幅 12.6 個百分點、英文降幅 12.9 個百分點最為明顯，115 年 C 比例 50.0％ 為十二年來最低。本校自 107 學年度推動原住民族實驗教育，110 年為首屆完整接受三年實驗教育之畢業生。推動實驗教育期間，學生之學科表現不但未見退步，五科均呈改善趨勢。</li><li><b>判讀說明</b>：學習扶助篩選測驗與國中教育會考之施測對象、目的及標準均不相同，本校分列呈現，不作跨工具之換算或推論。本校每年畢業生為 12 至 24 人，單一年度之百分比波動屬統計常態，判讀時以跨年趨勢為主。</li><li><b>後續精進作為</b>：115 年的 C 比例 50.0％ 雖為十二年來最低，惟仍偏高。本校 115 學年度持續以下列方式回應：（1）維持第八節學習扶助課後輔導，依成長測驗結果調整受輔名單與教學重點；（2）延續與博幼基金會合作之課中分組教學，針對不同程度學生提供個別化協助；（3）英語科未來將積極申請 ELTA 外籍英語教學助理入班協同，增加聽說之真實使用情境；（4）持續以數位學習輔助工具進行診斷與個別化練習。</li></ol><p>完整之起點、歷程、會考趨勢與升學結果統計，詳見下方「學生基本學力與升學進路」互動網頁。</p><hr><h2 id="s9">三、學力表現互動分析（互動網頁）</h2><div class="cols" style="--tpl:50.00fr 50.00fr"><div class="col"><div class="callout bg-brown_bg"><span class="ci" aria-hidden="true">🔗</span><div class="cb"><p><b>互動網頁｜學習扶助成長測驗進步率三年分析</b></p><p>依教育部科技化評量系統資料，呈現 112 至 114 學年度本校與宜蘭縣、全國之受輔學生進步率比較，並附小校樣本規模之判讀說明。</p><p><a href="https://bacon-sys.github.io/115-eval-remedial/" target="_blank" rel="noopener">在新分頁開啟完整分析 ↗</a></p></div></div></div><div class="col"><div class="callout bg-brown_bg"><span class="ci" aria-hidden="true">🔗</span><div class="cb"><p><b>互動網頁｜學生基本學力與升學進路</b></p><p>以「起點－歷程－學科表現－升學結果－畢業後追蹤」五段結構，呈現 113～115 學年度新生入學時之學習扶助篩選測驗通過率、112～114 學年度學習扶助進步率、104～115 年會考十二年趨勢、111～114 學年度升學率與入學管道分布，以及 109、110 學年度畢業生之後續進路。</p><p><a href="https://bacon-sys.github.io/115-eval-academic/" target="_blank" rel="noopener">在新分頁開啟完整統計 ↗</a></p></div></div></div></div><hr><h2 id="s10">四、師生優良表現四學年度趨勢（互動網頁）</h2><div class="callout bg-brown_bg"><span class="ci" aria-hidden="true">🔗</span><div class="cb"><p><b>互動網頁｜師生優良表現四學年度趨勢</b></p><p>彙整 112 至 115 學年度各項競賽獲獎紀錄 67 筆，呈現學年度趨勢、層級分布、全國級體育獎項之賽事屬性與名次分布，並附全國級獎項 37 筆一覽表。</p><p><a href="https://bacon-sys.github.io/115-eval-award/" target="_blank" rel="noopener">在新分頁開啟完整統計 ↗</a></p></div></div><hr><h2 id="s11">五、精選照片</h2><div class="gallery" style="--cols:3"><figure><button type="button" class="ph" data-full="img/f
