h" data-full="img/full/b46e5a5639.jpg" data-cap="運用村校聯運進行學校實驗教育宣傳" aria-label="放大照片：運用村校聯運進行學校實驗教育宣傳"><img src="img/thumb/b46e5a5639.jpg" alt="運用村校聯運進行學校實驗教育宣傳" loading="lazy" width="1600" height="1200"></button><figcaption>運用村校聯運進行學校實驗教育宣傳</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/3af4474e40.jpg" data-cap="運用村校聯運進行學校實驗教育宣傳" aria-label="放大照片：運用村校聯運進行學校實驗教育宣傳"><img src="img/thumb/3af4474e40.jpg" alt="運用村校聯運進行學校實驗教育宣傳" loading="lazy" width="1600" height="1201"></button><figcaption>運用村校聯運進行學校實驗教育宣傳</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/7488c9f710.jpg" data-cap="家長參與親師座談（1）" aria-label="放大照片：家長參與親師座談（1）"><img src="img/thumb/7488c9f710.jpg" alt="家長參與親師座談（1）" loading="lazy" width="1477" height="1108"></button><figcaption>家長參與親師座談（1）</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/1345029e6a.jpg" data-cap="家長參與親師座談（2）" aria-label="放大照片：家長參與親師座談（2）"><img src="img/thumb/1345029e6a.jpg" alt="家長參與親師座談（2）" loading="lazy" width="1600" height="1200"></button><figcaption>家長參與親師座談（2）</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/d8bac5b3e0.jpg" data-cap="家長參與親師座談（3）" aria-label="放大照片：家長參與親師座談（3）"><img src="img/thumb/d8bac5b3e0.jpg" alt="家長參與親師座談（3）" loading="lazy" width="1600" height="1200"></button><figcaption>家長參與親師座談（3）</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/56c4005674.jpg" data-cap="sbalay 和解儀式現場：耆老吟唱" aria-label="放大照片：sbalay 和解儀式現場：耆老吟唱"><img src="img/thumb/56c4005674.jpg" alt="sbalay 和解儀式現場：耆老吟唱" loading="lazy" width="1600" height="900"></button><figcaption>sbalay 和解儀式現場：耆老吟唱</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/ee6c34ad7d.jpg" data-cap="sbalay 和解儀式現場：雙方陳述求和" aria-label="放大照片：sbalay 和解儀式現場：雙方陳述求和"><img src="img/thumb/ee6c34ad7d.jpg" alt="sbalay 和解儀式現場：雙方陳述求和" loading="lazy" width="1600" height="900"></button><figcaption>sbalay 和解儀式現場：雙方陳述求和</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/d5d635b531.jpg" data-cap="sbalay 和解儀式現場：班級代表一同參與" aria-label="放大照片：sbalay 和解儀式現場：班級代表一同參與"><img src="img/thumb/d5d635b531.jpg" alt="sbalay 和解儀式現場：班級代表一同參與" loading="lazy" width="1600" height="900"></button><figcaption>sbalay 和解儀式現場：班級代表一同參與</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/a90ad059bd.jpg" data-cap="sbalay 和解儀式現場：耆老祈告祖靈" aria-label="放大照片：sbalay 和解儀式現場：耆老祈告祖靈"><img src="img/thumb/a90ad059bd.jpg" alt="sbalay 和解儀式現場：耆老祈告祖靈" loading="lazy" width="1600" height="900"></button><figcaption>sbalay 和解儀式現場：耆老祈告祖靈</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/d996f4a511.jpg" data-cap="sbalay 和解儀式現場：埋石立約" aria-label="放大照片：sbalay 和解儀式現場：埋石立約"><img src="img/thumb/d996f4a511.jpg" alt="sbalay 和解儀式現場：埋石立約" loading="lazy" width="1600" height="900"></button><figcaption>sbalay 和解儀式現場：埋石立約</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/4f591b0d70.jpg" data-cap="文化老師向班級代表闡述事件來龍去脈" aria-label="放大照片：文化老師向班級代表闡述事件來龍去脈"><img src="img/thumb/4f591b0d70.jpg" alt="文化老師向班級代表闡述事件來龍去脈" loading="lazy" width="1600" height="900"></button><figcaption>文化老師向班級代表闡述事件來龍去脈</figcaption></figure></div><hr><h2 id="s11">五、佐證資料清單</h2><div class="drive"><div class="dh"><span class="dico" aria-hidden="true">📁</span><b>佐證資料夾（Google 雲端硬碟）</b><a href="https://drive.google.com/drive/folders/1_o3rxCzzP6Y6hHesozh2YtVtToG5nJ5j?usp=sharing" target="_blank" rel="noopener">在新分頁開啟 ↗</a></div><iframe src="https://drive.google.com/embeddedfolderview?id=1_o3rxCzzP6Y6hHesozh2YtVtToG5nJ5j#list" title="佐證資料夾" loading="lazy"></iframe></div>`,toc:[{id:"s1",t:"一、指標原文"},{id:"s2",t:"二、學校現況說明"},{id:"s9",t:"三、村校聯運宣傳活動問卷統計（互動圖表）"},{id:"s10",t:"四、精選照片"},{id:"s11",t:"五、佐證資料清單"}]},"6-2":{html:'<h2 id="s1">一、指標原文</h2><blockquote>學生對於部落事務之學習</blockquote><hr><h2 id="s2">二、學校現況說明</h2><p>隨著現代化的推進，傳統泰雅歲時生活之節奏已逐漸在部落中淡去，學生普遍缺乏親身體驗傳統祭儀與歲時文化之機會。本校透過文化課程之系統性設計，以小米生命週期為核心軸線，將傳統歲時生活之各項環節轉化為具體之學習體驗，使學生在三年國中生涯中完整走過泰雅族之歲時生活節奏。</p><h3 id="s3">（一）歲時祭儀之完整實踐</h3><p>學校依循傳統 gaga 規範，每學年辦理完整之祭儀序列。</p><figure class="img"><button type="button" class="ph" data-full="img/full/3631cc4c47.png" data-cap="泰雅歲時祭儀年度循環圖" aria-label="放大照片：泰雅歲時祭儀年度循環圖"><img src="img/full/3631cc4c47.png" alt="泰雅歲時祭儀年度循環圖" loading="lazy" width="1440" height="900"></button><figcaption>泰雅歲時祭儀年度循環圖</figcaption></figure><p>從守月到祭儀的完整歷程，使學生理解泰雅族歲時生活與祖靈信仰、土地倫理之間的深刻連結。各祭儀均留有籌備會議紀錄、儀式流程文件與現場紀錄。</p><p>守月除了包含準備祭儀之技能的學習，也具有「謹言慎行」的倫理要求。113 學年度起，本校進一步將此一倫理面向導入學生事務與輔導工作，使歲時祭儀不只是課程實作，也成為校園生活的規範依據。</p><p class="c-gray"><i>（守月期間之學輔工作機制、文化回應宣導與全校集體省思，詳見 </i><i><a class="mention" href="#p6-3" data-page="6-3"><span class="mi">💡</span>6-3 學校辦理民族教育之創新與省思</a></i><i> 之「magu byaling 與 sbalay 之校內制度化實踐」）</i></p><h3 id="s4">（二）課程結合歲時生活節奏</h3><p>各年段文化課程配合小米、苧麻之生長週期與山林季節之更迭，安排對應之學習單元。</p><div class="cols" style="--tpl:50.00fr 50.00fr"><div class="col"><div class="tablewrap"><table class=""><tr><th scope="col">年級</th><th scope="col">對應之歲時生活面向</th><th scope="col">主要學習內容</th></tr><tr><td>七年級</td><td>農耕燒墾之歲時循環</td><td>燒墾管理、植物辨識、食物製作與藤編工藝，感受泰雅人與土地共生之傳統智慧</td></tr><tr><td>八年級</td><td>苧麻生長與家族分工</td><td>深入 gaga 組織與傳統信仰，學習地機編織技藝，理解家族分工與文化傳承之意義</td></tr><tr><td>九年級</td><td>山林季節與狩獵漁撈時序</td><td>狩獵生態知識、傳統建築及口簧琴等學習，體現山林歲時之生活底蘊</td></tr></table></div><p>課程脈絡對應傳統泰雅生活節奏，使歲時文化不停留於知識層面，而能透過實作與體驗內化為學生之生命經驗。</p></div><div class="col"><figure class="img"><button type="button" class="ph" data-full="img/full/2029a44f17.jpg" data-cap="各單元配合歲時生活一覽圖" aria-label="放大照片：各單元配合歲時生活一覽圖"><img src="img/full/2029a44f17.jpg" alt="各單元配合歲時生活一覽圖" loading="lazy" width="1111" height="1600"></button><figcaption>各單元配合歲時生活一覽圖</figcaption></figure></div></div><h3 id="s5">（三）部落事務之參與與連結</h3><p>學生與部落之連結，透過九年級課程中之部落踏查具體落實：以部落山川與傳統領域、部落遷徙與族群關係、部落地圖繪製等單元為學習主軸，引導學生走入學區各部落，實地認識部落之歷史脈絡與土地關係。此外，部落如有辦理歲時活動，學校亦安排學生共同參與，在與部落族人之真實互動中，加深對部落生活之理解與文化認同。</p><h3 id="s6">（四）Pinsbkan 尋根之旅</h3><p>完成三年泰雅民族文化課程後，九年級學生於畢業前踏上回到祖居地 Pinsbkan 之尋根之旅，沿著泰雅族之遷徙路線重新認識自身之族群歷史與文化根源。本校 112 至 114 學年度均辦理，各年度均備有籌備會議紀錄、行程表、行前通知單、學生手冊、器材清單及活動成果報告，並於行前完成場勘。</p><div class="callout bg-gray_bg"><span class="ci" aria-hidden="true">ℹ️</span><div class="cb"><p>Pinsbkan 尋根之旅於 114 學年度文化課程學習回饋問卷中，獲九年級過半數學生票選為最有收穫之課程；學生之感受與回饋詳見 <a class="mention" href="#p3-4" data-page="3-4"><span class="mi">🪶</span>3-4 學生民族文化認知與認同</a>。</p></div></div><hr><h2 id="s7">三、精選照片</h2><div class="gallery" style="--cols:3"><figure><button type="button" class="ph" data-full="img/full/8f5b645b6d.jpg" data-cap="小米生長的歲時祭儀年度行事曆" aria-label="放大照片：小米生長的歲時祭儀年度行事曆"><img src="img/thumb/8f5b645b6d.jpg" alt="小米生長的歲時祭儀年度行事曆" loading="lazy" width="1254" height="1254"></button><figcaption>小米生長的歲時祭儀年度行事曆</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/fbf238d514.jpg" data-cap="守月期間之小米醃肉製作" aria-label="放大照片：守月期間之小米醃肉製作"><img src="img/thumb/fbf238d514.jpg" alt="守月期間之小米醃肉製作" loading="lazy" width="1600" height="1200"></button><figcaption>守月期間之小米醃肉製作</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/2b9d0ffb53.jpg" data-cap="守月期間之小米酒製作" aria-label="放大照片：守月期間之小米酒製作"><img src="img/thumb/2b9d0ffb53.jpg" alt="守月期間之小米酒製作" loading="lazy" width="1600" height="1200"></button><figcaption>守月期間之小米酒製作</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/562ebcca00.jpg" data-cap="守月期間之放置陷阱捕捉獵物" aria-label="放大照片：守月期間之放置陷阱捕捉獵物"><img src="img/thumb/562ebcca00.jpg" alt="守月期間之放置陷阱捕捉獵物" loading="lazy" width="1600" height="901"></button><figcaption>守月期間之放置陷阱捕捉獵物</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/892b3565e0.jpg" data-cap="小米播種祭（Smgatu），師生於清晨在傳統家屋內" aria-label="放大照片：小米播種祭（Smgatu），師生於清晨在傳統家屋內"><img src="img/thumb/892b3565e0.jpg" alt="小米播種祭（Smgatu），師生於清晨在傳統家屋內" loading="lazy" width="1600" height="1200"></button><figcaption>小米播種祭（Smgatu），師生於清晨在傳統家屋內</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/03638b443f.jpg" data-cap="學生至小米田進行小米播種" aria-label="放大照片：學生至小米田進行小米播種"><img src="img/thumb/03638b443f.jpg" alt="學生至小米田進行小米播種" loading="lazy" width="1600" height="900"></button><figcaption>學生至小米田進行小米播種</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/e510498d09.jpg" data-cap="小米收割日，師生於校園小米田旁" aria-label="放大照片：小米收割日，師生於校園小米田旁"><img src="img/thumb/e510498d09.jpg" alt="小米收割日，師生於校園小米田旁" loading="lazy" width="1600" height="1200"></button><figcaption>小米收割日，師生於校園小米田旁</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/662b9d8200.jpg" data-cap="九年級四季部落踏查" aria-label="放大照片：九年級四季部落踏查"><img src="img/thumb/662b9d8200.jpg" alt="九年級四季部落踏查" loading="lazy" width="1600" height="1200"></button><figcaption>九年級四季部落踏查</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/0720535cde.jpg" data-cap="九年級 Pinsbkan 尋根之旅" aria-label="放大照片：九年級 Pinsbkan 尋根之旅"><img src="img/thumb/0720535cde.jpg" alt="九年級 Pinsbkan 尋根之旅" loading="lazy" width="1477" height="1108"></button><figcaption>九年級 Pinsbkan 尋根之旅</figcaption></figure></div><hr><h2 id="s8">四、佐證資料清單</h2><div class="drive"><div class="dh"><span class="dico" aria-hidden="true">📁</span><b>佐證資料夾（Google 雲端硬碟）</b><a href="https://drive.google.com/drive/folders/1gyB3_Owz5gv3mTGkNaCLJU2jxWHhURVT?usp=sharing" target="_blank" rel="noopener">在新分頁開啟 ↗</a></div><iframe src="https://drive.google.com/embeddedfolderview?id=1gyB3_Owz5gv3mTGkNaCLJU2jxWHhURVT#list" title="佐證資料夾" loading="lazy"></iframe></div>',toc:[{id:"s1",t:"一、指標原文"},{id:"s2",t:"二、學校現況說明"},{id:"s7",t:"三、精選照片"},{id:"s8",t:"四、佐證資料清單"}]},"6-3":{html:'<h2 id="s1">一、指標原文</h2><blockquote>請學校提供亮點活動說明及省思過程</blockquote><hr><h2 id="s2">二、亮點活動說明</h2><h3 id="s3">（一）榮獲教育部教學卓越獎銀質獎</h3><p>本校以 Smgatu 課程方案參加 113 年度教育部教學卓越獎全國賽，榮獲銀質獎。評審委員肯定本校在民族文化傳承與創新教學上之突破與深度，為宜蘭縣原住民族實驗教育學校爭取全國性最高殊榮，亦是對本校多年來系統性推動民族教育成果之具體認可。</p><div class="callout bg-gray_bg"><span class="ci" aria-hidden="true">💡</span><div class="cb"><p><b>創新之處</b>在於：Smgatu 課程方案並未把祭儀視為年度性的體驗活動，而是將單一祭儀發展為具完整結構的課程設計——從守月期的月相觀測與擇日、籌備會議的分工、祭儀當日的實作，到事後的集體省思，構成一個可逐年檢討與滾動修正的完整歷程。得獎所肯定的並非活動本身，而是這套把歲時祭儀轉化為可操作課程的方法。</p></div></div><h3 id="s4">（二）sbalay 傳統和解儀式：將傳統規範延伸為公共事務之處理方式</h3><p>113 學年度，本校在處理校園文化場域借用爭議時，由學校主動倡議以泰雅族傳統 sbalay 機制取代行政申訴程序，引導公所、拍攝廠商與學校三方回歸 gaga 精神尋求和解。</p><div class="callout bg-gray_bg"><span class="ci" aria-hidden="true">💡</span><div class="cb"><p><b>創新之處</b>在於：將傳統規範從文化課程的教學內容，延伸為學校實際參與地方公共事務的處理方式。sbalay 不再只是課堂上講述的文化知識，而是學校在真實情境中選擇信任並啟動的解決機制。這也是本校「學校即部落」辦學理念之具體實踐——當衝突發生，學校選擇以祖先留下的方式回應，而非訴諸外部行政機制。</p></div></div><p>（事件經過、時序與三方處理歷程詳見 <a class="mention" href="#p6-1" data-page="6-1"><span class="mi">🏘️</span>6-1 部落互動與家長參與情形</a>）</p><h3 id="s5">（三）國際跨文化交流與文化能見度</h3><p>本校已連續四年與臺北歐洲學校、連續兩年與日本田園調布學園締結跨文化交流合作，每年接待外籍師生到校深度體驗泰雅文化技藝；前期亦曾接待新加坡花菲衛理中學等校師生來訪。交流活動中，學生不再只是文化的學習者，更化身為文化的傳遞者，以自身所學親自引導外國師生認識傳統工藝、理解泰雅文化的深度與精神。</p><p>這樣的跨文化對話，為學生創造了一個獨特的學習情境：當他們必須向來自不同文化背景的人說明自己的傳統，便是最深刻的文化理解與認同的時刻。數年交流累積下來，學生在真實的跨文化互動中逐漸建立對自身文化之自信，泰雅文化亦因此在國際場域中被看見。</p><p>114 學年度末，文化課程的學習成果進一步走入更大的國際場域。115 年 6 月 13 至 17 日於臺北舉行之國際扶輪年會，匯聚約 140 個國家、近 4 萬名扶輪領袖與國際賓客。本校提供學生於文化課程中依傳統工序釀製之小米酒，由扶輪社作為致贈全球扶輪貴賓之見面禮，並於瓶身設計泰雅文化介紹與說明，使國際賓客得以循瓶身文字理解其文化脈絡。</p><p>小米酒為泰雅族歲時祭儀之必備祭品。學生係於文化課程中及守月（magu byaling）期間，由耆老及文化老師指導釀製要領與相關禁忌，進而理解其在祭儀流程與家族倫理中之意義；此次對外致贈之小米酒，即以上述文化課程之學習成果為基礎。</p><div class="callout bg-gray_bg"><span class="ci" aria-hidden="true">💡</span><div class="cb"><p><b>創新之處</b>在於：文化課程的產出不再只停留於校內成果展示，而成為跨文化溝通的實體媒介。當學生的作品隨賓客帶回一百四十個國家，瓶身本身即是一份文化解說——學生雖不在現場，泰雅文化仍能為自己發聲。</p></div></div><p class="c-gray"><i>相關報導：</i><a href="https://www.ctee.com.tw/news/20260618702021-431208" target="_blank" rel="noopener"><i>工商時報</i></a><i>、</i><a href="https://news.m.pchome.com.tw/public/morenews/20260618/index-78177791244447350016.html" target="_blank" rel="noopener"><i>PChome 新聞</i></a><i>、</i><a href="https://n.yam.com/Article/20260618841781" target="_blank" rel="noopener"><i>蕃薯藤 yam</i></a><i>。完整媒體報導清單（共 16 家）另存於佐證資料夾。</i></p><h3 id="s6">（四）九年級 Pinsbkan 尋根之旅作為課程總結設計</h3><p>完成三年泰雅民族文化課程後，九年級學生於畢業前踏上回到祖居地 Pinsbkan 之尋根之旅。此一設計之意義在於：尋根之旅既是三年課程的總結，也是學生文化認同旅程的起點，象徵真正意義上的畢業與傳承。（行程規劃與辦理情形詳見 <a class="mention" href="#p6-2" data-page="6-2"><span class="mi">🌾</span>6-2 學生學習部落歲時生活情形</a>）</p><div class="callout bg-gray_bg"><span class="ci" aria-hidden="true">💡</span><div class="cb"><p><b>創新之處</b>在於：以「回到祖居地」作為三年課程的總結性設計，取代一般以紙筆測驗或書面報告收束課程的作法。學生走過遷徙路徑、站上族群起源之地，所檢驗的並非記得多少知識，而是能否將三年所學串連起來，形成對自身來處更深刻的理解。畢業前的最後一堂課因此不在教室裡，而在祖先出發的地方。</p></div></div><h3 id="s7">（五）magu byaling 與 sbalay 之校內制度化實踐（互動網頁）</h3><p>113 學年度小米播種祭（Smgatu）前之守月（magu byaling）期間，本校將泰雅族傳統規範導入學生事務與輔導工作，形成一套具文化脈絡之運作機制。該機制以守月時序為框架（113 年 11 月 27 日至 12 月 27 日），由學輔團隊辦理文化回應宣導，引導學生理解族人處理「未解之事」之傳統智慧；學生於期間內以四項核心特質檢視自身與群體之言行，並於期末以組織團體方式進行集體省思，形成全校共同的反思脈絡。</p><p>期間所發生之各項團體事件，無論正向表現或人際議題，均循 sbalay 之精神處理：先使事實浮現，再由當事人表達彼此之感受與需求，最後完成和解。校內並設置求助管道，供學生主動提出尚待處理之人際議題。祭儀是否照常舉辦，亦由各班級代表與校長開會共議後決定，使學生成為文化實踐之決策參與者。</p><div class="callout bg-gray_bg"><span class="ci" aria-hidden="true">💡</span><div class="cb"><p><b>創新之處</b>在於：將 gaga 由課程內容與對外事務，進一步落實至校內學生事務與輔導工作之日常運作。一般學校處理學生人際衝突多依獎懲規定與個別晤談辦理，本校則以祭儀時序為框架、以 sbalay 為處理程序、以四項核心特質為檢視軸線，使輔導管教工作本身成為文化實踐的一環，而非僅是文化課程的行政配套。</p></div></div><div class="cols" style="--tpl:50.00fr 50.00fr"><div class="col"><div class="callout bg-brown_bg"><span class="ci" aria-hidden="true">🔗</span><div class="cb"><p><b>互動網頁｜MAGU BYALING 謹言慎行：守月時期的自我省思與 sbalay 和解實踐</b></p><p>113 學年度學輔工作文化回應宣導之完整內容，含未解之事之徵候、sbalay 處理四步驟、「來得及」與「來不及」之對照，以及全校學生集體省思心智圖。內容較長，建議於新分頁全螢幕檢視。</p><p><a href="https://bacon-sys.github.io/115-eval-magubyaling/" target="_blank" rel="noopener">在新分頁開啟完整內容 ↗</a></p></div></div></div><div class="col"><figure class="img"><button type="button" class="ph" data-full="img/full/d3a9fe1517.png" data-cap="" aria-label="放大照片："><img src="img/full/d3a9fe1517.png" alt="" loading="lazy" width="1355" height="748"></button></figure></div></div><h3 id="s8">（六）回應前次評鑑建議：主動走入部落</h3><p>前次評鑑（112 學年度）委員建議學校加強與部落社區之主動連結與互動。本校於 114 學年度積極回應：配合各村落國小辦理村校聯運，於活動現場設置實驗教育宣傳攤位，主動向部落居民與家長說明學校辦學成果；問卷調查顯示 96.9％ 之參與者認同學校推動文化課程之方向，並有 9.2％ 之受訪者表示過去從未聽說學校推動實驗教育，顯示本次宣傳確實接觸到過去尚未了解本校實驗教育的居民。此外，本校持續推動文化青年團之運作，招收畢業校友參與泰雅文化知能研習，延伸文化教育至離校後之生命歷程。</p><p>以下依「宜蘭縣 112 學年度原住民族實驗教育評鑑結果報告書」中各項委員書面審查意見，摘錄具體建議事項，對照本校 112 至 115 年度之回應作法。委員意見中屬肯定性之敘述不列入本表。</p><div class="callout bg-brown_bg"><span class="ci" aria-hidden="true">🔗</span><div class="cb"><p><b>互動網頁｜前次評鑑（112 學年度）委員建議回應對照表</b></p><p>五大項目、共 13 項委員建議及本校回應作法之完整對照。表格較長，建議於新分頁全螢幕檢視。</p><p><a href="https://bacon-sys.github.io/115-eval-response/" target="_blank" rel="noopener">在新分頁開啟完整對照表 ↗</a></p></div></div><p class="c-gray"><i>下方五個項目為完整網頁之文字版，可直接於本頁展開閱讀。</i></p><details class="tg"><summary>項目一　實驗教育計畫之執行（3 項建議）</summary><div class="tb"><div class="tablewrap"><table class="fit"><tr><th scope="col">委員建議（摘錄）</th><th scope="col">本校回應作法</th></tr><tr><td>建議於特定評鑑項目，以「愛土地、負責、合作、感恩」四項人格特質為軸線，更具體呈現計畫理念之落實狀況。</td><td>彙整 112～114 學年度文化領域教學研究會會議紀錄，製作「112～114 學年度民族教育理念與泰雅文化實踐情形（四大特質視覺化）」，以四項特質為軸線逐學年呈現實踐運作方式與各年級課程實施情形，並引述會議紀錄中師生表現之具體實例。另推動質性成績單制度，由教師以文字具體描述學生展現四項特質之事例。</td></tr><tr><td>建議於新一期實驗教育計畫中，就例行性工作以外之內外活動參與，明列原則（甚至包括數量），以摸索合理工作負擔量。</td><td>本項未明列於新一期實驗教育計畫書；惟已於校務會議中，就外部活動之參與原則凝聚共識，以合理工作負擔量作為衡酌參與外部活動之依據。</td></tr><tr><td>提報下一期實驗教育計畫前，宜進行總檢討；對具挑戰之面向，宜有不同或創新的實驗作為。</td><td>113 學年度起依多年執行經驗啟動課程單元滾動式修正；114 學年度完成課程架構滾動式修正，調整三大年級主軸之單元架構，並新增專題研究實作課程。每學年參與課程計畫備查會議並依結論修正計畫書，每學期接受東華協作中心輔導諮詢並據委員意見調整。</td></tr></table></div></div></details><details class="tg"><summary>項目二　學生權益之維護（1 項建議）</summary><div class="tb"><div class="tablewrap"><table class="fit"><tr><th scope="col">委員建議（摘錄）</th><th scope="col">本校回應作法</th></tr><tr><td>建議未來文化課程可以結合領域課程再做深化，例如族語課程和英語課程和國語文課程，形成主題教學。</td><td>114 學年度起針對自然領域推動文化回應教學，已完成六份教案並依七至九年級課程進度規劃實施。委員原例示之語文領域結合，為本校後續持續推動之方向（詳見省思四）。</td></tr></table></div></div></details><details class="tg"><summary>項目三　師生教學之發展（6 項建議）</summary><div class="tb"><div class="tablewrap"><table class="fit"><tr><th scope="col">委員建議（摘錄）</th><th scope="col">本校回應作法</th></tr><tr><td>建議持續深化親知熟稔的教學方式，並逐步提升學生傳統知識文字撰寫及表達能力，促進新一代原住民未來能在原民知識文獻化工作上承擔部分角色。</td><td>學生於各課程單元持續記錄學習紀錄本，內容涵蓋課程內容、技術要點與文化知識。各年級學期末辦理課程統整口頭發表；114 學年度新增七、八年級專題基礎實務課程，九年級進入專題研究實作，以分組形式發表完整專題研究作品。</td></tr><tr><td>建議系統性檢視歸納哪些部定領域學習內容可與民族知識結合，分年選擇若干主題推動兩類知識的合作教學。</td><td>自然科文化回應教學教案即依年段分年選題：七年級（生殖與苧麻小米繁殖、燒墾碳循環）、八年級（蒸桶熱傳播、苧麻染線反應速率）、九年級（日地月相對運動與守月期），將部定自然領域學習內容與泰雅民族知識系統性結合。</td></tr><tr><td>有關 3-4 學生民族文化認知與認同之評估，建議結合學生參與各類校外競賽表現，透過自我檢討或教師側寫觀察，呈現學生文化認同認知的成長歷程。</td><td>已將族語朗讀、族語單詞、族語戲劇等各類競賽之準備與參賽歷程列為觀察學生文化認同提升情形之重要窗口，由帶隊教師觀察；並輔以每學期文化課程學習回饋問卷之質性彙整，及畢業生現況調查與文化認同回饋。</td></tr><tr><td>建議在既有經驗及材料的累積下，逐步建立模式或模組，讓後續新接手的各類教師能較快進入狀況。</td><td>持續累積並保存各年級文化課程教案及族語文本（已完成七至九年級四季語與賽考利克語族語文本）；教學研究會每週固定召開，進行教案共備、說課、議課（112 學年度 33 場次、113 學年度 30 場次、114 學年度 32 場次），使課程經驗得以傳承。課程模組化為持續推動之方向。</td></tr><tr><td>學校累積多年的田調及教學資料（包括文本及影音），建議尋求外部單位專業協助進行數位化儲存。</td><td>本校以攝影及資訊設備完整保存課程歷程紀錄，涵蓋課前備課、課中教學、課後省思、田野調查與成果展示等面向。與外部單位（如國教院原教中心、政大泰雅族知識中心）合作進行數位化儲存部分，尚未辦理。<b>後續規劃</b>：擬將田野調查影音資料之系統性數位化列為 115 學年度待辦事項，預計先完成校內現有資料之清點與分類，再洽詢外部專業單位協助之可行性。</td></tr><tr><td>學生與外校或國際交流是讓學生知己知彼最好機會，也是展現自信與瞭解多元文化最好的方式，充足的準備與規劃是必要的。</td><td>本校自 111 學年度起連續四年與臺北歐洲學校辦理跨文化交流，連續兩年與日本田園調布學園締結交流合作，並接待新加坡花菲衛理中學師生來訪；交流活動中由學生以自身所學引導外籍師生認識傳統工藝與泰雅文化。</td></tr></table></div></div></details><details class="tg"><summary>項目四　財務之透明健全（1 項建議）</summary><div class="tb"><div class="tablewrap"><table class="fit"><tr><th scope="col">委員建議（摘錄）</th><th scope="col">本校回應作法</th></tr><tr><td>建議經費做成表格統計，方便檢視瞭解。</td><td>115 年度評鑑報告書 4-1 已以表格統計各年度經費之計畫名稱、款別、核定數、執行數、賸餘數及執行率，便於檢視瞭解。本網站 <a class="mention" href="#p4-1" data-page="4-1"><span class="mi">📊</span>4-1 經費運用情形</a> 亦同步以表格呈現。</td></tr></table></div></div></details><details class="tg"><summary>項目五　民族教育發展特色（2 項建議）</summary><div class="tb"><div class="tablewrap"><table class="fit"><tr><th scope="col">委員建議（摘錄）</th><th scope="col">本校回應作法</th></tr><tr><td>建議加強部落家長溝通，配合家長農閒時期安排家長說明會和文化體驗課程。</td><td>114 學年度配合各村落國小辦理村校聯運，設置實驗教育宣傳攤位，主動向部落居民與家長說明辦學成果，問卷有效回收 98 份、96.9％ 認同文化課程方向。學區招生宣導由 113 學年度 5 場次擴增至 114 學年度 7 場次。每學期辦理親職座談，家長出席率逐步提升；文化課程部分單元引導學生訪問家長或請家長協助備材。每學年結合校慶辦理文化課程教學成果展。</td></tr><tr><td>建議未來民族教育課程加強跟一般領域的主題串聯，加深加廣，並導入部落創生、部落發展議題的專題報告。</td><td>領域主題串聯：114 學年度起推動自然科文化回應教學。部落議題專題：114 學年度九年級專題研究實作主題均為部落文化與發展議題，包括「大同泰雅三石灶的構造與家庭意義」「國民政府時期南山四季傳統地名由來」「現代對於男性織布的看法」「口簧琴影音製作與介紹」，於學期末分組發表完整研究作品。</td></tr></table></div></div></details><hr><h2 id="s9">三、民族教育省思（互動網頁）</h2><div class="callout bg-gray_bg"><span class="ci" aria-hidden="true">🤔</span><div class="cb"><p>省思一至四為本校辦理民族教育八年來持續自我追問之課題，照錄評鑑報告書原文。省思五就支撐課程運作之制度面限制加以說明。</p></div></div><div class="callout bg-brown_bg"><span class="ci" aria-hidden="true">🔗</span><div class="cb"><p><b>互動網頁｜民族教育省思與具體作為對照說明</b></p><p>五項省思之完整說明與對應之具體作為。</p><p><a href="https://bacon-sys.github.io/115-eval-reflection/" target="_blank" rel="noopener">在新分頁開啟完整說明 ↗</a></p></div></div><p class="c-gray"><i>下方為完整網頁之文字版，可直接於本頁展開閱讀。</i></p><details class="tg"><summary>省思一　我們為什麼要辦實驗教育？</summary><div class="tb"><p>本校自 107 學年度轉型實驗教育，出發點只有一個：讓這裡的孩子能夠真正認識自己的文化，成為 Tayal balay。這不是口號，而是一個需要在每一堂課、每一個學習決定中反覆檢視的問題。</p><p>八年來，外界對實驗教育的期待多元，有人看學科成績，有人看競賽名次，有人看活動辦得熱不熱鬧。每一次面對這些期待，我們都必須重新問自己：<b>這是我們原本想走的路嗎？</b> 這樣的自我追問，是本校推動民族教育最基本的起點，也是以下各點省思的共同背景。</p></div></details><details class="tg"><summary>省思二　學校的文化課程，和體驗營隊有什麼不同？</summary><div class="tb"><p>在推動文化課程的過程中，我們持續面對一個值得直視的問題：如果學生只是「做過」醃肉、「織過」布、「參加過」播種祭，而課程沒有引發反思、沒有建立認同，那麼學校存在的意義，就需要被重新檢視。</p><p>傳藝工坊與體驗營隊傳授的是技術，但學校能做的，是在三年連貫的時間軸上，將技藝、文化、信仰、土地倫理與族群認同編織在一起，讓學生不只「學過」，而是「<b>理解為什麼</b>」、「<b>知道這對我意味著什麼</b>」。</p><p>這條路仍在持續深化之中。如何確保每一個文化學習的當下都有足夠的反思空間，讓學生從操作者成為思考者，最終成為文化的認同者與傳承者，是本校課程發展最重要的方向，也是持續努力的目標。</p></div></details><details class="tg"><summary>省思三　為了維持計畫，我們在課程上做了哪些讓步？</summary><div class="tb"><p>這是我們必須誠實面對的困境：當績效成為評估實驗教育成效的主要方式，學校便承受著以競賽成績、得獎紀錄來回應外部期待的壓力。為維持計畫經費補助、通過評鑑檢核，我們有時不得不在課程設計與資源分配上，部分讓步於「看得見的成果」。</p><p>我們必須自問：讓學生密集備賽、追求名次，是在彰顯泰雅文化的價值，還是在用主流教育的邏輯，重新框架了原本應該是另一種樣貌的學習？競賽得名固然能帶來能見度與資源，但若因此壓縮了學生沉浸於文化學習的時間與空間，甚至讓學生將文化技藝視為表演而非生活，這樣的「績效」，恐怕正在侵蝕實驗教育最核心的意義。</p><p>面對這樣的拉扯，我們想要的選擇是：在必要的績效回應之外，<b>堅守文化學習的本質</b>，不以競賽準備取代課程深耕，並持續透過質性評量、學習歷程紀錄等方式，讓真實的學習成果被看見。我們也期待，評估框架能逐步納入更符合民族教育本質的指標，讓每一所實驗教育學校都能在不失去自己的前提下，繼續走這條值得走的路。</p></div></details><details class="tg"><summary>省思四　文化融入各領域，為何推動起來這麼難？</summary><div class="tb"><p>實驗教育的理想中，民族文化應能滲透至各領域的日常學習，然而實際推動上，結構性的困難遠比想像中大：國中各領域課程專業分工明確，學科目標與文化課程的節奏未必吻合，若強行結合，反而可能使文化融入流於形式，失去應有的深度。</p><p>面對這樣的困境，我們選擇誠實承認整合的難度，在可行之處逐步嘗試。114 學年度起，我們針對<b>自然領域</b>進行較深入的討論，尋找更適切的課程連結點。真正的文化回應教學，需要時間、信任與專業的長期積累，無法一蹴可幾，但這也正是實驗教育學校必須持續面對的課題。</p></div></details><details class="tg"><summary>省思五　撐住這套課程的，為什麼始終是人而不是制度？</summary><div class="tb"><p>本校民族文化課程推動至今八年，運作穩定。但支撐這份穩定的主要是教師的使命感與團隊默契，而非制度化的資源。這一點本校必須誠實指出。</p><p><b>師資</b>：文化課程尚無對應之教師證照與師資培育管道，本校文化教師均以代理教師身分聘用。本校自 107 學年度以來文化教師未曾異動，然而這是個人選擇的結果，不是制度保障的結果；一旦有教師離開，本校並無替補來源。族語教師之鐘點與交通條件，亦不利於長期投入。</p><p><b>教材</b>：文化課程沒有教科書，也沒有課綱。三個年級共 21 個主題單元之教學內容，均由文化教師訪談耆老、查閱文獻後逐年自行建構。教師投入於「準備教什麼」的時間，明顯多於投入「怎麼教得更好」。</p><p><b>族語</b>：族語在課堂之內是教學語言，走出教室即回到華語環境。部分年輕教師之族語能力尚不足以直接與耆老對談，文化知識之採集因而受限。本校以耆老協同教學與競賽輔導因應，但課堂之外的語言環境非學校單獨所能營造。</p><p><b>行政</b>：人力編制與經費核銷仍須依一般學校制度辦理。耆老鐘點、傳統材料採購等支出不易取得一般核銷所需之憑證，行政人員需另尋處理方式。</p><p>以上四項均非本校可自行解決，本校亦不以此作為成效不足之理由。本校能做的是把課程與教材留下來、把人留住，並在各項會議與全國性討論場合持續反映制度需求。若原住民族學校法及相關配套能完成立法，上述限制方有制度性的解方。</p><div class="callout bg-brown_bg"><span class="ci" aria-hidden="true">🔍</span><div class="cb"><p><b>外部觀察與學術研究對本項省思之對照</b></p><p>本項省思所述之制度性限制，於兩份外部研究中均獲得相近記錄。其一為觀課與訪談報告，於教師訪談中記錄本校文化課程面臨「耆老與長輩入班難度逐漸增加」、「缺乏族語語言環境，難以真正落實以族語教學」等困境，與本節陳述情形一致。其二為國立臺灣大學人類學系碩士論文（鄧教東，2024；田野期間涵蓋 112 學年度完整一學年），以整章篇幅論證文化教師因現行教育體制中無對應之學習科目而無法以正式教師聘任，並指出民族實驗教育體制並非為原住民族教育之需求所設計。兩項觀察均係在未與本校討論之情況下形成。</p><p><a href="https://bacon-sys.github.io/115-eval-external-observer/" target="_blank" rel="noopener">在新分頁開啟 ↗</a></p></div></div></div></details><figure class="embed local"><iframe src="embed/reflection_actions_visual.html" title="嵌入內容" loading="lazy" data-autosize></iframe></figure><p>五項省思與具體作為對照圖</p><details class="tg"><summary>省思與具體作為對照表（文字版）</summary><div class="tb"><div class="tablewrap"><table class="fit"><tr><th scope="col">省思</th><th scope="col">對應之具體作為</th><th scope="col">佐證位置</th></tr><tr><td>一、我們為什麼要辦實驗教育？</td><td>每學期接受東華原民課程發展協作中心輔導諮詢，定期檢視民族教育理念及文化課程落實情形；每學年依課程計畫備查會議結論滾動修正實驗教育課程計畫書</td><td>指標 1-1（東華協作輔導諮詢會議資料）</td></tr><tr><td>二、學校的文化課程，和體驗營隊有什麼不同？</td><td>三年連貫課程架構；質性成績單以文字描述取代單一分數；各年級學期末課程統整分享與專題研究發表</td><td>指標 3-1（文化課程教案）、指標 3-4（文化課程回饋質性描述）</td></tr><tr><td>三、為了維持計畫，我們在課程上做了哪些讓步？</td><td>以質性評量、學習歷程紀錄呈現真實學習成果：學生學習紀錄本、每學期文化課程學習回饋問卷、畢業生現況調查與文化認同回饋</td><td>指標 3-3、指標 3-4</td></tr><tr><td>四、文化融入各領域，為何推動起來這麼難？</td><td>114 學年度起針對自然領域發展文化回應教學，已完成六份教案並實際教學</td><td>指標 3-1（自然科文化回應教學教案）</td></tr><tr><td>五、撐住這套課程的，為什麼始終是人而不是制度？</td><td>保存各年級教案、族語文本與學生學習歷程紀錄；每週教學研究會共備、說課、議課；校內外增能與跨校共備交流；於課程計畫備查、輔導諮詢及全國性討論場合，持續反映師資培育管道與法規鬆綁之需求</td><td>指標 2-3（師資結構與教學增能）、指標 3-1（文化課程教案）</td></tr></table></div></div></details><hr><h2 id="s10">四、精選照片</h2><div class="cols" style="--tpl:33.33fr 33.33fr 33.33fr"><div class="col"><figure class="img"><button type="button" class="ph" data-full="img/full/0ca4720834.jpg" data-cap="學校團隊榮獲教育部教學卓越獎銀質獎" aria-label="放大照片：學校團隊榮獲教育部教學卓越獎銀質獎"><img src="img/full/0ca4720834.jpg" alt="學校團隊榮獲教育部教學卓越獎銀質獎" loading="lazy" width="1477" height="1108"></button><figcaption>學校團隊榮獲教育部教學卓越獎銀質獎</figcaption></figure></div><div class="col"><figure class="img"><button type="button" class="ph" data-full="img/full/cc01ce5dda.jpg" data-cap="九年級回到祖居地－Pinsbkan 尋根之旅" aria-label="放大照片：九年級回到祖居地－Pinsbkan 尋根之旅"><img src="img/full/cc01ce5dda.jpg" alt="九年級回到祖居地－Pinsbkan 尋根之旅" loading="lazy" width="1477" height="1108"></button><figcaption>九年級回到祖居地－Pinsbkan 尋根之旅</figcaption></figure></div><div class="col"><figure class="img"><button type="button" class="ph" data-full="img/full/4079f81bbe.jpg" data-cap="透過扶輪社致贈學生親釀小米酒給外國賓客" aria-label="放大照片：透過扶輪社致贈學生親釀小米酒給外國賓客"><img src="img/full/4079f81bbe.jpg" alt="透過扶輪社致贈學生親釀小米酒給外國賓客" loading="lazy" width="1477" height="1108"></button><figcaption>透過扶輪社致贈學生親釀小米酒給外國賓客</figcaption></figure></div></div><div class="cols" style="--tpl:33.33fr 33.33fr 33.33fr"><div class="col"><figure class="img"><button type="button" class="ph" data-full="img/full/d7df5d690f.jpg" data-cap="運用村校聯運時間進行學校實驗教育宣傳（1）" aria-label="放大照片：運用村校聯運時間進行學校實驗教育宣傳（1）"><img src="img/full/d7df5d690f.jpg" alt="運用村校聯運時間進行學校實驗教育宣傳（1）" loading="lazy" width="1600" height="1201"></button><figcaption>運用村校聯運時間進行學校實驗教育宣傳（1）</figcaption></figure></div><div class="col"><figure class="img"><button type="button" class="ph" data-full="img/full/dd64b7c94b.jpg" data-cap="運用村校聯運時間進行學校實驗教育宣傳（2）" aria-label="放大照片：運用村校聯運時間進行學校實驗教育宣傳（2）"><img src="img/full/dd64b7c94b.jpg" alt="運用村校聯運時間進行學校實驗教育宣傳（2）" loading="lazy" width="1600" height="1200"></button><figcaption>運用村校聯運時間進行學校實驗教育宣傳（2）</figcaption></figure></div><div class="col"><figure class="img"><button type="button" class="ph" data-full="img/full/1d08303c54.jpg" data-cap="運用村校聯運時間進行學校實驗教育宣傳（3）" aria-label="放大照片：運用村校聯運時間進行學校實驗教育宣傳（3）"><img src="img/full/1d08303c54.jpg" alt="運用村校聯運時間進行學校實驗教育宣傳（3）" loading="lazy" width="1600" height="1200"></button><figcaption>運用村校聯運時間進行學校實驗教育宣傳（3）</figcaption></figure></div></div><div class="cols" style="--tpl:33.33fr 33.33fr 33.33fr"><div class="col"><figure class="img"><button type="button" class="ph" data-full="img/full/5470905c7d.jpg" data-cap="與日本田園調布學園的學生交流泰雅文化技藝" aria-label="放大照片：與日本田園調布學園的學生交流泰雅文化技藝"><img src="img/full/5470905c7d.jpg" alt="與日本田園調布學園的學生交流泰雅文化技藝" loading="lazy" width="1477" height="1108"></button><figcaption>與日本田園調布學園的學生交流泰雅文化技藝</figcaption></figure></div><div class="col"><figure class="img"><button type="button" class="ph" data-full="img/full/05d52bf2cd.jpg" data-cap="與臺北歐洲學校的學生交流泰雅文化技藝" aria-label="放大照片：與臺北歐洲學校的學生交流泰雅文化技藝"><img src="img/full/05d52bf2cd.jpg" alt="與臺北歐洲學校的學生交流泰雅文化技藝" loading="lazy" width="1200" height="1600"></button><figcaption>與臺北歐洲學校的學生交流泰雅文化技藝</figcaption></figure></div><div class="col"><figure class="img"><button type="button" class="ph" data-full="img/full/dab6c86d2e.jpg" data-cap="與新加坡花菲衛理中學的學生交流泰雅文化技藝" aria-label="放大照片：與新加坡花菲衛理中學的學生交流泰雅文化技藝"><img src="img/full/dab6c86d2e.jpg" alt="與新加坡花菲衛理中學的學生交流泰雅文化技藝" loading="lazy" width="1600" height="1200"></button><figcaption>與新加坡花菲衛理中學的學生交流泰雅文化技藝</figcaption></figure></div></div><div class="cols" style="--tpl:50.00fr 50.00fr"><div class="col"><figure class="video"><div class="vf"><iframe src="https://www.youtube-nocookie.com/embed/TGyuGAB4DyI" title="影片" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe></div></figure><p class="sp"></p></div><div class="col"><figure class="video"><div class="vf"><iframe src="https://www.youtube-nocookie.com/embed/E5G9gFVByLk" title="影片" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe></div></figure></div></div><hr><h2 id="s11">五、佐證資料清單</h2><div class="drive"><div class="dh"><span class="dico" aria-hidden="true">📁</span><b>佐證資料夾（Google 雲端硬碟）</b><a href="https://drive.google.com/drive/folders/1rVnI_tF9GKElURgjCc8iniQUQumJbA7p?usp=sharing" target="_blank" rel="noopener">在新分頁開啟 ↗</a></div><iframe src="https://drive.google.com/embeddedfolderview?id=1rVnI_tF9GKElURgjCc8iniQUQumJbA7p#list" title="佐證資料夾" loading="lazy"></iframe></div>',toc:[{id:"s1",t:"一、指標原文"},{id:"s2",t:"二、亮點活動說明"},{id:"s9",t:"三、民族教育省思（互動網頁）"},{id:"s10",t:"四、精選照片"},{id:"s11",t:"五、佐證資料清單"}]},home:{html:'<h2 id="s1">壹、學校簡介</h2><div class="tablewrap"><table class="fit"><tr><th scope="row">校名</th><td>宜蘭縣立大同國民中學</td><td>校址</td><td>宜蘭縣大同鄉泰雅路四段 35 號</td></tr><tr><th scope="row">學校網址</th><td><a href="http://www.dtjh.ilc.edu.tw" target="_blank" rel="noopener">www.dtjh.ilc.edu.tw</a></td><td>電話</td><td>（03）9809611</td></tr><tr><th scope="row">班級數</th><td>普通班 3 班、技藝教育專班 1 班</td><td>學生數</td><td>33 人（七年級 11、八年級 9、九年級 13）</td></tr><tr><th scope="row">教職員工數</th><td>28 人</td><td>編制教師數</td><td>11 人（含校長）</td></tr><tr><th scope="row">校長</th><td>林武聰（115 學年度到職）</td><td>學生主要族群</td><td>泰雅族</td></tr></table></div><p>本校位居蘭陽溪上游、省道台七甲線五公里處，群山環抱。校區由省道分隔為南、北兩區，教學區約 14,000 平方公尺，運動區約 16,000 平方公尺，設有二座光電球場、200 公尺簡易田徑場與傳統小米園區。</p><p>本校採自由學區，學生來自南山、四季、茂安及英士等四村，與學校距離 6 至 25 公里不等，學區內計有南山國小、四季國小、四季國小英士分校及四季國小茂安分班等四所本、分、班校，學生主要族群為泰雅族。</p><hr><h2 id="s2">貳、Tayal balay 實驗教育願景</h2><div class="callout bg-brown_bg"><span class="ci" aria-hidden="true">🌱</span><div class="cb"><p><b>肯定原住民教育價值，找回原住民教育本質，讓學生成為 Tayal balay（真正的泰雅人）。</b></p></div></div><p>gaga 是泰雅生活裡最重要的精神信仰，是祖靈的話語與訓誡、是族人必須遵循的規範，涵蓋泰雅族對土地、自然、祖先、家族與共同體的關係準則。本校經全校師生共同討論，自 gaga 中析出四項核心特質，作為課程設計與校園生活之指導原則。</p><div class="cols" style="--tpl:50.00fr 50.00fr"><div class="col"><div class="callout bg-green_bg"><span class="ci" aria-hidden="true">🌏</span><div class="cb"><p><b>愛土地 mlahang rhzyal</b></p><p>透過農耕體驗、植物辨識與部落踏查，培養學生對自然環境的敬重與守護意識。</p></div></div><div class="callout bg-blue_bg"><span class="ci" aria-hidden="true">🤝</span><div class="cb"><p><b>合作 pkrraw</b></p><p>gaga 組織以換工、共禦為核心，透過協同學習與部落參與，理解相互扶持的意義。</p></div></div></div><div class="col"><div class="callout bg-orange_bg"><span class="ci" aria-hidden="true">🪶</span><div class="cb"><p><b>負責 ssyan inlungan</b></p><p>透過文化實作與日常事務的承擔，培養學生對自己、對群體負起應盡之責。</p></div></div><div class="callout bg-purple_bg"><span class="ci" aria-hidden="true">🙏</span><div class="cb"><p><b>感恩 smyuk kinhuway</b></p><p>透過歲時祭儀的參與與耆老智慧的聆聽，培養謙遜知足的人格特質。</p></div></div></div></div><p>上述理念透過七至九年級三階段主題式文化課程推動：七年級以<b>燒墾生活</b>學習傳統農耕文化，八年級以 <b>gaga 家庭與編織</b>理解族群信仰規範與傳統編織技藝，九年級以<b>山林智慧</b>探索部落遷徙歷史與自然生態知識。</p><hr><h2 id="s3">參、實驗教育沿革</h2><figure class="img"><button type="button" class="ph" data-full="img/full/8d13a6b1c7.jpg" data-cap="大同國中實驗教育沿革圖" aria-label="放大照片：大同國中實驗教育沿革圖"><img src="img/full/8d13a6b1c7.jpg" alt="大同國中實驗教育沿革圖" loading="lazy" width="1536" height="1024"></button><figcaption>大同國中實驗教育沿革圖</figcaption></figure><hr><h2 id="s4">肆、導覽快速入口</h2><div class="callout bg-yellow_bg"><span class="ci" aria-hidden="true">⏱️</span><div class="cb"><p><b>時間有限時，可依目的擇一路徑瀏覽。</b> 完整六大構面、17 項指標之架構請見下一節。</p></div></div><div class="cols" style="--tpl:50.00fr 50.00fr"><div class="col"><div class="callout bg-pink_bg"><span class="ci" aria-hidden="true">🌟</span><div class="cb"><p><b>想先看亮點與創新</b></p><p>教學卓越獎銀質獎、sbalay 傳統和解儀式、國際扶輪年會小米酒、Pinsbkan 尋根之旅、守月（magu byaling）之校內制度化實踐——五項亮點均附「創新之處」說明。</p><p><a class="mention" href="#p6-3" data-page="6-3"><span class="mi">💡</span>6-3 學校辦理民族教育之創新與省思</a></p></div></div><div class="callout bg-green_bg"><span class="ci" aria-hidden="true">✅</span><div class="cb"><p><b>想看前次評鑑建議的回應</b></p><p>112 學年度委員書面意見五大項目、共 13 項具體建議，逐項對照本校 112～115 年度之回應作法（見該頁「二、亮點活動說明」之「（六）回應前次評鑑建議」）。</p><p><a class="mention" href="#p6-3" data-page="6-3"><span class="mi">💡</span>6-3 學校辦理民族教育之創新與省思</a></p></div></div></div><div class="col"><div class="callout bg-blue_bg"><span class="ci" aria-hidden="true">📊</span><div class="cb"><p><b>想看數據與成效</b></p><p>升學進路與畢業生追蹤、學力起點與會考十二年趨勢、學習扶助進步率、獲獎統計、經費執行率。</p><p><a class="mention" href="#p2-2" data-page="2-2"><span class="mi">🎓</span>2-2 學生入學與就學情形</a></p><p><a class="mention" href="#p3-2" data-page="3-2"><span class="mi">🧭</span>3-2 學生多元學習與適性發展</a></p><p><a class="mention" href="#p4-1" data-page="4-1"><span class="mi">📊</span>4-1 經費運用情形</a></p></div></div><div class="callout bg-brown_bg"><span class="ci" aria-hidden="true">🌿</span><div class="cb"><p><b>想看課程與教學現場</b></p><p>課程架構心智圖、自編教案與族語文本、文化回應教學六案；以及歲時祭儀年度循環與學生的部落學習。</p><p><a class="mention" href="#p3-1" data-page="3-1"><span class="mi">🌿</span>3-1 課程教學、發展與落實</a></p><p><a class="mention" href="#p6-2" data-page="6-2"><span class="mi">🌾</span>6-2 學生學習部落歲時生活情形</a></p></div></div></div></div><hr><hr><h2 id="s90">伍、評鑑構面與指標</h2><div class="dimcards"><a class="dimcard" href="#pd1" data-page="d1" style="--dc:var(--d1)"><span class="di">📘</span><b>構面一　實驗教育計畫之執行</b><span class="dw">配分 20％</span><span class="dl">1-1 民族教育理念之落實與實施情形、1-2 與計畫書符合情形</span></a><a class="dimcard" href="#pd2" data-page="d2" style="--dc:var(--d2)"><span class="di">🏫</span><b>構面二　學生權益之維護</b><span class="dw">配分 20％</span><span class="dl">2-1 學習環境與設備資源、2-2 學生入學與就學情形、2-3 師資結構與教學增能</span></a><a class="dimcard" href="#pd3" data-page="d3" style="--dc:var(--d3)"><span class="di">📚</span><b>構面三　師生教學之發展</b><span class="dw">配分 30％</span><span class="dl">3-1 課程教學、發展與落實、3-2 學生多元學習與適性發展、3-3 學習成就多元評量、3-4 學生民族文化認知與認同</span></a><a class="dimcard" href="#pd4" data-page="d4" style="--dc:var(--d4)"><span class="di">💰</span><b>構面四　財務之透明健全</b><span class="dw">配分 5％</span><span class="dl">4-1 經費運用情形、4-2 外部資源之爭取情形</span></a><a class="dimcard" href="#pd5" data-page="d5" style="--dc:var(--d5)"><span class="di">⚖️</span><b>構面五　相關法規之遵行</b><span class="dw">配分 5％</span><span class="dl">5-1 符合學校型態實驗教育之精神與法規、5-2 符合實驗規範排除規定、5-3 縣訂訪評項目實施情形</span></a><a class="dimcard" href="#pd6" data-page="d6" style="--dc:var(--d6)"><span class="di">🌾</span><b>構面六　民族教育發展特色</b><span class="dw">配分 20％</span><span class="dl">6-1 部落互動與家長參與情形、6-2 學生學習部落歲時生活情形、6-3 學校辦理民族教育之創新與省思</span></a></div><h2 id="s5">陸、附錄：互動圖表與互動網頁一覽</h2><div class="callout bg-brown_bg"><span class="ci" aria-hidden="true">🧭</span><div class="cb"><p><b>網站地圖與互動網頁索引</b></p><p>以一頁式架構圖呈現六構面、十七指標之全貌；上方可切換至「互動網頁索引」，一覽本站各指標頁內建置之 20 件互動圖表與互動網頁。</p><p><a href="https://bacon-sys.github.io/115-eval-sitemap/" target="_blank" rel="noopener">在新分頁開啟網站地圖 ↗</a></p></div></div><details class="tg"><summary>互動圖表與互動網頁一覽（20 件）</summary><div class="tb"><div class="tablewrap"><table class="fit"><tr><th scope="col">指標</th><th scope="col">互動網頁</th><th scope="col">連結</th></tr><tr><td>1-1</td><td><b>114 學年度四項核心特質融入課程對應說明表</b><br>七至九年級各課程單元對應 gaga 四項核心特質之完整對照表。</td><td><a href="https://bacon-sys.github.io/115-eval-4-characters/" target="_blank" rel="noopener">開啟 ↗</a></td></tr><tr><td>1-1</td><td><b>112～114 學年度民族教育理念與泰雅文化實踐情形</b><br>彙整三年文化領域教學研究會紀錄，呈現理念落實之具體事例。</td><td><a href="https://bacon-sys.github.io/115-eval-tayal-balay/" target="_blank" rel="noopener">開啟 ↗</a></td></tr><tr><td>2-2</td><td><b>歷年生源分布（107–114 學年度）</b><br>逐年學生來源部落與人數變化。</td><td><a href="https://bacon-sys.github.io/115-eval-recruit/2-2.html" target="_blank" rel="noopener">開啟 ↗</a></td></tr><tr><td>2-2</td><td><b>學生基本學力與升學進路</b><br>起點、學習扶助成效、會考十二年趨勢、升學率與入學管道、畢業後追蹤五段結構。（3-2 亦連結本頁）</td><td><a href="https://bacon-sys.github.io/115-eval-academic/" target="_blank" rel="noopener">開啟 ↗</a></td></tr><tr><td>2-3</td><td><b>師資結構：族語能力及耆老參與</b><br>19 位教職員工名冊、族語認證與方言別分布，及 20 位講師與耆老授課單元對照。</td><td><a href="https://bacon-sys.github.io/115-eval-teacher-structure/" target="_blank" rel="noopener">開啟 ↗</a></td></tr><tr><td>2-3</td><td><b>近 14 年教師流動率彙整表（101–114 學年度）</b><br>逐年調入、調出與全校教師總數，姓名已去識別化。</td><td><a href="https://bacon-sys.github.io/115-eval-teacher-move/" target="_blank" rel="noopener">開啟 ↗</a></td></tr><tr><td>3-1</td><td><b>東華原民課程發展協作中心　駐校助理協作紀錄</b><br>駐點小誌與課程紀錄 16 篇、文宣設計與教材產出 11 項。</td><td><a href="https://bacon-sys.github.io/115-eval-assistant/" target="_blank" rel="noopener">開啟 ↗</a></td></tr><tr><td>3-2</td><td><b>學習扶助成長測驗進步率三年分析</b><br>112～114 學年度本校與宜蘭縣、全國之受輔學生進步率比較。</td><td><a href="https://bacon-sys.github.io/115-eval-remedial/" target="_blank" rel="noopener">開啟 ↗</a></td></tr><tr><td>3-2</td><td><b>師生優良表現四學年度趨勢</b><br>112～115 學年度競賽獲獎 67 筆之學年度趨勢、層級與賽事屬性分布。</td><td><a href="https://bacon-sys.github.io/115-eval-award/" target="_blank" rel="noopener">開啟 ↗</a></td></tr><tr><td>3-3</td><td><b>文化課程學習回饋統整（114 學年度）</b><br>可切換七、八、九年級；含樣本分布、最有收穫課程票選與跨年級成效地圖。</td><td><a href="https://bacon-sys.github.io/115-eval-feedback/3-3.html" target="_blank" rel="noopener">開啟 ↗</a></td></tr><tr><td>3-4</td><td><b>文化課程回饋質性證據彙整（114 學年度）</b><br>依五個面向彙整學生原文回饋之質性證據。</td><td><a href="https://bacon-sys.github.io/115-eval-feedback-qualitative/" target="_blank" rel="noopener">開啟 ↗</a></td></tr><tr><td>3-4</td><td><b>畢業校友現況調查與文化認同回饋</b><br>109～113 學年度畢業生 33 份回饋之調查結果與文化認同面向分析。</td><td><a href="https://bacon-sys.github.io/115-eval-graduate/" target="_blank" rel="noopener">開啟 ↗</a></td></tr><tr><td>3-4</td><td><b>外部觀察與學術研究</b><br>外部研究者觀課與訪談報告（114 學年度）12 項發現，及人類學碩士論文（2024 年）14 項發現，可依指標篩選；含研究者指出之限制。</td><td><a href="https://bacon-sys.github.io/115-eval-external-observer/" target="_blank" rel="noopener">開啟 ↗</a></td></tr><tr><td>4-1</td><td><b>實驗教育經費執行情形（112–114 學年度）</b><br>可切換「執行率」與「支出結構」兩種檢視。</td><td><a href="https://bacon-sys.github.io/115-eval-expenditure/4-1.html" target="_blank" rel="noopener">開啟 ↗</a></td></tr><tr><td>4-2</td><td><b>各處室爭取之外部資源（112–114 學年度）</b><br>三年 56 案之規模與用途結構，可依學年度、處室、用途篩選查詢完整明細。</td><td><a href="https://bacon-sys.github.io/115-eval-external-resources/" target="_blank" rel="noopener">開啟 ↗</a></td></tr><tr><td>5-1</td><td><b>檢視符合實驗教育精神之補充說明</b><br>依《學校型態實驗教育實施條例》逐條列示法規依據與本校辦學情形。</td><td><a href="https://bacon-sys.github.io/115-eval-rules/" target="_blank" rel="noopener">開啟 ↗</a></td></tr><tr><td>6-1</td><td><b>村校聯運宣傳攤位問卷統計（有效問卷 98 份）</b><br>七題問卷之作答分布，含來源部落與宣導成效。</td><td><a href="https://bacon-sys.github.io/115-eval-sports/6-1.html" target="_blank" rel="noopener">開啟 ↗</a></td></tr><tr><td>6-3</td><td><b>MAGU BYALING 謹言慎行：守月時期的自我省思與 sbalay 和解實踐</b><br>含 sbalay 處理四步驟與全校學生集體省思心智圖。</td><td><a href="https://bacon-sys.github.io/115-eval-magubyaling/" target="_blank" rel="noopener">開啟 ↗</a></td></tr><tr><td>6-3</td><td><b>民族教育省思與具體作為對照說明</b><br>五項省思之完整說明與對應之具體作為。</td><td><a href="https://bacon-sys.github.io/115-eval-reflection/" target="_blank" rel="noopener">開啟 ↗</a></td></tr><tr><td>6-3</td><td><b>前次評鑑（112 學年度）委員建議回應對照表</b><br>五大項目、共 13 項委員建議及本校回應作法之完整對照。</td><td><a href="https://bacon-sys.github.io/115-eval-response/" target="_blank" rel="noopener">開啟 ↗</a></td></tr></table></div></div></details>',toc:[{id:"s1",t:"壹、學校簡介"},{id:"s2",t:"貳、Tayal balay 實驗教育願景"},{id:"s3",t:"參、實驗教育沿革"},{id:"s4",t:"肆、導覽快速入口"},{id:"s90",t:"伍、評鑑構面與指標"},{id:"s5",t:"陸、附錄：互動圖表與互動網頁一覽"}]},d1:{html:'<p class="lead">本構面檢視本校民族教育理念如何落實於課程實施與校園生活，以及實際辦學作為與實驗教育計畫書之符合情形，包含 1-1、1-2 共二項指標。</p><p class="c-gray">點選下方指標卡片進入該指標頁面，內含「指標原文－學校現況說明－精選照片－佐證資料清單」四段固定結構。</p><div class="indcards"><a class="indcard" href="#p1-1" data-page="1-1"><span class="code">1-1</span><span class="t"><b>🌱 民族教育理念之落實與實施情形</b><small>民族教育理念與校本特質（泰雅文化）實踐運作方式及實踐情形</small><ul><li>Tayal balay 願景與 gaga 四項核心特質之課程落實</li><li>每週教學研究會作為理念檢核與修正機制</li><li>祭儀生活化與文化回應教學之推動</li><li>東華協作中心輔導諮詢與課程計畫備查</li></ul></span></a><a class="indcard" href="#p1-2" data-page="1-2"><span class="code">1-2</span><span class="t"><b>📋 與計畫書符合情形</b><small>依實驗教育計畫之實際執行情況</small><ul><li>三學習階 教育理念與四項核心特質","負責 ssyan inlungan gaga 規範中對自身行為與群體的承擔；言出必行、把分內之事做好。 完成分內工作與作品；對品質自我要求；主動利用課餘補足進度；承擔小組共同責任。"],["1-1","s3","（一）民族教育理念與四項核心特質","合作 pkrraw 共食共作、換工（sbayux）互助的部落生活方式；祭儀與農事中的集體分工。 依分工完成團體任務；主動協助同儕；跨年級混齡互助；於祭儀準備中清楚承擔自己的角色。"],["1-1","s3","（一）民族教育理念與四項核心特質","感恩 smyuk kinhuway 感謝祖靈、敬老惜福的祭儀精神；收穫來自祖靈祝福，應與人共享並回饋。 敬重耆老並珍惜其身教與技藝傳授；於祭儀中以行動感謝祖靈；珍惜土地與材料的給予；主動回饋群體。"],["1-1","s3","（一）民族教育理念與四項核心特質","上述理念透過七至九年級三階段主題式文化課程推動：七年級「燒墾生活」、八年級「gaga 家庭與編織」、九年級「山林智慧」。"],["1-1","s4","（二）理念之檢核與修正機制","（二）理念之檢核與修正機制"],["1-1","s4","（二）理念之檢核與修正機制","本校每學期依國立東華大學原住民族課程發展協作中心之輔導諮詢會議，定期檢視民族教育理念及文化課程之落實情形，並據委員意見進行回應與調整。112 學年度第一學期至 114 學年度第一學期共接受五次期中輔導訪視，每次均由委員填寫意見表，學校於次學期提出「前次輔導諮詢會議意見修正情形回饋單」，形成完整之意見回應循環。"],["1-1","s4","（二）理念之檢核與修正機制","每學年參與實驗教育課程計畫備查會議，依會議結論滾動修正實驗教育課程計畫書，確保課程設計持續符合部落實際文化脈絡與族群發展需求。112 至 115 學年度課程計畫均完成備查，並留有備查紀錄表與修正對照表。"],["1-1","s4","（二）理念之檢核與修正機制","協作中心指派駐校助理入校協作，除隨班協同教學外，並以文字與影像持續記錄文化課程之實施歷程，累積本校課程發展之歷程性資料。"],["1-1","s4","（二）理念之檢核與修正機制","（駐校助理之課程紀錄、駐點小誌與文宣設計成果，詳見 🌿3-1 課程教學、發展與落實 之「外部專業支持與教學歷程紀錄」）"],["1-1","s5","（三）理念之日常落實機制","（三）理念之日常落實機制"],["1-1","s5","（三）理念之日常落實機制","定期召開課程教學研究會（每週一次）"],["1-1","s5","（三）理念之日常落實機制","文化教師與協同教師共同進行備課、說課及議課，確保民族教育理念貫串於各年段課程設計與教學實施，並引導學生透過課程活動逐步內化四項核心特質。112 學年度召開 33 場次、113 學年度 30 場次、114 學年度 32 場次，均留有會議紀錄與簽到表。"],["1-1","s5","（三）理念之日常落實機制","落實祭儀生活化"],["1-1","s5","（三）理念之日常落實機制","學生從事前籌備到實際參與，全程體驗小米播種祭（Smgatu）、小米收割祭、祖靈感恩祭（Cmyus）等傳統祭儀。籌備階段由師生共同召開籌備會議分工，並於守月（magu byaling）期間持續進行月相觀測，作為祭儀擇日之依據，使學生在親身實踐中感受 gaga 的精神意涵與文化價值。"],["1-1","s5","（三）理念之日常落實機制","推動文化回應教學"],["1-1","s5","（三）理念之日常落實機制","於一般領域課程中融入泰雅族文化視角，使民族教育理念不侷限於文化課程，而能延伸至學生整體學習歷程。"],["1-1","s5","（三）理念之日常落實機制","（詳細教案內容請見 🌿3-1 課程教學、發展與落實）"],["1-1","s9","（四）四項核心特質融入課程之雙軌設計","（四）四項核心特質融入課程之雙軌設計"],["1-1","s9","（四）四項核心特質融入課程之雙軌設計","四項核心特質之融入採「課程即品格」原則，並以雙軌方式落實："],["1-1","s9","（四）四項核心特質融入課程之雙軌設計","明示融入：於課程設計、課堂常規與公開授課觀察表中明確檢核。公開授課觀察表第 11 項即為「是否將 Tayal balay 的特質融入課程中（明示或暗示）」。"],["1-1","s9","（四）四項核心特質融入課程之雙軌設計","暗示融入：透過歲時農耕、祭儀分工、耆老身教與共作情境，讓特質於文化實踐中自然內化。"],["1-1","s9","（四）四項核心特質融入課程之雙軌設計","每週教學研究會逐週檢視各單元之 雙頻道手提式無線擴音機 供部落踏查、戶外活動及祭儀辦理等場合使用，確保戶外教學語音傳達清晰 113 學年度推動實驗計畫"],["2-1","s4","（二）學習設備","可移動式智慧液晶顯示器 於課程進行時播放細部教學影片，並兼作校外成果展示之載具 114 學年度實驗教育計畫"],["2-1","s4","（二）學習設備","筆記型電腦 供文化教師於課前備課、課中數位教學及課後省思紀錄使用 114 學年度推動實驗計畫"],["2-1","s4","（二）學習設備","上述設備均已辦理財產增加程序並列冊管理，透過軟硬體設備之逐步充實，使文化教師得以結合數位影音資源進行教學，同時完整保存課程歷程紀錄。"],["2-1","s5","（三）校園設施改善","（三）校園設施改善"],["2-1","s5","（三）校園設施改善","本校總務處積極爭取縣府工程補助，持續維護與改善校園基礎環境，以確保師生學習與生活之安全與舒適。本評鑑期間執行之工程涵蓋排水工程改善、廚房設施更新、老舊廁所整修、屋頂防水隔熱工程、飲用水設備改善、防災校園建置以及災損復建等。上述設施之改善有助於校園整體學習環境之提升，亦間接支持文化課程於校園各場域之順利實施。（各項工程之核定金額與主責處室詳見 🤝4-2 外部資源之爭取情形）"],["2-1","s6","三、精選照片","三、精選照片"],["2-1","s6","三、精選照片","傳統家屋"],["2-1","s6","三、精選照片","傳統穀倉"],["2-1","s6","三、精選照片","青年學習場域"],["2-1","s6","三、精選照片","瞭望台"],["2-1","s6","三、精選照片","文化廊道"],["2-1","s6","三、精選照片","烤火屋"],["2-1","s6","三、精選照片","九年級文化教室"],["2-1","s6","三、精選照片","八年級文化教室"],["2-1","s6","三、精選照片","七年級文化教室"],["2-1","s6","三、精選照片","學校後山獵徑"],["2-1","s6","三、精選照片","苧麻園"],["2-1","s6","三、精選照片","小米田"],["2-1","s7","四、佐證資料清單","四、佐證資料清單"],["2-2","s1","一、指標原文","一、指標原文"],["2-2","s1","一、指標原文","推動實驗教育歷程中，學生受教權之維護、家長選擇權、學生輔導及生涯發展之辦理情形"],["2-2","s2","二、學校現況說明","二、學校現況說明"],["2-2","s3","（一）入學制度與家長選擇權","（一）入學制度與家長選擇權"],["2-2","s3","（一）入學制度與家長選擇權","本校實驗計畫採大學區制，學生入學不受戶籍所在地限制，設籍宜蘭縣之學生均可申請就讀。目前學生主要來自學區內南山、四季、茂安、英士等村之泰雅族學齡學生。"],["2-2","s3","（一）入學制度與家長選擇權","學年度 全校學生數 族群組成"],["2-2","s3","（一）入學制度與家長選擇權","112 41 人 均為泰雅族原住民學生"],["2-2","s3","（一）入學制度與家長選擇權","113 37 人 均為泰雅族原住民學生"],["2-2","s3","（一）入學制度與家長選擇權","114 33 人 均為泰雅族原住民學生"],["2-2","s3","（一）入學制度與家長選擇權","115 33 人 均為泰雅族原住民學生"],["2-2","s3","（一）入學制度與家長選擇權","為使家長與學生充分了解本校辦學特色後自主選擇入學，本校每學年度積極辦理學區國小招生宣導，各場次採直接入班方式進行，說明內容涵蓋學校概況、實驗教育課程影片、課程內涵說明、學科學習與升學管道，並開放學生與家長現場提問；說明中發放學校簡介摺頁，供學生帶回由家長參閱。"],["2-2","s3","（一）入學制度與家長選擇權","學年度 宣導場次 宣導學校"],["2-2","s3","（一）入學制度與家長選擇權","113 5 場次 南山國小、四季國小、大同國小本校及松羅分校、樂水分校"],["2-2","s3","（一）入學制度與家長選擇權","114 7 場次 前述各校，另新增四季國小茂安分班、英士分校，並擴及三星國小"],["2-2","s3","（一）入學制度與家長選擇權","學區學生就學選擇之現況與因應"],["2-2","s3","（一）入學制度與家長選擇權","本校全校學生數由 112 學年度 41 人逐年變動至 115 學年度 33 人。本校實驗計畫採大學區制，學區學齡學生得自由選擇就讀學校，部分學生選擇至平地學校就讀。此一情形於外部學術研究中亦有記錄：國立臺灣大學人類學系碩士論文（鄧教東，2024）指出，本校雖已轉型為民族實驗教育體制，惟周遭部落學生選擇下山就讀之人數逐漸增加；該研究並推測家長對「教育」及「原住民族教育」各有其理解方式，因而影響其教育選擇。"],["2-2","s3","（一）入學制度與家長選擇權","本校對此之因應，除前述逐年擴增之學區國小招生宣導外，並於 114 學年度配合各村落國小辦理之村校聯運設置實驗教育宣傳攤位，主動向部落居民與家長說明辦學成果，問卷有效回收 98 份，96.9％ 之參與者認同本校推動文化課程之方向；惟同一調查中亦有 9.2％ 之受訪者表示過去從未聽說本校推動實驗教育，顯示學校與部落家長之間的溝通仍待補強。家長溝通與學區宣導為本校持續辦理之工作，相關辦理情形另見指標 6-1 及 6-3。"],["2-2","s3","（一）入學制度與家長選擇權","互動網頁｜外部觀察與學術研究"],["2-2","s3","（一）入學制度與家長選擇權","上述學術研究之相關發現（含就學選擇一項）及其完整引用資訊，詳見下方互動網頁。"],["2-2","s3","（一）入學制度與家長選擇權","在新分頁開啟 ↗"],["2-2","s4","（二）學生輔導與就學支持","（二）學生輔導與就學支持"],["2-2","s4","（二）學生輔導與就學支持","學生就學期間，學校輔導室運作正常，由專任輔導教師提供學生個別輔導及諮詢服務，關注學生身心發展與學習適應情形。學校並定期辦理親師交流座談，建立家長與學校間之溝通管道，強化親師生三方連結，確保學生受教品質。"],["2-2","s5","（三）生涯發展輔導","（三）生涯發展輔導"],["2-2","s5","（三）生涯發展輔導","本校持續辦理生涯講座及職涯參訪等活動，協助學生認識自身升學與就業之多元可能性。在升學管道上，除一般高中職及五專外，本校並推動九年級技藝專班，輔導學生發展個人性向，學生得前往聖母護專及羅東高工進行技職課程學習，並提供實用技能班及技優甄審等升學管道。"],["2-2","s5","（三）生涯發展輔導","本校每學年度辦理學生性向與興趣調查，彙整為生涯輔導相關資料，作為個別輔導與升學建議之依據。"],["2-2","s6","（四）升學流向","（四）升學流向"],["2-2","s6","（四）升學流向","111–114 學年度畢業生升學與就業流向"],["2-2","s6","（四）升學流向","升學管道以高中職及五專為主，顯示本校在深化學生文化學習之同時，亦能穩定銜接多元升學進路。"],["2-2","s6","（四）升學流向","111 至 114 學年度畢業生共 61 人，其中 58 人升學，四年升學率 95.1％（111、112 學年度均為 100％）；未升學之 3 人皆為返家從事農務。入學管道以免試入學 22 人次最多，其次為五專優先免試入學 13 人次、實用技能學程 11 人次，另有以術科甄選或獨招入學者 9 人次、學習區完全免試 3 人次。上述統計以實際畢業生為範圍，不含修業生與非應屆生。"],["2-2","s7","（五）畢業生後續進路追蹤（互動網頁）","（五）畢業生後續進路追蹤（互動網頁）"],["2-2","s7","（五）畢業生後續進路追蹤（互動網頁）","本校持續追蹤畢業生進入高中職後的升學與發展情形。109、110 兩學年度畢業生共 15 人（資料來源截至 115 年 3 月），其中 11 人進入大學校院，8 人就讀國立大學，包括國立政治大學（2 人）、國立臺灣師範大學、國立東華大學、國立高雄師範大學、國立體育大學（2 人）及國立暨南國際大學。"],["2-2","s7","（五）畢業生後續進路追蹤（互動網頁）","其中 6 人選擇原住民專班或族群相關系所，包括民族學系、民族語言與傳播學系、語言與文化學系原住民專班、體育推廣學系原住民專班及新聞傳播全媒體原住民專班。國中階段之民族文化學習，於數年之後轉化為高等教育階段之科系選擇，此一結果難以自國中教育會考成績預見。其中一名學生自國中文化課程延伸至大學科系選擇之完整歷程，另見指標 3-4 學生民族文化認知與認同。"],["2-2","s7","（五）畢業生後續進路追蹤（互動網頁）","互動網頁｜學生基本學力與升學進路"],["2-2","s7","（五）畢業生後續進路追蹤（互動網頁）","以「起點－歷程－學科表現－升學結果－畢業後追蹤」五段結構，呈現新生入學起點、學習扶助成效、會考十二年趨勢、111～114 學年度升學率與入學管道分布，以及 109、110 學年度畢業生之後續進路一覽。"],["2-2","s7","（五）畢業生後續進路追蹤 。"],["3-1","s5","（三）課程發展機制與滾動修正","（三）課程發展機制與滾動修正"],["3-1","s5","（三）課程發展機制與滾動修正","本校定期召開教學研究會，由文化教師與協同領域教師共同參與，進行教案共備、說課、議課及前週課程教學檢討，作為課程滾動式修正之重要依據。教學研究會每週固定召開，112 學年度共計 33 場次、113 學年度共計 30 場次、114 學年度共計 32 場次。"],["3-1","s5","（三）課程發展機制與滾動修正","每學年並配合國立東華大學原住民族課程發展協作中心期中訪視辦理校內自我評鑑，參採協作中心所訂評鑑內容，據以持續優化課程架構。114 學年度完成課程架構滾動式修正，調整三大年級主軸之單元架構，並新增專題研究實作課程，引導學生結合文化知識進行完整的研究歷程。"],["3-1","s6","（四）文化回應教學","（四）文化回應教學"],["3-1","s6","（四）文化回應教學","本校積極推動一般領域課程與泰雅文化之整合。114 學年度以自然領域為發展主軸，已完成六份文化回應教學教案，並由自然科教師實際教學："],["3-1","s6","（四）文化回應教學","無性生殖：苧麻的繁殖智慧（七年級下）"],["3-1","s6","（四）文化回應教學","有性生殖：小米的繁殖智慧（七年級下）"],["3-1","s6","（四）文化回應教學","物質的循環：燒墾的碳循環智慧（七年級下）"],["3-1","s6","（四）文化回應教學","溫度與熱：蒸桶中的熱傳播（八年級上）"],["3-1","s6","（四）文化回應教學","反應速率：苧麻染線的反應速率控制（八年級下）"],["3-1","s6","（四）文化回應教學","日地月相對運動：守月期的天文智慧（九年級上）"],["3-1","s6","（四）文化回應教學","各領域教師亦依循往年慣例，於日常教學中運用泰雅文化背景知識來豐富教學情境，呈現不同程度之文化回應教學樣態。"],["3-1","s7","（五）教學正常化","（五）教學正常化"],["3-1","s7","（五）教學正常化","所有一般學科領域課程均依課程綱要正常安排授課，教師依專長進行授課，評量依課程計畫進度設計，並遵守定期紙筆評量及相關規定，確保學生學科受教權不因實驗教育而有所減損。"],["3-1","s7","（五）教學正常化","雙文化課程並行之下，一般學科是否確實受到兼顧，學生自身的感受，也可作為另一項值得參考的佐證。九年級學生於漁獵課程省思影片中，向學區國小學弟妹介紹本校時，主動提及一般領域課程之安排："],["3-1","s7","（五）教學正常化","我們會有很多活動，還會有認識自己文化的課程，然後我們也有兼顧國語、數學、英文那一些的。 —— 九年級學生・漁獵課程省思影片"],["3-1","s7","（五）教學正常化","該段係學生列舉本校特色時之自述，並非針對教學正常化之提問所得，可作為此一面向於學生端感受之旁證。"],["3-1","s7","（五）教學正常化","（影片全文與其他學生省思引述，詳見 🪶3-4 學生民族文化認知與認同 之「重點引述」）"],["3-1","s8","（六）外部專業支持與教學歷程紀錄（互動網頁）","（六）外部專業支持與教學歷程紀錄（互動網頁）"],["3-1","s8","（六）外部專業支持與教學歷程紀錄（互動網頁）","本校與國立東華大學原住民族課程發展協作中心合作，由協作中心指派駐校助理入校協作。駐校助理除隨班協同教學外，並以文字與影像持續記錄文化課程之實施歷程，另協助課程教材、學習單及校園族語環境之設計製作，累積本校課程發展之歷程性資料。"],["3-1","s8","（六）外部專業支持與教學歷程紀錄（互動網頁）","互動網頁｜東華原民課程發展協作中心 駐校助理協作紀錄"],["3-1","s8","（六）外部專業支持與教學歷程紀錄（互動網頁）","含駐點小誌與課程紀錄 16 篇（連結至本校臉書專頁原始貼文），以及文宣設計與教材產出 11 項。內容較長，建議於新分頁全螢幕檢視。"],["3-1","s8","（六）外部專業支持與教學歷程紀錄（互動網頁）","在新分頁開啟完整紀錄 ↗"],["3-1","s9","（七）外部觀察與學術研究（互動網頁）","（七）外部觀察與學術研究（互動網頁）"],["3-1","s9","（七）外部觀察與學術研究（互動網頁）","114 學年度上學期，一位國立臺北教育大學教育創新與評鑑碩士班研究生進入本校文化課程進行四場觀課，並訪談文化課程教師三位。其獨立觀察指出，本校文化課以「做中學」與任務驅動為主要操作模式，課堂呈現「教師示範 → 學生觀察 → 學生逐步獨自操作」之學習歷程，學生行動節奏多由工作本身決定而非教師指令。"],["3-1","s9","（七）外部觀察與學術研究（互動網頁）","另一份為國立臺灣大學人類學系碩士論文（鄧教東，2024），其田野期間涵蓋 112 學年度完整一學年。該研究指出，本校一般課程之時程規劃很大程度上係配合文化課程調整，包括配合歲時祭儀、外聘耆老授課時間及需長時段一氣呵成之課程；亦記錄教學研究會議中教師對教案地方脈絡之相互檢核。"],["3-1","s9","（七）外部觀察與學術研究（互動網頁）","互動網頁｜外部觀察與學術研究"],["3-1","s9","（七）外部觀察與學術研究（互動網頁）","彙整兩份外部資料：觀課與訪談報告（114 學年度）共 12 項發現，及人類學碩士論文（2024 年）共 14 項發現，可依指標篩選；並一併呈現研究者所指出之限制。"],["3-1","s9","（七）外部觀察與學術研究（互動網頁）","在新分頁開啟 ↗"],["3-1","s10","三、精選照片","三、精選照片"],["3-1","s10","三、精選照片","七年級工寮搭建"],["3-1","s10","三、精選照片","七年級竹製生活器具"],["3-1","s10","三、精選照片","七年級木製生活器具"],["3-1","s10","三、精選照片","七年級苧麻栽植"],["3-1","s10","三、精選照片","七年級藤製生活器具"],["3-1","s10","三、精選照片","七年級專題基礎實務"],["3-1","s10","三、精選照片","八年級 smye 儀式介紹"],["3-1","s10","三、精選照片","八年級泰雅族流域服飾與技法"],["3-1","s10","三、精選照片","八年級弓織技藝應用"],["3-1","s10","三、精選照片","八年級傳統地機編織"],["3-1","s10","三、精選照片","八年級苧麻採收與製線"],["3-1","s10","三、精選照片","八年級苧麻染線"],["3-1","s10","三、精選照片","九年級狩獵陷阱分辨與製作"],["3-1","s10","三、精選照片","九年級陷阱放置實作"],["3-1","s10","三、精選照片","九年級漁撈生態體驗"],["3-1","s10","三、精選照片","九年級口簧琴製作與演奏"],["3-1","s10","三、精選照片","九年級藤製生活器具"],["3-1","s10","三、精選照片","九年級南山部落踏查"],["3-1","s11","四、佐證資料清單","四、佐證資料清單"],["3-2","s1","一、指標原文","一、指標原文"],["3-2","s1","一、指標原文","多元學習、差異化學習、學習扶助"],["3-2","s2","二、學校現況說明","二、學校現況說明"],["3-2","s3","（一）多元學習機會","（一）多元學習機會"],["3-2","s3","（一）多元學習機會","本校在實驗教育架構下，透過文化課程與一般領域課程雙軌並行，為學生提供多元學習機會。"],["3-2","s3","（一）多元學習機會","文化課程之替代性學習經驗：透過農耕實作、田野踏查、傳統技藝製作及祭儀參與等方式，協助學生發展多元能力。對於在學科領域中遭遇挫折之學生，文化課程之實作情境常成為重拾學習信心之重要契機。"],["3-2","s3","（一）多元學習機會","校外學習與國際交流：學校規劃社區產業參訪與體驗實作、環境教育場所參訪、生涯發展與縣內五專參訪等活動。國際文化交流方面，本校與臺北歐洲學校已連續四年辦理跨文化交流活動，並接待新加坡花菲衛理中學及日本田園調布學園師生來訪。"],["3-2","s3","（一）多元學習機會","競賽參與：學生近年於族語及文化競賽屢有表現，曾獲全國語文競賽泰雅語朗讀組特優、全國原住民族語戲劇競賽社會組第一名及最佳男演員獎、全國原住民族語單詞競賽全國賽國中組第五名、全國學生舞蹈比賽優等。競賽準備歷程有助學生深化文化知識並展現學習成果。"],["3-2","s3","（一）多元學習機會","適性發展管道：九年級提供技藝專班選擇，學生得前往聖母護專及羅東高工進行技職課程學習，拓展升學與就業之多元管道。學校並成立文化青年團，招募本校畢業校友參與泰雅文化知能研習與活動，使文化學習延伸至校園之外。"],["3-2","s4","（二）差異化學習","（二）差異化學習"],["3-2","s4","（二）差異化學習","文化課程中，教師依學生個別差異採取彈性調整機制：對進度落後之學生，利用午休及第八節時間個別陪伴補強；對有特殊需求或情緒狀態不穩定之學生，由協同教師提供個別引導；並允許學生將作品帶回持續完成，尊重不同學生之學習節奏。課堂中廣泛運用分組合作學習，引導進度較快之學生主動協助同儕。"],["3-2","s5","（三）學習扶助","（三）學習扶助"],["3-2","s5","（三）學習扶助","學校規劃第八節學習扶助課後輔導，並與博幼基金會合作於課中進行分組教學，針對不同學習程度之學生提供適切之個別化協助。本校透過學習扶助計畫進行教學診斷，針對學習落差學生提供差異化支持，並落實數位學習輔助。112 學年度曾獲宜蘭縣「學力提升支持與獎勵計畫」國中組（減 C 比率）乙組第一名。"],["3-2","s5","（三）學習扶助","依教育部國民小學及國民中學學生學習扶助科技化評量系統資料，本校 112 至 114 學年度受輔學生三年累計進步率為 78.44％（167 人次中 131 人次進步），與宜蘭縣全縣水準（76.9％～78.24％）相當。"],["3-2","s5","（三）學習扶助","本校每年級僅一班，全校每年納入計算之受輔學生為 39 至 66 人次，各年級單科受輔人數多在 10 人以下。在此樣本規模下，一位學生是否達到進步標準，即可能使進步率變動 3％以上，故單一年度或單一科目之百分比波動屬統計常態，判讀時以三年累計與跨年趨勢為主。"],["3-2","s6","（四）外部教學人力挹注","（四）外部教學人力挹注"],["3-2","s6","（四）外部教學人力挹注","本校自 113 學年度起爭取教育部「協助公立國民中小學引進部分工時外籍英語教學助理（ELTA）」計畫，由外籍教學助理入班協同英語教學，增加學生英語聽說之真實使用機會。"],["3-2","s7","（五）學生體育專長之適性發展","（五）學生體育專長之適性發展"],["3-2","s7","（五）學生體育專長之適性發展","本校每年級僅一班，惟學生於田徑及長跑項目長期展現優異表現。112 至 115 學年度累計各項競賽獲獎 67 筆，其中體育類 49 筆、文化類 18 筆；就層級而言，全國級 37 筆、縣級 30 筆。體育專長之培養，係本校於文化課程與學科學習之外，為不同性向學生所保留之適性發展管道。"],["3-2","s7","（五）學生體育專長之適性發展","族群性賽事之參與：全國級體育獎項中有 12 筆來自全國原住民族運動會與全國泰雅族運動會，項目包括傳統路跑、4×400 公尺接力等。學生係以泰雅族青少年之身分參賽，體育表現因而不僅是個人性向之發展，亦是族群身分在公共場域中的展現，與本校 Tayal balay 願景相互呼應。"],["3-2","s7","（五）學生體育專長之適性發展","一般田徑賽事之表現：學生曾獲全國中等學校運動會 3000 公尺第一名、全國中等學校田徑錦標賽 1500 公尺第二名、臺北市中正盃田徑賽標槍第一名；112、113 學年度並於臺北市青年盃田徑賽 1500 公尺、3000 公尺及 2000 公尺障礙等項目獲前三名。"],["3-2","s7","（五）學生體育專長之適性發展","縣級賽事之常態參與：縣級獎項 30 筆中，體育類 20 筆，主要為宜蘭縣中小學田徑錦標賽 13 筆與宜蘭縣中小學運動會 7 筆，顯示參賽係逐年持續之常態，而非單一年度之偶發表現。"],["3-2","s7","（五）學生體育專長之適性發展","各項獲獎之學年度分布、層級結構、賽事屬性與名次分布，詳見下方「師生優良表現四學年度趨勢」互動網頁。"],["3-2","s8","（六）學生基本學力之現況與成長","（六）學生基本學力之現況與成長"],["3-2","s8","（六）學生基本學力之現況與成長","本校學生之學科學習表現，須置於其入學起點加以理解。依教育部國民小學及國民中學學生學習扶助科技化評量系統資料，本校 113 至 115 學年度入學新生於國小六年級所受篩選測驗之通過情形為：國語文 20 人通過（60.6％）、數學 12 人通過（36.4％）、英語 9 人通過（27.3％），三年合計受測 33 人。換言之，逾六成新生於入學時數學未達基本學力，英語未達基本學力者接近四分之三。"],["3-2","s8","（六）學生基本學力之現況與成長","補救教學之歷程：如（三）所述，本校透過第八節學習扶助、博幼基金會課中分組教學及數位學習輔助進行補救，112 至 114 學年度受輔 167 人次中 131 人次於成長測驗呈現進步，三年累計進步率 78.44％。"],["3-2","s8","（六）學生基本學力之現況與成長","學科表現之長期趨勢：104 至 115 年國中教育會考，本校五科合計待加強（C）人次比例，由 70.8％（104～109 年，畢業 122 人）降至 62.3％（110～115 年，畢業 100 人），B 以上由 29.2％ 提升至 37.7％；五科均呈改善，其中國文降幅 12.6 個百分點、英文降幅 12.9 個百分點最為明顯，115 年 C 比例 50.0％ 為十二年來最低。本校自 107 學年度推動原住民族實驗教育，110 年為首屆完整接受三年實驗教育之畢業生。推動實驗教育期間，學生之學科表現不但未見退步，五科均呈改善趨勢。"],["3-2","s8","（六）學生基本學力之現況與成長","判讀說明：學習扶助篩選測驗與國中教育會考之施測對象、目的及標準均不相同，本校分列呈現，不作跨工具之換算或推論。本校每年畢業生為 12 至 24 人，單一年度之百分比波動屬統計常態，判讀時以跨年趨勢為主。"],["3-2","s8","（六）學生基本學力之現況與成長","後續精進作為：115 年的 C 比例 50.0％ 雖為十二年來最低，惟仍偏高。本校 115 學年度持續以下列方式回應：（1）維持第八節學習扶助課後輔導，依成長測驗結果調整受輔名單與教學重點；（2）延續與博幼基金會合作之課中分組教學，針對不同程度學生提供個別化協助；（3）英語科未來將積極申請 ELTA 外籍英語教學助理入班協同，增加聽說之真實使用情境；（4）持續以數位學習輔助工具進行診斷與個別化練習。"],["3-2","s8","（六）學生基本學力之現況與成長","完整之起點、歷程、會考趨勢與升學結果統計，詳見下方「學生基本學力與升學進路」互動網頁。"],["3-2","s9","三、學力表現互動分析（互動網頁）","三、學力表現互動分析（互動網頁）"],["3-2","s9","三、學力表現互動分析（互動網頁）","互動網頁｜學習扶助成長測驗進步率三年分析"],["3-2","s9","三、學力表現互動分析（互動網頁）","依教育部科技化評量系統資料，呈現 112 至 114 學年度本校與宜蘭縣、全國之受輔學生進步率比較，並附小校樣本規模之判讀說明。"],["3-2","s9","三、學力表現互動分析（互動網頁）","在新分頁開啟完整分析 ↗"],["3-2","s9","三、學力表現互動分析（互動網頁）","互動網頁｜學生基本學力與升學進路"],["3-2","s9","三、學力表現互動分析（互動網頁）","以「起點－歷程－學科表現－升學結果－畢業後追蹤」五段結構，呈現 113～115 學年度新生入學時之學習扶助篩選測驗通過率、112～114 學年度學習扶助進步率、104～115 年會考十二年趨勢、111～114 學年度升學率與入學管道分布，以及 109、110 學年度畢業生之後續進路。"],["3-2","s9","三、學力表現互動分析（互動網頁）","在新分頁開啟完整統計 ↗"],["3-2","s10","四、師生優良表現四學年度趨勢（互動網頁）","四、師生優良表現四學年度趨勢（互動網頁）"],["3-2","s10","四、師生優良表現四學年度趨勢（互動網頁）","互動網頁｜師生優良表現四學年度趨勢"],["3-2","s10","四、師生優良表現四學年度趨勢（互動網頁）","彙整 112 至 115 學年度各項競賽獲獎紀錄 67 筆，呈現學年度趨勢、層級分布、全國級體育獎項之賽事屬性與名次分布，並附全國級獎項 37 筆一覽表。"],["3-2","s10","四、師生優良表現四學年度趨勢（互動網頁）","在新分頁開啟完整統計 ↗"],["3-2","s11","五、精選照片","五、精選照片"],["3-2","s11","五、精選照片","跨文化交流活動期間，本校學生與日本田園調布學園來訪學生共同用餐、交流生活經驗"],["3-2","s11","五、精選照片","參加第 13 屆原住民族語言戲劇競賽全國決賽，本校團隊曾獲社會組第一名及最佳男演員獎"],["3-2","s11","五、精選照片","參加全國學生舞蹈比賽全區決賽，本校民俗舞代表隊曾獲優等"],["3-2","s11","五、精選照片","九年級提供技藝專班選擇，學生前往聖母護專進行技職課程學習（中餐）"],["3-2","s11","五、精選照片","九年級提供技藝專班選擇，學生前往聖母護專進行技職課程學習（餐服）"],["3-2","s11","五、精選照片","九年級提供技藝專班選擇，學生前往羅東高工進行技職課程學習（汽車）"],["3-2","s11","五、精選照片","第八節學習扶助課後輔導，因受輔人數少，教師得以掌握個別學生之學習狀況並即時給予協助"],["3-2","s11","五、精選照片","第八節學習扶助課後輔導，透過遊戲式的競賽，讓學生提升學習動力"],["3-2","s11","五、精選照片","ELTA 部分工時外籍英語教學助理入班協同教學，以英語進行課堂互動與活動引導"],["3-2","s12","六、佐證資料清單","六、佐證資料清單"],["3-3","s1","一、指標原文","一、指標原文"],["3-3","s1","一、指標原文","多元學習成就評量設計與實施"],["3-3","s2","二、學校現況說明","二、學校現況說明"],["3-3","s2","二、學校現況說明","本校民族文化課程之學習成就評量，自推動實驗教育以來持續朝多元化與質性化發展，強調知識、技能與情意之整體評估，並兼顧個別學生之學習歷程與成長軌跡。"],["3-3","s3","（一）實作評量","（一）實作評量"],["3-3","s3","（一）實作評量","依各年級課程主軸設計對應之實作成果評量：七年級為竹編器具與工寮搭建之完成度與技能表現，八年級為肩背帶、地機編織之技術熟練度與作品呈現，九年級為藤製器具作品之完成度與品質。實作評量所重視者不僅為成品結果，亦包含製作過程中所展現之專注投入、耐心克服困難與同儕分工協作等態度表現。"],["3-3","s4","（二）學習歷程評量","（二）學習歷程評量"],["3-3","s4","（二）學習歷程評量","學生於各課程單元中持續記錄學習紀錄本，內容涵蓋課程內容、技術要點與文化知識，教師定期檢視作為評量依據；七年級並透過同儕互相比較筆記之方式，相互促進內容品質。課堂觀察則聚焦於學生之學習態度、合作能力、對文化知識之理解深度，以及操作過程中之表現。"],["3-3","s5","（三）口語表達與課程統整評量","（三）口語表達與課程統整評量"],["3-3","s5","（三）口語表達與課程統整評量","各年級於學期末進行課程統整分享，學生透過口頭發表呈現對各單元課程之整體理解與學習反思。114 學年度配合課程架構調整，於七、八年級新增專題基礎實務課程，九年級則進入專題研究實作，各年級均於學期末辦理成果發表：七、八年級呈現專題基礎報告，九年級以分組形式發表完整之專題研究作品，藉此評估學生對文化主題之知識理解、脈絡連結能力與口語表達能力。"],["3-3","s5","（三）口語表達與課程統整評量","114 學年度九年級專題研究報告主題如下："],["3-3","s5","（三）口語表達與課程統整評量","大同泰雅三石灶的構造與家庭意義"],["3-3","s5","（三）口語表達與課程統整評量","國民政府時期南山四季傳統地名由來"],["3-3","s5","（三）口語表達與課程統整評量","現代對於男性織布的看法"],["3-3","s5","（三）口語表達與課程統整評量","口簧琴影音製作與介紹"],["3-3","s6","（四）課程回饋調查","（四）課程回饋調查"],["3-3","s6","（四）課程回饋調查","本校每學期對七至九年級學生實施文化課程學習回饋問卷，調查各單元之學習收穫與建議，作為課程評估與滾動修正之依據。以 114 學年度第一學期為例，七年級以小米祭典與竹製生活器具為收穫最豐富之課程；八年級雖以地機編織最有收穫，但更希望深入學習傳統信仰與家族 gaga 等文化知識課程；九年級以 Pinsbkan 尋根之旅為最有收穫之課程（5 票、50％），而在「最想繼續加深學習」一題，則由 Pinsbkan 尋根之旅與漁獵生態體驗並列第一（各 4 票、40％）。（詳細分析資料請參閱下方「三、文化課程學習回饋統整分析」）"],["3-3","s7","（五）質性成績單","（五）質性成績單"],["3-3","s7","（五）質性成績單","本校推動以文字描述取代單一分數之質性成績單制度，由教師依據學生在文化技藝習得、學習態度、團隊合作與文化理解等面向之實際表現，作出具體之文字描述紀錄，使學生得於質性評量中看見自身學習成長。教師並於質性成績單中描述學生在學習過程中展現愛土地、負責、合作、感恩等 Tayal balay 特質之具體事例。"],["3-3","s8","（六）一般學科評量","（六）一般學科評量"],["3-3","s8","（六）一般學科評量","一般學科領域課程依課程綱要規範辦理定期紙筆評量，遵守定期評量與模擬考相關規定。部分學科因應學科特性，另融入口說報告、作品呈現、課堂分享等多元評量方式。"],["3-3","s9","三、文化課程學習回饋統整分析（互動圖表）","三、文化課程學習回饋統整分析（互動圖表）"],["3-3","s9","三、文化課程學習回饋統整分析（互動圖表）","本校文化課程依主題單元設計，本頁面亦以主題單元為分析單位，彙整 114 學年度七至九年級共 21 個主題單元之學生學習回饋（回覆合計 47 人次），以量化趨勢為主：各主題單元正向回饋比例、最有收穫單元票選、成效亮點與教育意義，以及跨年級單元設計脈絡。部分時數較多之單元跨學期實施，其兩次調查之作答已合併計算，分母為人次。"],["3-3","s9","三、文化課程學習回饋統整分析（互動圖表）","文化課程學習回饋統整（114 學年度） 在新分頁開啟 ↗"],["3-3","s9","三、文化課程學習回饋統整分析（互動圖表）","圖表可切換七、八、九年級檢視；點選「開啟完整版分析」可見各主題單元之正向回饋比例、最有收穫單元票選與成效亮點說明。"],["3-3","s9","三、文化課程學習回饋統整分析（互動圖表）","本頁與指標 🪶3-4 學生民族文化認知與認同 之「文化課程回饋質性證據彙整」取自同一批問卷，但分工不同：本頁呈現課程成效之量化統計，3-4 則呈現學生文化認同之質性證據，兩者樣本一致。"],["3-3","s10","四、精選照片","四、精選照片"],["3-3","s10","四、精選照片","九年級專題研究實作課程，培養探究能力"],["3-3","s10","四、精選照片","九年級藤製器具實作評量"],["3-3","s10","四、精選照片","八年級弓織實作課程"],["3-3","s10","四、精選照片","九年級專題研究報告－國民政府時期南山四季傳統地名由來"],["3-3","s10","四、精選照片","九年級專題研究報告－大同泰雅三石灶的構造與家庭意義"],["3-3","s10","四、精選照片","九年級專題研究報告－現代對於男性織布的看法"],["3-3","s11","五、佐證資料清單","五、佐證資料清單"],["3-4","s1","一、指標原文","一、指標原文"],["3-4","s1","一、指標原文","學生對於自身民族文化認知與認同提升情形"],["3-4","s2","二、學校現況說明","二、學校現況說明"],["3-4","s2","二、學校現況說明","學生民族文化認知與認同之提升難以透過單一數據呈現，本校從在校學習歷程觀察、跨文化接觸表現及畢業生追蹤回饋三個面向蒐集證據。"],["3-4","s3","（一）在校學習歷程之觀察","（一）在校學習歷程之觀察"],["3-4","s3","（一）在校學習歷程之觀察","從文化課程之實作參與、師生日常互動，以及學生面對各年級課程主題之態度與表現，均可觀察到學生對自身文化之認識持續加深。七年級學生於燒墾生活與傳統農耕課程後，對泰雅族與土地之關係有更具體之認識；八年級學生完成地機編織作品後，對 gaga 家族倫理與傳統技藝間之文化脈絡有更深刻之理解；九年級學生則透過山林智慧課程與部落踏查，對部落傳統領域、生態知識與祖先生活建立更整體之連結。"],["3-4","s3","（一）在校學習歷程之觀察","114 學年度文化課程學習回饋問卷（七至九年級共六份）之質性回饋顯示，學生已能以「自己的文化」「自己的根」自我定位，並主動表達向耆老學習與文化傳承之意願。"],["3-4","s3","（一）在校學習歷程之觀察","另一項具體證據是 113 學年度守月期間之全校集體省思：學生在檢視自身言行時，所使用的分類軸線是「有沒有遵守 gaga」而非校規條文，顯示族群規範已成為學生自我檢視之內在依據。"],["3-4","s3","（一）在校學習歷程之觀察","（集體省思心智圖與守月時期學輔工作機制，詳見 💡6-3 學校辦理民族教育之創新與省思 之「magu byaling 與 sbalay 之校內制度化實踐」）"],["3-4","s4","（二）跨文化接觸中展現之文化自信","（二）跨文化接觸中展現之文化自信"],["3-4","s4","（二）跨文化接觸中展現之文化自信","本校自 111 學年度起連續四年與臺北歐洲學校辦理跨文化交流，並接待日本、新加坡等地師生來訪。在這些場合中，學生能主動介紹泰雅族文化、展示傳統技藝。於族語朗讀、族語單詞、族語戲劇等競賽之準備與參賽歷程中，帶隊教師均觀察到學生展現更明確之文化認同與族群自信。"],["3-4","s5","（三）畢業校友追蹤回饋","（三）畢業校友追蹤回饋"],["3-4","s5","（三）畢業校友追蹤回饋","本校定期辦理畢業生升學就業追蹤，蒐集畢業生對實驗教育影響之回饋。114 學年度調查回收 109 至 113 學年度畢業生問卷 33 份（就學 27 人、就業 6 人），結果顯示多數畢業生正面肯定實驗教育於文化認同上之影響：離開部落就讀後，能在新學校自信且主動地與師生分享泰雅文化；亦有畢業生指出，在本校養成之「動手做」與「自己找答案」習慣，使其在高中職實習課程與日常生活中展現較強之自主學習與應變能力。"],["3-4","s5","（三）畢業校友追蹤回饋","調查同時呈現值得後續深化之處：少數畢業生表示影響有限，或提及離開部落後族語能力可能淡忘、面對詢問時因自覺學習不足而難以清楚說明。此類回饋已作為本校在族語能力、文化知識深度與畢業後銜接支持上持續加強之依據。"],["3-4","s5","（三）畢業校友追蹤回饋","除問卷調查外，另有一個具體個案。該生於 109 學年度畢業，為本校首屆完整接受三年實驗教育的學生之一，在校期間對地機編織產生高度興趣，投入程度超出課程要求，課後與返家後自行練習，並主動向部落中仍保有織作記憶的長者請教。升讀高中後，該生未因離開部落而中斷，持續織作，並向非原住民同學介紹泰雅族之織布文化；其後以此一專長經特殊選才管道錄取國立政治大學民族學系。此一個案之意義不在升學結果，而在其歷程：文化課程提供的是起點與方法，學生在離校之後自行延續，最終將文化學習轉化為高等教育階段之自主選擇。"],["3-4","s6","（四）族語能力認證之取得情形","（四）族語能力認證之取得情形"],["3-4","s6","（四）族語能力認證之取得情形","原住民族語言能力認證分為初級、中級與中高級，其中初級為國民中學階段應具備之基本標準。本校 114 學年度第 2 學期在學之學生 33 人中，29 人（87.9％）已取得族語能力認證；其中 21 人（63.6％）取得中級以上，已超過國中畢業應具備之標準。七年級 9 人並全數通過認證。"],["3-4","s6","（四）族語能力認證之取得情形","方言別／級次 七年級 八年級 九年級 合計"],["3-4","s6","（四）族語能力認證之取得情形","四季泰雅語－初級 2 1 1 4"],["3-4","s6","（四）族語能力認證之取得情形","四季泰雅語－中級 1 1 3 5"],["3-4","s6","（四）族語能力認證之取得情形","四季泰雅語－中高級 0 1 0 1"],["3-4","s6","（四）族語能力認證之取得情形","賽考利克泰雅語－初級 1 1 2 4"],["3-4","s6","（四）族語能力認證之取得情形","賽考利克泰雅語－中級 5 6 4 15"],["3-4","s6","（四）族語能力認證之取得情形","賽考利克泰雅語－中高級 0 0 0 0"],["3-4","s6","（四）族語能力認證之取得情形","各年級取得認證人數／班級人數 9／9 10／11 10／13 29／33"],["3-4","s6","（四）族語能力認證之取得情形","統計時點為 114 學年度第 2 學期，表列人數為該時點之在學學生；因學生異動，與首頁所載 115 學年度學生數略有不同。"],["3-4","s6","（四）族語能力認證之取得情形","本校依學生個別起點採循序漸進之輔導策略，除穩固既有級別外，並鼓勵學生報考更高級別；族語教師與文化教師另利用課餘時間加強學生族語能力，並輔導學生參加族語單詞、族語朗讀及族語戲劇等競賽。"],["3-4","s6","（四）族語能力認證之取得情形","各項族語競賽成績另見 3-2 學生多元學習與適性發展（一）多元學習機會。"],["3-4","s7","三、學生文化課程質性回饋證據彙整（互動網頁）","三、學生文化課程質性回饋證據彙整（互動網頁）"],["3-4","s7","三、學生文化課程質性回饋證據彙整（互動網頁）","資料來源為 114 學年度第一、二學期七至九年級文化課程學習回饋問卷共六份，有效回覆合計 47 人次（七年級 7＋9 人、八年級 9＋4 人、九年級 10＋8 人）。因各年級樣本數較小，量化百分比僅作趨勢參考，以下以學生原文回饋為主要證據。"],["3-4","s7","三、學生文化課程質性回饋證據彙整（互動網頁）","本頁與指標 📝3-3 學習成就多元評量 之「文化課程學習回饋統整」取自同一批問卷，但分工不同：3-3 以主題單元為分析單位，呈現三個年級共 21 個主題單元之課程成效量化統計；本頁則依文化知識認知、傳統技藝學習、民族身分認同、文化傳承與世代連結、持續學習意願五個面向，呈現學生文化認同之質性證據。"],["3-4","s7","三、學生文化課程質性回饋證據彙整（互動網頁）","互動網頁｜文化課程回饋質性證據彙整（114 學年度）"],["3-4","s7","三、學生文化課程質性回饋證據彙整（互動網頁）","依五個面向彙整學生原文回饋之質性證據。內容較長，建議於新分頁全螢幕檢視；下方亦提供可展開之文字版。"],["3-4","s7","三、學生文化課程質性回饋證據彙整（互動網頁）","在新分頁開啟完整彙整 ↗"],["3-4","s7","三、學生文化課程質性回饋證據彙整（互動網頁）","下方為完整網頁之文字版，可 們有互動」（九年級 114-1），顯示學生重視與部落耆老之世代互動。"],["3-4","s7","三、學生文化課程質性回饋證據彙整（互動網頁）","質性證據（五）持續學習意願"],["3-4","s7","三、學生文化課程質性回饋證據彙整（互動網頁）","九年級 114-1：Pinsbkan 部落遷徙與歷史、漁獵生態體驗並列最想加深之課程（各 40％）。"],["3-4","s7","三、學生文化課程質性回饋證據彙整（互動網頁）","八年級 114-1：最想加深者為傳統信仰與生命禮俗（33.3％）與家與 gaga 團體（22.2％），顯示對文化知識體系之探索需求勝過單純實作。"],["3-4","s7","三、學生文化課程質性回饋證據彙整（互動網頁）","七年級 114-2：學生建議增加課程與操作練習時間。"],["3-4","s7","三、學生文化課程質性回饋證據彙整（互動網頁）","九年級 114-2：學生建議口簧琴單元增加向耆老學習吹奏之時間，專題研究則希望提前於上學期開始。"],["3-4","s7","三、學生文化課程質性回饋證據彙整（互動網頁）","跨年級發展觀察"],["3-4","s7","三、學生文化課程質性回饋證據彙整（互動網頁）","七年級著重文化基礎體驗與實作入門，回饋多聚焦於動手做之樂趣與成就感；八年級轉向文化知識體系之深化，開始表達對文化脈絡理解之需求，並出現家族情感之連結；九年級則透過 Pinsbkan 尋根之旅、部落踏查與漁獵體驗，達到文化尋根與身分認同之成熟階段，能明確表達文化傳承之責任感，形成完整之文化學習階梯。"],["3-4","s8","四、畢業校友現況調查與文化認同回饋（互動網頁）","四、畢業校友現況調查與文化認同回饋（互動網頁）"],["3-4","s8","四、畢業校友現況調查與文化認同回饋（互動網頁）","互動網頁｜畢業校友現況調查與文化認同回饋"],["3-4","s8","四、畢業校友現況調查與文化認同回饋（互動網頁）","109～113 學年度畢業生 33 份回饋之調查結果與文化認同面向分析。"],["3-4","s8","四、畢業校友現況調查與文化認同回饋（互動網頁）","在新分頁開啟完整調查 ↗"],["3-4","s8","四、畢業校友現況調查與文化認同回饋（互動網頁）","下方為完整網頁之文字版，可直接於本頁展開閱讀。"],["3-4","s8","四、畢業校友現況調查與文化認同回饋（互動網頁）","調查基本資料與文化認同面向分析（文字版）"],["3-4","s8","四、畢業校友現況調查與文化認同回饋（互動網頁）","回覆人數 33 位畢業生"],["3-4","s8","四、畢業校友現況調查與文化認同回饋（互動網頁）","畢業年度 109～113 學年度"],["3-4","s8","四、畢業校友現況調查與文化認同回饋（互動網頁）","目前現況 就學 27 位、就業 6 位"],["3-4","s8","四、畢業校友現況調查與文化認同回饋（互動網頁）","部落分布 南山 13 位、四季 13 位、茂安 7 位"],["3-4","s8","四、畢業校友現況調查與文化認同回饋（互動網頁）","發展去向 高中職、五專、大學、職場與軍職皆有"],["3-4","s8","四、畢業校友現況調查與文化認同回饋（互動網頁）","調查依三題開放式問題進行：（1）「動手做」或「自己找答案」的課程經驗對現在的生活是否有幫助；（2）國中時期接觸的泰雅文化課程對畢業後有何影響；（3）在現在的學校被問起原住民身分或部落文化時的感受。"],["3-4","s8","四、畢業校友現況調查與文化認同回饋（互動網頁）","認同面向 學生表現 代表意義"],["3-4","s8","四、畢業校友現況調查與文化認同回饋（互動網頁）","我知道我是誰 認識泰雅文化、記得原住民身分 文化課程協助學生建立自我定位"],["3-4","s8","四、畢業校友現況調查與文化認同回饋（互動網頁）","我願意說出來 面對提問時能大方、自信分享 身分認同轉化為表達能力"],["3-4","s8","四、畢業校友現況調查與文化認同回饋（互動網頁）","我能與他人對話 向同學、老師、不同族群朋友介紹文化 文化學習成為跨文化溝通資源"],["3-4","s8","四、畢業校友現況調查與文化認同回饋（互動網頁）","我會比較與反思 在校外環境中看見部落互助、共同完成事情的價值 部落生活經驗成為理解世界的視角"],["3-4","s8","四、畢業校友現況調查與文化認同回饋（互動網頁）","我仍想繼續學 覺得自己文化理解仍不足，或擔心族語淡忘 顯示文化課程需持續深化與銜接"],["3-4","s8","四、畢業校友現況調查與文化認同回饋（互動網頁）","畢業生回饋原文摘錄（文字版）"],["3-4","s8","四、畢業校友現況調查與文化認同回饋（互動網頁）","文化認同"],["3-4","s8","四、畢業校友現況調查與文化認同回饋（互動網頁）","我很驕傲也很開心，這樣讓更多人知道泰雅族的存在。"],["3-4","s8","四、畢業校友現況調查與文化認同回饋（互動網頁）","很開心也很幸運自己是原住民。"],["3-4","s8","四、畢業校友現況調查與文化認同回饋（互動網頁）","我可以很開心很放鬆的回答，也很驕傲。"],["3-4","s8","四、畢業校友現況調查與文化認同回饋（互動網頁）","文化表達"],["3-4","s8","四、畢業校友現況調查與文化認同回饋（互動網頁）","可以在自我介紹中讓大家更瞭解泰雅族。"],["3-4","s8","四、畢業校友現況調查與文化認同回饋（互動網頁）","當同學或老師們問起我們的文化，我可以很輕鬆的跟他們聊。"],["3-4","s8","四、畢業校友現況調查與文化認同回饋（互動網頁）","到高中也可以接觸到不同的文化，用自己知道的來傳達給不知道的人。"],["3-4","s8","四、畢業校友現況調查與文化認同回饋（互動網頁）","文化連結"],["3-4","s8","四、畢業校友現況調查與文化認同回饋（互動網頁）","讓我們知道自己還是泰雅族的小孩，不能忘記身為原住民的血。"],["3-4","s8","四、畢業校友現況調查與文化認同回饋（互動網頁）","我對我的文化認同更深，發現其實現在消失的很快，而我有學過。"],["3-4","s8","四、畢業校友現況調查與文化認同回饋（互動網頁）","實作探究能力之遷移"],["3-4","s8","四、畢業校友現況調查與文化認同回饋（互動網頁）","非常有幫助，會讓現在的我習慣主動找答案。"],["3-4","s8","四、畢業校友現況調查與文化認同回饋（互動網頁）","遇到問題或困難第一時間就會找方法去解決。"],["3-4","s8","四、畢業校友現況調查與文化認同回饋（互動網頁）","到了高中之後會變得獨立，可以不用很依賴其他人，也可以自己完成很多事。"],["3-4","s8","四、畢業校友現況調查與文化認同回饋（互動網頁）","仍待深化之處"],["3-4","s8","四、畢業校友現況調查與文化認同回饋（互動網頁）","我覺得在山下還好，因為發現在山下久了自己的族語都快忘了一部分。"],["3-4","s8","四、畢業校友現況調查與文化認同回饋（互動網頁）","我會有點手足無措，因為我覺得我沒學的那麼好，沒辦法跟他們解釋清楚我的文化。"],["3-4","s9","五、學生省思與心情分享","五、學生省思與心情分享"],["3-4","s9","五、學生省思與心情分享","本節為學生於文化課程、祭儀現場與 Pinsbkan 尋根途中之即時口述紀錄，共 7 段。與前三節之問卷、調查資料性質不同，此處呈現的是學生在文化實踐當下的自述。"],["3-4","s9","五、學生省思與心情分享","影片組成"],["3-4","s9","五、學生省思與心情分享","Smgatu 小米播種祭（2 段）：113、114 年度畢業校友自主返校參與祭儀後之心情分享。"],["3-4","s9","五、學生省思與心情分享","Pinsbkan 尋根之旅（3 段）：九年級學生 1 段、隨行畢業校友 2 段，於泰雅族起源地 Pinsbkan 現場錄製。"],["3-4","s9","五、學生省思與心情分享","Cmyus 祖靈感恩祭（1 段）：八年級學生於祭儀後之省思。"],["3-4","s9","五、學生省思與心情分享","九年級漁獵課程（1 段）：九年級學生於漁獵課程體驗後之想法分享。"],["3-4","s9","五、學生省思與心情分享","文化認同難以由單一指標衡量。本頁前三節分別以課程回饋問卷、跨文化場合之教師觀察及畢業生追蹤調查提出證據，惟三者皆屬書面或轉述形式，均經由紙筆這一層轉譯。影像紀錄補足的正是這一段落差：學生在祭儀、祖居地的即時反應、語氣與神情，是問卷選項與文字摘錄無法承載的。"],["3-4","s9","五、學生省思與心情分享","其中畢業校友自主返校參與 Smgatu 之紀錄尤具意義。學生離校之後並無任何義務返校參與祭儀，此一行動本身即為文化認同之具體表現；影片所記錄者，是這項選擇之後的自述。"],["3-4","s10","重點引述","重點引述"],["3-4","s10","重點引述","從課堂的文化喚起，到祖源地的身分確認，再到離校後的主動回望"],["3-4","s10","重點引述","以下保留影片字幕原文，依學生文化認同逐步形成的三個階段呈現。"],["3-4","s10","重點引述","① 在文化課程中被喚起"],["3-4","s10","重點引述","從「不知道」到理解文化知識、家族連結、共享倫理與傳承責任。"],["3-4","s10","重點引述","我國小是讀三峽，我不知道我們泰雅族的文化、那些狩獵方式，所以我根本就沒有問我阿公。其實到我進來大同國中之後，我就慢慢地知道我們泰雅族以前有什麼漁獵、狩獵，還有 Rusa 陷阱之類的那些。 —— 九年級・漁獵課程"],["3-4","s10","重點引述","我知道我們家族是以漁獵為主的，可是我從以前到現在都沒有跟我的外公去過溪裡面……可是就是因為這一次的機會，讓我跟阿公一起到了溪裡面一起毒魚。 —— 九年級・漁獵課程"],["3-4","s10","重點引述","溪流是整個部落的財產，所以他們在漁獵的時候，一定是整個部落一起。不可以說你今天去毒了，然後你把魚全部都拿走——你要部落一起去毒，抓到的魚分給大家。 —— 九年級・漁獵課程"],["3-4","s10","重點引述","阿公有跟我們講，我們以前不會抓小隻的魚，我們會讓小隻的魚回歸生態，留著給下一代。 —— 九年級・漁獵課程"],["3-4","s10","重點引述","我覺得文化就是要看你要不要、有沒有想要去得到它。如果你是 Tayal，可是你沒有想要做我們的文化，你就不會想要去學習；可是如果你是 Tayal，你又有機會可以去認識你的文化，並且你又想要學習——你今天去學，你就會得到，一分耕耘一分收穫。 —— 九年級・漁獵課程"],["3-4","s10","重點引述","這算是我們全校第一次的 Cmyus。可以在這個祭典當中看到，我們泰雅族其實在那個年代，大家都是很團結的，男女都會分工，把自己的工作做完，然後因著他們的合作，就能夠把這個祭典辦成。 —— 八年級・祖靈感恩祭"],["3-4","s10","重點引述","我們的族人們都是很敬畏我們的祖靈，所以在要開始種小米之前，會祈求祖靈賦予他們平安、祝福以及庇佑，讓他們種的小米能夠豐收；然後在結束之後，他們也會知道要有感恩的心，要感恩祖靈。 —— 八年級・祖靈感恩祭"],["3-4","s10","重點引述","② 在祖源地 Pinsbkan 被確認"],["3-4","s10","重點引述","祖源地不只是學習場域，更使身分認同轉化為「我回家了」的具體感受。"],["3-4","s10","重點引述","這一次上去，我是真的很用心在感受每一步帶給我的感覺。因為我在走的途中，我發現是這塊土地賦予給我這個身分—Tayal。 —— 畢業校友・Pinsbkan 尋根之旅"],["3-4","s10","重點引述","我也很開心、很驕傲，我是同中畢業的。……我也要謝謝當地的長老 mama 們，這份感謝永遠都感謝不完。mhuway simu，辛苦你們。 —— 畢業校友・Pinsbkan 尋根之旅"],["3-4","s10","重點引述","我們可能從小在山上長大，你可能不會覺得說我是泰雅族，因為我們都在部落，每個人都是我身邊的人，我很認識。可是你今天出去讀書，去到不一樣的地方，你就會覺得——欸，怎麼都是陌生人？我是誰、我在哪裡？可是你今天來到這裡的時候，你覺得說：我回家了。 —— 畢業校友・Pinsbkan 尋根之旅"],["3-4","s10","重點引述","我覺得我們其實是一個驕傲的民族，其實我們東西都還在……你們有學自己的文化、祭儀，傳統的東西跟其他人都沒有。所以我覺得自我認同非常重要。 —— 畢業校友・Pinsbkan 尋根之旅"],["3-4","s10","重點引述","③ 離校之後被辨識"],["3-4","s10","重點引述","當學生離開部落，文化經驗成為主動返校、確認歸屬並支撐自己前行的力量。"],["3-4","s10","重點引述","我想回來，是想熟悉一下之前那個 Smgatu 的感覺，因為現在真的有點忘記那個感覺了。 —— 畢業校友・Smgatu 返校"],["3-4","s10","重點引述","我覺得他們現在的感覺跟我之前的感覺一樣，就是「我為什麼要在這裡」，覺得我在做一個學校要我做的事情。但是我為什麼會想回來，就是因為我覺得這是我想做的，而且我覺得這是我該做的事情。 —— 畢業校友・Smgatu 返校"],["3-4","s10","重點引述","回想起國中那樣子的一些事情，我會覺得那會成為我繼續走下去的勇氣……回想起國中就會覺得，是一種家的感覺。 —— 畢業校友・Smgatu 返校"],["3-4","s10","重點引述","像其他的國中，就是山下，就是讀書……可是因為有實驗民族學校的關係，所以才能讓我碰到文化這種東西，就是太特別了。 —— 畢業校友・Smgatu 返校"],["3-4","s10","重點引述","這次主要回來就是因為想念。如果你待在山下，就算你有好朋友，放學大家都有自己各自的事情要忙。可是在大同國中，早上大家一起上學，下午放學大家會一起去打球、或是做一些共同的事情——你在山下沒有辦法有這麼多人一起做一樣的事情。 —— 畢業校友・Smgatu 返校"],["3-4","s10","重點引述","很多時候變得一直都是自己一個人，你自己一個人要去做很多事情，而且是做一些你自己沒有做過的事情……不會有在大同國中那種安心感。不管怎樣就是一定要去面對。 —— 畢業校友・Smgatu 返校"],["3-4","s10","重點引述","113 年度畢業校友自主返校參與 Smgatu 心情分享"],["3-4","s10","重點引述","畢業校友一同參與 Pinsbkan 尋根之旅發抒心情與省思（1）"],["3-4","s10","重點引述","114 年度畢業校友自主返校參與 Smgatu 心情分享"],["3-4","s10","重點引述","畢業校友一同參與 Pinsbkan 尋根之旅發抒心情與省思（2）"],["3-4","s10","重點引述","八年級學生對於 Cmyus 祖靈感恩祭的省思"],["3-4","s10","重點引述","九年級學生於 Pinsbkan 尋根之旅發抒心情與省思"],["3-4","s10","重點引述","九年級學生對於漁獵課程的分享"],["3-4","s11","六、外部觀察與學術研究（互動網頁）","六、外部觀察與學術研究（互動網頁）"],["3-4","s11","六、外部觀察與學術研究（互動網頁）","前五節之證據均由本校自行收集與整理。本節則為外部研究者之獨立觀察，資料來源與觀點均不同於前述各項。"],["3-4","s11","六、外部觀察與學術研究（互動網頁）","114 學年度下學期，國立臺北教育大學教育創新與評鑑碩士班研究生以信任建立、生命之河及認同主題討論三場活動，與九位九年級學生就文化學習與族群認同進行對話。其觀察指出，參與學生全數對泰雅族身分表達正向感受，並將文化課視為認識族群歷史與傳統生活之重要來源；同時亦指出學生對部分學習內容存在實用性與文化性之判斷落差。研究者並明確說明，文化課是否有效促進文化認同無法僅由該次活動推論。本頁以外部視角補充本校自評資料，正反面發現均予呈現。"],["3-4","s11","六、外部觀察與學術研究（互動網頁）","另一份為國立臺灣大學人類學系碩士論文（鄧教東，2024），田野期間涵蓋 112 學年度完整一學年。該研究訪談一位已成年之第一屆畢業生，該生就讀期間學校尚未將四項特質明列，但其表示現在回頭看確實感受到這四項特質的培育，並認為文化課程所教技能相對次要、三年的精神性養成更為重要。論文亦記錄此畢業生自本校文化課程起步、畢業後持續向部落耆老學習織布的歷程。"],["3-4","s11","六、外部觀察與學術研究（互動網頁）","互動網頁｜外部觀察與學術研究"],["3-4","s11","六、外部觀察與學術研究（互動網頁）","彙整兩份外部資料：觀課與訪談報告（114 學年度）共 12 項發現，及人類學碩士論文（2024 年）共 14 項發現，可依指標篩選；並一併呈現研究者所指出之限制。"],["3-4","s11","六、外部觀察與學術研究（互動網頁）","在新分頁開啟 ↗"],["3-4","s12","七、精選照片","七、精選照片"],["3-4","s12","七、精選照片","跨文化交流活動中，本校學生與臺北歐洲學校學生共同以竹材製作趕鳥器。"],["3-4","s12","七、精選照片","用英文向新加坡花菲衛理中學的學生介紹傳統建築（1）"],["3-4","s12","七、精選照片","日本田園調布學園師生到校交流，於校內文化場域參與泰雅文化體驗課程。"],["3-4","s12","七、精選照片","用英文向新加坡花菲衛理中學的學生介紹傳統建築（2）"],["3-4","s12","七、精選照片","校慶暨文化成果展攤位，學生向來賓介紹藤帽 qbubu、背簍與漁撈捕獵器具之編製方式與傳統用途。"],["3-4","s12","七、精選照片","校慶文化成果展中，各年級學生以簡報形式向來賓報告該年段文化課程之學習內容與成果。"],["3-4","s12","七、精選照片","用英文向新加坡花菲衛理中學的學生介紹傳統建築（3）"],["3-4","s13","八、佐證資料清單","八、佐證資料清單"],["4-1","s1","一、指標原文","一、指標原文"],["4-1","s1","一、指標原文","
