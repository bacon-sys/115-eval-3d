、學校現況說明</h2><p>本校民族文化課程之學習成就評量，自推動實驗教育以來持續朝多元化與質性化發展，強調知識、技能與情意之整體評估，並兼顧個別學生之學習歷程與成長軌跡。</p><h3 id="s3">（一）實作評量</h3><p>依各年級課程主軸設計對應之實作成果評量：七年級為竹編器具與工寮搭建之完成度與技能表現，八年級為肩背帶、地機編織之技術熟練度與作品呈現，九年級為藤製器具作品之完成度與品質。實作評量所重視者不僅為成品結果，亦包含製作過程中所展現之專注投入、耐心克服困難與同儕分工協作等態度表現。</p><h3 id="s4">（二）學習歷程評量</h3><p>學生於各課程單元中持續記錄學習紀錄本，內容涵蓋課程內容、技術要點與文化知識，教師定期檢視作為評量依據；七年級並透過同儕互相比較筆記之方式，相互促進內容品質。課堂觀察則聚焦於學生之學習態度、合作能力、對文化知識之理解深度，以及操作過程中之表現。</p><h3 id="s5">（三）口語表達與課程統整評量</h3><p>各年級於學期末進行課程統整分享，學生透過口頭發表呈現對各單元課程之整體理解與學習反思。114 學年度配合課程架構調整，於七、八年級新增專題基礎實務課程，九年級則進入專題研究實作，各年級均於學期末辦理成果發表：七、八年級呈現專題基礎報告，九年級以分組形式發表完整之專題研究作品，藉此評估學生對文化主題之知識理解、脈絡連結能力與口語表達能力。</p><p>114 學年度九年級專題研究報告主題如下：</p><ul><li>大同泰雅三石灶的構造與家庭意義</li><li>國民政府時期南山四季傳統地名由來</li><li>現代對於男性織布的看法</li><li>口簧琴影音製作與介紹</li></ul><h3 id="s6">（四）課程回饋調查</h3><p>本校每學期對七至九年級學生實施文化課程學習回饋問卷，調查各單元之學習收穫與建議，作為課程評估與滾動修正之依據。以 114 學年度第一學期為例，七年級以小米祭典與竹製生活器具為收穫最豐富之課程；八年級雖以地機編織最有收穫，但更希望深入學習傳統信仰與家族 gaga 等文化知識課程；九年級以 Pinsbkan 尋根之旅為最有收穫之課程（5 票、50％），而在「最想繼續加深學習」一題，則由 Pinsbkan 尋根之旅與漁獵生態體驗並列第一（各 4 票、40％）。（詳細分析資料請參閱下方「三、文化課程學習回饋統整分析」）</p><h3 id="s7">（五）質性成績單</h3><p>本校推動以文字描述取代單一分數之質性成績單制度，由教師依據學生在文化技藝習得、學習態度、團隊合作與文化理解等面向之實際表現，作出具體之文字描述紀錄，使學生得於質性評量中看見自身學習成長。教師並於質性成績單中描述學生在學習過程中展現愛土地、負責、合作、感恩等 Tayal balay 特質之具體事例。</p><h3 id="s8">（六）一般學科評量</h3><p>一般學科領域課程依課程綱要規範辦理定期紙筆評量，遵守定期評量與模擬考相關規定。部分學科因應學科特性，另融入口說報告、作品呈現、課堂分享等多元評量方式。</p><hr><h2 id="s9">三、文化課程學習回饋統整分析（互動圖表）</h2><p>本校文化課程依<b>主題單元</b>設計，本頁面亦以主題單元為分析單位，彙整 114 學年度七至九年級共 21 個主題單元之學生學習回饋（回覆合計 47 人次），以<b>量化趨勢</b>為主：各主題單元正向回饋比例、最有收穫單元票選、成效亮點與教育意義，以及跨年級單元設計脈絡。部分時數較多之單元跨學期實施，其兩次調查之作答已合併計算，分母為人次。</p><figure class="embed"><iframe src="https://bacon-sys.github.io/115-eval-feedback/3-3.html" title="文化課程學習回饋統整（114 學年度）" loading="lazy" allowfullscreen></iframe><figcaption>文化課程學習回饋統整（114 學年度）　<a href="https://bacon-sys.github.io/115-eval-feedback/3-3.html" target="_blank" rel="noopener">在新分頁開啟 ↗</a></figcaption></figure><p><i>圖表可切換七、八、九年級檢視；點選「開啟完整版分析」可見各主題單元之正向回饋比例、最有收穫單元票選與成效亮點說明。</i></p><div class="callout bg-gray_bg"><span class="ci" aria-hidden="true">ℹ️</span><div class="cb"><p>本頁與指標 <a class="mention" href="#p3-4" data-page="3-4"><span class="mi">🪶</span>3-4 學生民族文化認知與認同</a> 之「文化課程回饋質性證據彙整」取自同一批問卷，但分工不同：本頁呈現<b>課程成效之量化統計</b>，3-4 則呈現<b>學生文化認同之質性證據</b>，兩者樣本一致。</p></div></div><hr><h2 id="s10">四、精選照片</h2><div class="gallery" style="--cols:3"><figure><button type="button" class="ph" data-full="img/full/0c3c871a1b.jpg" data-cap="九年級專題研究實作課程，培養探究能力" aria-label="放大照片：九年級專題研究實作課程，培養探究能力"><img src="img/thumb/0c3c871a1b.jpg" alt="九年級專題研究實作課程，培養探究能力" loading="lazy" width="1600" height="1200"></button><figcaption>九年級專題研究實作課程，培養探究能力</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/9cfe369c49.jpg" data-cap="九年級藤製器具實作評量" aria-label="放大照片：九年級藤製器具實作評量"><img src="img/thumb/9cfe369c49.jpg" alt="九年級藤製器具實作評量" loading="lazy" width="1200" height="1600"></button><figcaption>九年級藤製器具實作評量</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/0cf17984fc.jpg" data-cap="八年級弓織實作課程" aria-label="放大照片：八年級弓織實作課程"><img src="img/thumb/0cf17984fc.jpg" alt="八年級弓織實作課程" loading="lazy" width="1600" height="1200"></button><figcaption>八年級弓織實作課程</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/ea74aa874a.jpg" data-cap="九年級專題研究報告－國民政府時期南山四季傳統地名由來" aria-label="放大照片：九年級專題研究報告－國民政府時期南山四季傳統地名由來"><img src="img/thumb/ea74aa874a.jpg" alt="九年級專題研究報告－國民政府時期南山四季傳統地名由來" loading="lazy" width="1600" height="1200"></button><figcaption>九年級專題研究報告－國民政府時期南山四季傳統地名由來</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/045e4ab411.jpg" data-cap="九年級專題研究報告－大同泰雅三石灶的構造與家庭意義" aria-label="放大照片：九年級專題研究報告－大同泰雅三石灶的構造與家庭意義"><img src="img/thumb/045e4ab411.jpg" alt="九年級專題研究報告－大同泰雅三石灶的構造與家庭意義" loading="lazy" width="1600" height="901"></button><figcaption>九年級專題研究報告－大同泰雅三石灶的構造與家庭意義</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/20b7b066f6.jpg" data-cap="九年級專題研究報告－現代對於男性織布的看法" aria-label="放大照片：九年級專題研究報告－現代對於男性織布的看法"><img src="img/thumb/20b7b066f6.jpg" alt="九年級專題研究報告－現代對於男性織布的看法" loading="lazy" width="1600" height="901"></button><figcaption>九年級專題研究報告－現代對於男性織布的看法</figcaption></figure></div><hr><h2 id="s11">五、佐證資料清單</h2><div class="drive"><div class="dh"><span class="dico" aria-hidden="true">📁</span><b>佐證資料夾（Google 雲端硬碟）</b><a href="https://drive.google.com/drive/folders/1plPAMwAPHZUdYoCtG5DUrcbb1TaKNj3e?usp=sharing" target="_blank" rel="noopener">在新分頁開啟 ↗</a></div><iframe src="https://drive.google.com/embeddedfolderview?id=1plPAMwAPHZUdYoCtG5DUrcbb1TaKNj3e#list" title="佐證資料夾" loading="lazy"></iframe></div>',toc:[{id:"s1",t:"一、指標原文"},{id:"s2",t:"二、學校現況說明"},{id:"s9",t:"三、文化課程學習回饋統整分析（互動圖表）"},{id:"s10",t:"四、精選照片"},{id:"s11",t:"五、佐證資料清單"}]},"3-4":{html:'<h2 id="s1">一、指標原文</h2><blockquote>學生對於自身民族文化認知與認同提升情形</blockquote><hr><h2 id="s2">二、學校現況說明</h2><p>學生民族文化認知與認同之提升難以透過單一數據呈現，本校從在校學習歷程觀察、跨文化接觸表現及畢業生追蹤回饋三個面向蒐集證據。</p><h3 id="s3">（一）在校學習歷程之觀察</h3><p>從文化課程之實作參與、師生日常互動，以及學生面對各年級課程主題之態度與表現，均可觀察到學生對自身文化之認識持續加深。七年級學生於燒墾生活與傳統農耕課程後，對泰雅族與土地之關係有更具體之認識；八年級學生完成地機編織作品後，對 gaga 家族倫理與傳統技藝間之文化脈絡有更深刻之理解；九年級學生則透過山林智慧課程與部落踏查，對部落傳統領域、生態知識與祖先生活建立更整體之連結。</p><p>114 學年度文化課程學習回饋問卷（七至九年級共六份）之質性回饋顯示，學生已能以「自己的文化」「自己的根」自我定位，並主動表達向耆老學習與文化傳承之意願。</p><p>另一項具體證據是 113 學年度守月期間之全校集體省思：學生在檢視自身言行時，所使用的分類軸線是「有沒有遵守 gaga」而非校規條文，顯示族群規範已成為學生自我檢視之內在依據。</p><p class="c-gray"><i>（集體省思心智圖與守月時期學輔工作機制，詳見 </i><i><a class="mention" href="#p6-3" data-page="6-3"><span class="mi">💡</span>6-3 學校辦理民族教育之創新與省思</a></i><i> 之「magu byaling 與 sbalay 之校內制度化實踐」）</i></p><h3 id="s4">（二）跨文化接觸中展現之文化自信</h3><p>本校自 111 學年度起連續四年與臺北歐洲學校辦理跨文化交流，並接待日本、新加坡等地師生來訪。在這些場合中，學生能主動介紹泰雅族文化、展示傳統技藝。於族語朗讀、族語單詞、族語戲劇等競賽之準備與參賽歷程中，帶隊教師均觀察到學生展現更明確之文化認同與族群自信。</p><h3 id="s5">（三）畢業校友追蹤回饋</h3><p>本校定期辦理畢業生升學就業追蹤，蒐集畢業生對實驗教育影響之回饋。114 學年度調查回收 109 至 113 學年度畢業生問卷 33 份（就學 27 人、就業 6 人），結果顯示多數畢業生正面肯定實驗教育於文化認同上之影響：離開部落就讀後，能在新學校自信且主動地與師生分享泰雅文化；亦有畢業生指出，在本校養成之「動手做」與「自己找答案」習慣，使其在高中職實習課程與日常生活中展現較強之自主學習與應變能力。</p><p>調查同時呈現值得後續深化之處：少數畢業生表示影響有限，或提及離開部落後族語能力可能淡忘、面對詢問時因自覺學習不足而難以清楚說明。此類回饋已作為本校在族語能力、文化知識深度與畢業後銜接支持上持續加強之依據。</p><p>除問卷調查外，另有一個具體個案。該生於 109 學年度畢業，為本校首屆完整接受三年實驗教育的學生之一，在校期間對地機編織產生高度興趣，投入程度超出課程要求，課後與返家後自行練習，並主動向部落中仍保有織作記憶的長者請教。升讀高中後，該生未因離開部落而中斷，持續織作，並向非原住民同學介紹泰雅族之織布文化；其後以此一專長經特殊選才管道錄取國立政治大學民族學系。此一個案之意義不在升學結果，而在其歷程：文化課程提供的是起點與方法，學生在離校之後自行延續，最終將文化學習轉化為高等教育階段之自主選擇。</p><h3 id="s6">（四）族語能力認證之取得情形</h3><p>原住民族語言能力認證分為初級、中級與中高級，其中初級為國民中學階段應具備之基本標準。本校 114 學年度第 2 學期在學之學生 33 人中，<b>29 人（87.9％）已取得族語能力認證</b>；其中 <b>21 人（63.6％）取得中級以上</b>，已超過國中畢業應具備之標準。七年級 9 人並全數通過認證。</p><div class="tablewrap"><table class="fit"><tr><th scope="col">方言別／級次</th><th scope="col">七年級</th><th scope="col">八年級</th><th scope="col">九年級</th><th scope="col">合計</th></tr><tr><td>四季泰雅語－初級</td><td>2</td><td>1</td><td>1</td><td>4</td></tr><tr><td>四季泰雅語－中級</td><td>1</td><td>1</td><td>3</td><td>5</td></tr><tr><td>四季泰雅語－中高級</td><td>0</td><td>1</td><td>0</td><td>1</td></tr><tr><td>賽考利克泰雅語－初級</td><td>1</td><td>1</td><td>2</td><td>4</td></tr><tr><td>賽考利克泰雅語－中級</td><td>5</td><td>6</td><td>4</td><td>15</td></tr><tr><td>賽考利克泰雅語－中高級</td><td>0</td><td>0</td><td>0</td><td>0</td></tr><tr><td><b>各年級取得認證人數／班級人數</b></td><td><b>9／9</b></td><td><b>10／11</b></td><td><b>10／13</b></td><td><b>29／33</b></td></tr></table></div><p class="c-gray">統計時點為 114 學年度第 2 學期，表列人數為該時點之在學學生；因學生異動，與首頁所載 115 學年度學生數略有不同。</p><p>本校依學生個別起點採循序漸進之輔導策略，除穩固既有級別外，並鼓勵學生報考更高級別；族語教師與文化教師另利用課餘時間加強學生族語能力，並輔導學生參加族語單詞、族語朗讀及族語戲劇等競賽。</p><p class="c-gray">各項族語競賽成績另見 3-2 學生多元學習與適性發展（一）多元學習機會。</p><hr><h2 id="s7">三、學生文化課程質性回饋證據彙整（互動網頁）</h2><p>資料來源為 114 學年度第一、二學期七至九年級文化課程學習回饋問卷共六份，有效回覆合計 47 人次（七年級 7＋9 人、八年級 9＋4 人、九年級 10＋8 人）。因各年級樣本數較小，量化百分比僅作趨勢參考，以下以學生原文回饋為主要證據。</p><div class="callout bg-gray_bg"><span class="ci" aria-hidden="true">ℹ️</span><div class="cb"><p>本頁與指標 <a class="mention" href="#p3-3" data-page="3-3"><span class="mi">📝</span>3-3 學習成就多元評量</a> 之「文化課程學習回饋統整」取自同一批問卷，但分工不同：3-3 以<b>主題單元</b>為分析單位，呈現三個年級共 21 個主題單元之<b>課程成效量化統計</b>；本頁則依文化知識認知、傳統技藝學習、民族身分認同、文化傳承與世代連結、持續學習意願五個面向，呈現<b>學生文化認同之質性證據</b>。</p></div></div><div class="callout bg-brown_bg"><span class="ci" aria-hidden="true">🔗</span><div class="cb"><p><b>互動網頁｜文化課程回饋質性證據彙整（114 學年度）</b></p><p>依五個面向彙整學生原文回饋之質性證據。內容較長，建議於新分頁全螢幕檢視；下方亦提供可展開之文字版。</p><p><a href="https://bacon-sys.github.io/115-eval-feedback-qualitative/" target="_blank" rel="noopener">在新分頁開啟完整彙整 ↗</a></p></div></div><p><i><span class="c-gray">下方為完整網頁之文字版，可直接於本頁展開閱讀。</span></i></p><details class="tg"><summary>質性證據（一）文化知識認知：理解文化內涵、規範與族群源流</summary><div class="tb"><blockquote>去 Pinsbkan 後，我很認真回憶我們那兩天的過程，讓我很欣慰，欣慰是因為我們可以一起去探索以前的生活也知道祖先在哪裡，我們為什麼是泰雅族我們從哪裡來在 Pinsbkan 當中都能學習到。<br>—— 九年級 114-1</blockquote><blockquote>謝謝老師教我們做傳統器具還有陷阱和這些東西的傳統意涵。<br>—— 九年級 114-1</blockquote><blockquote>謝謝老師教我們泰雅族狩獵文化的禁忌，讓我能夠不再像以前一樣犯錯。<br>—— 九年級 114-1</blockquote><p>八年級雖以地機編織實作為最有收穫課程，最想繼續加深學習者卻為「傳統信仰與生命禮俗」及「家與 gaga 團體」等文化知識課程，顯示學生對文化脈絡與知識體系具主動探索需求。</p></div></details><details class="tg"><summary>質性證據（二）傳統技藝學習：從實作中內化文化技能</summary><div class="tb"><blockquote>藤製器物，因為我覺得做背簍最難，很難的我就會記住。<br>—— 七年級 114-2</blockquote><blockquote>我印象最深刻的課程是狩獵課，我學到了怎麼放陷阱、怎麼看動物走的路。<br>—— 九年級 114-1</blockquote><blockquote>整經：因為在整經的時候需要專注，如果沒有專注就很容易做錯，讓我印象深刻是因為我常常做錯所以用了很久。<br>—— 八年級 114-1</blockquote><p>量化資料亦相呼應：八年級 114-2 全數學生對傳統地機編織評為「非常有收穫」；七年級最想繼續加深學習之課程為竹製生活器具（114-1，71.4％）與藤製背簍（114-2，55.6％）。</p></div></details><details class="tg"><summary>質性證據（三）民族身分認同：以「自己的文化」自我定位</summary><div class="tb"><blockquote>謝謝老師們可以讓我學習到自己的文化。<br>—— 九年級 114-1</blockquote><blockquote>謝謝老師教我，讓我更認識了泰雅族的傳統。<br>—— 九年級 114-1</blockquote><blockquote>謝謝老師們教我們許多的技藝，讓我可以好好看看自己的文化。<br>—— 八年級 114-2</blockquote><blockquote>Pinsbkan，爬上去心中的感動無法用言語形容。<br>—— 九年級 114-1</blockquote><p>九年級 Pinsbkan 尋根之旅獲過半數學生票選為最有收穫課程（114-1，50％），學生以「感動」「欣慰」「成就感」等語彙描述親臨泰雅族起源地之經驗。</p></div></details><details class="tg"><summary>質性證據（四）文化傳承與世代連結</summary><div class="tb"><blockquote>謝謝國中三年教過我們的所有老師，也謝謝每位耆老，讓我們收穫很多很多的知識，也讓我們更了解自己的根還有以前祖先的生活。<br>—— 九年級 114-2</blockquote><blockquote>感謝所有的文化老師，教了我們不管是生活還是物品，真的讓我學習到了以前族人的努力，也讓我知道以前族人怎麼活下來的。<br>—— 九年級 114-1</blockquote><blockquote>謝謝老師教我們做這些物品，讓我們認識以前老人家的智慧在哪裡。<br>—— 七年級 114-2</blockquote><blockquote>在做地機編織，其實很好玩，而且很有像阿嬤的感覺。<br>—— 八年級 114-1</blockquote><p>學生並主動提出「希望有耆老來教我們」「希望可以有耆老可以來教我們，多跟我們有互動」（九年級 114-1），顯示學生重視與部落耆老之世代互動。</p></div></details><details class="tg"><summary>質性證據（五）持續學習意願</summary><div class="tb"><ul><li>九年級 114-1：Pinsbkan 部落遷徙與歷史、漁獵生態體驗並列最想加深之課程（各 40％）。</li><li>八年級 114-1：最想加深者為傳統信仰與生命禮俗（33.3％）與家與 gaga 團體（22.2％），顯示對文化知識體系之探索需求勝過單純實作。</li><li>七年級 114-2：學生建議增加課程與操作練習時間。</li><li>九年級 114-2：學生建議口簧琴單元增加向耆老學習吹奏之時間，專題研究則希望提前於上學期開始。</li></ul></div></details><details class="tg"><summary>跨年級發展觀察</summary><div class="tb"><p>七年級著重文化基礎體驗與實作入門，回饋多聚焦於動手做之樂趣與成就感；八年級轉向文化知識體系之深化，開始表達對文化脈絡理解之需求，並出現家族情感之連結；九年級則透過 Pinsbkan 尋根之旅、部落踏查與漁獵體驗，達到文化尋根與身分認同之成熟階段，能明確表達文化傳承之責任感，形成完整之文化學習階梯。</p></div></details><hr><h2 id="s8">四、畢業校友現況調查與文化認同回饋（互動網頁）</h2><div class="callout bg-brown_bg"><span class="ci" aria-hidden="true">🔗</span><div class="cb"><p><b>互動網頁｜畢業校友現況調查與文化認同回饋</b></p><p>109～113 學年度畢業生 33 份回饋之調查結果與文化認同面向分析。</p><p><a href="https://bacon-sys.github.io/115-eval-graduate/" target="_blank" rel="noopener">在新分頁開啟完整調查 ↗</a></p></div></div><p class="c-gray"><i>下方為完整網頁之文字版，可直接於本頁展開閱讀。</i></p><details class="tg"><summary>調查基本資料與文化認同面向分析（文字版）</summary><div class="tb"><div class="tablewrap"><table class="fit"><tr><th scope="row">回覆人數</th><td>33 位畢業生</td></tr><tr><th scope="row">畢業年度</th><td>109～113 學年度</td></tr><tr><th scope="row">目前現況</th><td>就學 27 位、就業 6 位</td></tr><tr><th scope="row">部落分布</th><td>南山 13 位、四季 13 位、茂安 7 位</td></tr><tr><th scope="row">發展去向</th><td>高中職、五專、大學、職場與軍職皆有</td></tr></table></div><p>調查依三題開放式問題進行：（1）「動手做」或「自己找答案」的課程經驗對現在的生活是否有幫助；（2）國中時期接觸的泰雅文化課程對畢業後有何影響；（3）在現在的學校被問起原住民身分或部落文化時的感受。</p><div class="tablewrap"><table class="fit"><tr><th scope="col">認同面向</th><th scope="col">學生表現</th><th scope="col">代表意義</th></tr><tr><td>我知道我是誰</td><td>認識泰雅文化、記得原住民身分</td><td>文化課程協助學生建立自我定位</td></tr><tr><td>我願意說出來</td><td>面對提問時能大方、自信分享</td><td>身分認同轉化為表達能力</td></tr><tr><td>我能與他人對話</td><td>向同學、老師、不同族群朋友介紹文化</td><td>文化學習成為跨文化溝通資源</td></tr><tr><td>我會比較與反思</td><td>在校外環境中看見部落互助、共同完成事情的價值</td><td>部落生活經驗成為理解世界的視角</td></tr><tr><td>我仍想繼續學</td><td>覺得自己文化理解仍不足，或擔心族語淡忘</td><td>顯示文化課程需持續深化與銜接</td></tr></table></div></div></details><details class="tg"><summary>畢業生回饋原文摘錄（文字版）</summary><div class="tb"><p><b>文化認同</b></p><blockquote>我很驕傲也很開心，這樣讓更多人知道泰雅族的存在。</blockquote><blockquote>很開心也很幸運自己是原住民。</blockquote><blockquote>我可以很開心很放鬆的回答，也很驕傲。</blockquote><p><b>文化表達</b></p><blockquote>可以在自我介紹中讓大家更瞭解泰雅族。</blockquote><blockquote>當同學或老師們問起我們的文化，我可以很輕鬆的跟他們聊。</blockquote><blockquote>到高中也可以接觸到不同的文化，用自己知道的來傳達給不知道的人。</blockquote><p><b>文化連結</b></p><blockquote>讓我們知道自己還是泰雅族的小孩，不能忘記身為原住民的血。</blockquote><blockquote>我對我的文化認同更深，發現其實現在消失的很快，而我有學過。</blockquote><p><b>實作探究能力之遷移</b></p><blockquote>非常有幫助，會讓現在的我習慣主動找答案。</blockquote><blockquote>遇到問題或困難第一時間就會找方法去解決。</blockquote><blockquote>到了高中之後會變得獨立，可以不用很依賴其他人，也可以自己完成很多事。</blockquote><p><b>仍待深化之處</b></p><blockquote>我覺得在山下還好，因為發現在山下久了自己的族語都快忘了一部分。</blockquote><blockquote>我會有點手足無措，因為我覺得我沒學的那麼好，沒辦法跟他們解釋清楚我的文化。</blockquote></div></details><hr><h2 id="s9">五、學生省思與心情分享</h2><p>本節為學生於文化課程、祭儀現場與 Pinsbkan 尋根途中之即時口述紀錄，共 7 段。與前三節之問卷、調查資料性質不同，此處呈現的是學生在文化實踐當下的自述。</p><div class="callout bg-gray_bg"><span class="ci" aria-hidden="true">🎬</span><div class="cb"><p><b>影片組成</b></p><ul><li><b>Smgatu 小米播種祭</b>（2 段）：113、114 年度畢業校友自主返校參與祭儀後之心情分享。</li><li><b>Pinsbkan 尋根之旅</b>（3 段）：九年級學生 1 段、隨行畢業校友 2 段，於泰雅族起源地 Pinsbkan 現場錄製。</li><li><b>Cmyus 祖靈感恩祭</b>（1 段）：八年級學生於祭儀後之省思。</li><li><b>九年級漁獵課程</b>（1 段）：九年級學生於漁獵課程體驗後之想法分享。</li></ul></div></div><p>文化認同難以由單一指標衡量。本頁前三節分別以課程回饋問卷、跨文化場合之教師觀察及畢業生追蹤調查提出證據，惟三者皆屬書面或轉述形式，均經由紙筆這一層轉譯。影像紀錄補足的正是這一段落差：學生在祭儀、祖居地的即時反應、語氣與神情，是問卷選項與文字摘錄無法承載的。</p><p>其中畢業校友自主返校參與 Smgatu 之紀錄尤具意義。學生離校之後並無任何義務返校參與祭儀，此一行動本身即為文化認同之具體表現；影片所記錄者，是這項選擇之後的自述。</p><h3 id="s10">重點引述</h3><div class="callout bg-brown_bg"><span class="ci" aria-hidden="true">🪶</span><div class="cb"><p><b>從課堂的文化喚起，到祖源地的身分確認，再到離校後的主動回望</b></p><p>以下保留影片字幕原文，依學生文化認同逐步形成的三個階段呈現。</p></div></div><div class="cols" style="--tpl:33.33fr 33.33fr 33.33fr"><div class="col"><details class="tg h4 bg-orange_bg"><summary>① 在文化課程中被喚起</summary><div class="tb"><p><i><span class="c-gray">從「不知道」到理解文化知識、家族連結、共享倫理與傳承責任。</span></i></p><blockquote>我國小是讀三峽，我不知道我們泰雅族的文化、那些狩獵方式，所以我根本就沒有問我阿公。其實到我進來大同國中之後，我就慢慢地知道我們泰雅族以前有什麼漁獵、狩獵，還有 Rusa 陷阱之類的那些。<br>—— 九年級・漁獵課程</blockquote><blockquote>我知道我們家族是以漁獵為主的，可是我從以前到現在都沒有跟我的外公去過溪裡面……可是就是因為這一次的機會，讓我跟阿公一起到了溪裡面一起毒魚。<br>—— 九年級・漁獵課程</blockquote><blockquote>溪流是整個部落的財產，所以他們在漁獵的時候，一定是整個部落一起。不可以說你今天去毒了，然後你把魚全部都拿走——你要部落一起去毒，抓到的魚分給大家。<br>—— 九年級・漁獵課程</blockquote><blockquote>阿公有跟我們講，我們以前不會抓小隻的魚，我們會讓小隻的魚回歸生態，留著給下一代。<br>—— 九年級・漁獵課程</blockquote><blockquote>我覺得文化就是要看你要不要、有沒有想要去得到它。如果你是 Tayal，可是你沒有想要做我們的文化，你就不會想要去學習；可是如果你是 Tayal，你又有機會可以去認識你的文化，並且你又想要學習——你今天去學，你就會得到，一分耕耘一分收穫。<br>—— 九年級・漁獵課程</blockquote><blockquote>這算是我們全校第一次的 Cmyus。可以在這個祭典當中看到，我們泰雅族其實在那個年代，大家都是很團結的，男女都會分工，把自己的工作做完，然後因著他們的合作，就能夠把這個祭典辦成。<br>—— 八年級・祖靈感恩祭</blockquote><blockquote>我們的族人們都是很敬畏我們的祖靈，所以在要開始種小米之前，會祈求祖靈賦予他們平安、祝福以及庇佑，讓他們種的小米能夠豐收；然後在結束之後，他們也會知道要有感恩的心，要感恩祖靈。<br>—— 八年級・祖靈感恩祭</blockquote></div></details></div><div class="col"><details class="tg h4 bg-green_bg"><summary>② 在祖源地 Pinsbkan 被確認</summary><div class="tb"><p><i><span class="c-gray">祖源地不只是學習場域，更使身分認同轉化為「我回家了」的具體感受。</span></i></p><blockquote>這一次上去，我是真的很用心在感受每一步帶給我的感覺。因為我在走的途中，我發現是這塊土地賦予給我這個身分—Tayal。<br>—— 畢業校友・Pinsbkan 尋根之旅</blockquote><blockquote>我也很開心、很驕傲，我是同中畢業的。……我也要謝謝當地的長老 mama 們，這份感謝永遠都感謝不完。mhuway simu，辛苦你們。<br>—— 畢業校友・Pinsbkan 尋根之旅</blockquote><blockquote>我們可能從小在山上長大，你可能不會覺得說我是泰雅族，因為我們都在部落，每個人都是我身邊的人，我很認識。可是你今天出去讀書，去到不一樣的地方，你就會覺得——欸，怎麼都是陌生人？我是誰、我在哪裡？可是你今天來到這裡的時候，你覺得說：我回家了。<br>—— 畢業校友・Pinsbkan 尋根之旅</blockquote><blockquote>我覺得我們其實是一個驕傲的民族，其實我們東西都還在……你們有學自己的文化、祭儀，傳統的東西跟其他人都沒有。所以我覺得自我認同非常重要。<br>—— 畢業校友・Pinsbkan 尋根之旅</blockquote></div></details></div><div class="col"><details class="tg h4 bg-blue_bg"><summary>③ 離校之後被辨識</summary><div class="tb"><p><i><span class="c-gray">當學生離開部落，文化經驗成為主動返校、確認歸屬並支撐自己前行的力量。</span></i></p><blockquote>我想回來，是想熟悉一下之前那個 Smgatu 的感覺，因為現在真的有點忘記那個感覺了。<br>—— 畢業校友・Smgatu 返校</blockquote><blockquote>我覺得他們現在的感覺跟我之前的感覺一樣，就是「我為什麼要在這裡」，覺得我在做一個學校要我做的事情。但是我為什麼會想回來，就是因為我覺得這是我想做的，而且我覺得這是我該做的事情。<br>—— 畢業校友・Smgatu 返校</blockquote><blockquote>回想起國中那樣子的一些事情，我會覺得那會成為我繼續走下去的勇氣……回想起國中就會覺得，是一種家的感覺。<br>—— 畢業校友・Smgatu 返校</blockquote><blockquote>像其他的國中，就是山下，就是讀書……可是因為有實驗民族學校的關係，所以才能讓我碰到文化這種東西，就是太特別了。<br>—— 畢業校友・Smgatu 返校</blockquote><blockquote>這次主要回來就是因為想念。如果你待在山下，就算你有好朋友，放學大家都有自己各自的事情要忙。可是在大同國中，早上大家一起上學，下午放學大家會一起去打球、或是做一些共同的事情——你在山下沒有辦法有這麼多人一起做一樣的事情。<br>—— 畢業校友・Smgatu 返校</blockquote><blockquote>很多時候變得一直都是自己一個人，你自己一個人要去做很多事情，而且是做一些你自己沒有做過的事情……不會有在大同國中那種安心感。不管怎樣就是一定要去面對。<br>—— 畢業校友・Smgatu 返校</blockquote></div></details></div></div><div class="cols" style="--tpl:25.00fr 25.00fr 25.00fr 25.00fr"><div class="col"><figure class="video"><div class="vf"><iframe src="https://www.youtube-nocookie.com/embed/Li7O-joknIY" title="113 年度畢業校友自主返校參與 Smgatu 心情分享" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe></div><figcaption>113 年度畢業校友自主返校參與 Smgatu 心情分享</figcaption></figure><figure class="video"><div class="vf"><iframe src="https://www.youtube-nocookie.com/embed/Ru5agjABHhk" title="畢業校友一同參與 Pinsbkan 尋根之旅發抒心情與省思（1）" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe></div><figcaption>畢業校友一同參與 Pinsbkan 尋根之旅發抒心情與省思（1）</figcaption></figure></div><div class="col"><figure class="video"><div class="vf"><iframe src="https://www.youtube-nocookie.com/embed/GRa3ubPrVPM" title="114 年度畢業校友自主返校參與 Smgatu 心情分享" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe></div><figcaption>114 年度畢業校友自主返校參與 Smgatu 心情分享</figcaption></figure><figure class="video"><div class="vf"><iframe src="https://www.youtube-nocookie.com/embed/z1p5Nu5HBTg" title="畢業校友一同參與 Pinsbkan 尋根之旅發抒心情與省思（2）" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe></div><figcaption>畢業校友一同參與 Pinsbkan 尋根之旅發抒心情與省思（2）</figcaption></figure></div><div class="col"><figure class="video"><div class="vf"><iframe src="https://www.youtube-nocookie.com/embed/oXHx0ZHhyR8" title="八年級學生對於 Cmyus 祖靈感恩祭的省思" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe></div><figcaption>八年級學生對於 Cmyus 祖靈感恩祭的省思</figcaption></figure><figure class="video"><div class="vf"><iframe src="https://www.youtube-nocookie.com/embed/BjsmjAP5n6U" title="九年級學生於 Pinsbkan 尋根之旅發抒心情與省思" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe></div><figcaption>九年級學生於 Pinsbkan 尋根之旅發抒心情與省思</figcaption></figure></div><div class="col"><figure class="video"><div class="vf"><iframe src="https://www.youtube-nocookie.com/embed/oKVg0il55yA" title="九年級學生對於漁獵課程的分享" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe></div><figcaption>九年級學生對於漁獵課程的分享</figcaption></figure></div></div><hr><h2 id="s11">六、外部觀察與學術研究（互動網頁）</h2><p>前五節之證據均由本校自行收集與整理。本節則為外部研究者之獨立觀察，資料來源與觀點均不同於前述各項。</p><p>114 學年度下學期，國立臺北教育大學教育創新與評鑑碩士班研究生以信任建立、生命之河及認同主題討論三場活動，與九位九年級學生就文化學習與族群認同進行對話。其觀察指出，參與學生全數對泰雅族身分表達正向感受，並將文化課視為認識族群歷史與傳統生活之重要來源；同時亦指出學生對部分學習內容存在實用性與文化性之判斷落差。研究者並明確說明，文化課是否有效促進文化認同無法僅由該次活動推論。本頁以外部視角補充本校自評資料，正反面發現均予呈現。</p><p>另一份為國立臺灣大學人類學系碩士論文（鄧教東，2024），田野期間涵蓋 112 學年度完整一學年。該研究訪談一位已成年之第一屆畢業生，該生就讀期間學校尚未將四項特質明列，但其表示現在回頭看確實感受到這四項特質的培育，並認為文化課程所教技能相對次要、三年的精神性養成更為重要。論文亦記錄此畢業生自本校文化課程起步、畢業後持續向部落耆老學習織布的歷程。</p><div class="callout bg-brown_bg"><span class="ci" aria-hidden="true">🔍</span><div class="cb"><p><b>互動網頁｜外部觀察與學術研究</b></p><p>彙整兩份外部資料：觀課與訪談報告（114 學年度）共 12 項發現，及人類學碩士論文（2024 年）共 14 項發現，可依指標篩選；並一併呈現研究者所指出之限制。</p><p><a href="https://bacon-sys.github.io/115-eval-external-observer/" target="_blank" rel="noopener">在新分頁開啟 ↗</a></p></div></div><hr><h2 id="s12">七、精選照片</h2><div class="cols" style="--tpl:33.33fr 33.33fr 33.33fr"><div class="col"><figure class="img"><button type="button" class="ph" data-full="img/full/6f10ebb0a2.jpg" data-cap="跨文化交流活動中，本校學生與臺北歐洲學校學生共同以竹材製作趕鳥器。" aria-label="放大照片：跨文化交流活動中，本校學生與臺北歐洲學校學生共同以竹材製作趕鳥器。"><img src="img/full/6f10ebb0a2.jpg" alt="跨文化交流活動中，本校學生與臺北歐洲學校學生共同以竹材製作趕鳥器。" loading="lazy" width="900" height="1600"></button><figcaption>跨文化交流活動中，本校學生與臺北歐洲學校學生共同以竹材製作趕鳥器。</figcaption></figure><figure class="video short"><div class="vf"><iframe src="https://www.youtube-nocookie.com/embed/REXtBquzsVA" title="用英文向新加坡花菲衛理中學的學生介紹傳統建築（1）" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe></div><figcaption>用英文向新加坡花菲衛理中學的學生介紹傳統建築（1）</figcaption></figure></div><div class="col"><figure class="img"><button type="button" class="ph" data-full="img/full/5f6ba57bd5.jpg" data-cap="日本田園調布學園師生到校交流，於校內文化場域參與泰雅文化體驗課程。" aria-label="放大照片：日本田園調布學園師生到校交流，於校內文化場域參與泰雅文化體驗課程。"><img src="img/full/5f6ba57bd5.jpg" alt="日本田園調布學園師生到校交流，於校內文化場域參與泰雅文化體驗課程。" loading="lazy" width="721" height="1280"></button><figcaption>日本田園調布學園師生到校交流，於校內文化場域參與泰雅文化體驗課程。</figcaption></figure><figure class="video short"><div class="vf"><iframe src="https://www.youtube-nocookie.com/embed/lhD3lxH4sWc" title="用英文向新加坡花菲衛理中學的學生介紹傳統建築（2）" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe></div><figcaption>用英文向新加坡花菲衛理中學的學生介紹傳統建築（2）</figcaption></figure></div><div class="col"><figure class="img"><button type="button" class="ph" data-full="img/full/d5e2d193d2.jpg" data-cap="校慶暨文化成果展攤位，學生向來賓介紹藤帽 qbubu、背簍與漁撈捕獵器具之編製方式與傳統用途。" aria-label="放大照片：校慶暨文化成果展攤位，學生向來賓介紹藤帽 qbubu、背簍與漁撈捕獵器具之編製方式與傳統用途。"><img src="img/full/d5e2d193d2.jpg" alt="校慶暨文化成果展攤位，學生向來賓介紹藤帽 qbubu、背簍與漁撈捕獵器具之編製方式與傳統用途。" loading="lazy" width="1600" height="900"></button><figcaption>校慶暨文化成果展攤位，學生向來賓介紹藤帽 qbubu、背簍與漁撈捕獵器具之編製方式與傳統用途。</figcaption></figure><figure class="img"><button type="button" class="ph" data-full="img/full/114eef4d24.jpg" data-cap="校慶文化成果展中，各年級學生以簡報形式向來賓報告該年段文化課程之學習內容與成果。" aria-label="放大照片：校慶文化成果展中，各年級學生以簡報形式向來賓報告該年段文化課程之學習內容與成果。"><img src="img/full/114eef4d24.jpg" alt="校慶文化成果展中，各年級學生以簡報形式向來賓報告該年段文化課程之學習內容與成果。" loading="lazy" width="1600" height="1200"></button><figcaption>校慶文化成果展中，各年級學生以簡報形式向來賓報告該年段文化課程之學習內容與成果。</figcaption></figure><figure class="video short"><div class="vf"><iframe src="https://www.youtube-nocookie.com/embed/mzo_yAUiusE" title="用英文向新加坡花菲衛理中學的學生介紹傳統建築（3）" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe></div><figcaption>用英文向新加坡花菲衛理中學的學生介紹傳統建築（3）</figcaption></figure></div></div><hr><h2 id="s13">八、佐證資料清單</h2><div class="drive"><div class="dh"><span class="dico" aria-hidden="true">📁</span><b>佐證資料夾（Google 雲端硬碟）</b><a href="https://drive.google.com/drive/folders/1ELPQWH3TYX-Wud-Tk-1RaI-cX3aMkl-M?usp=sharing" target="_blank" rel="noopener">在新分頁開啟 ↗</a></div><iframe src="https://drive.google.com/embeddedfolderview?id=1ELPQWH3TYX-Wud-Tk-1RaI-cX3aMkl-M#list" title="佐證資料夾" loading="lazy"></iframe></div>',toc:[{id:"s1",t:"一、指標原文"},{id:"s2",t:"二、學校現況說明"},{id:"s7",t:"三、學生文化課程質性回饋證據彙整（互動網頁）"},{id:"s8",t:"四、畢業校友現況調查與文化認同回饋（互動網頁）"},{id:"s9",t:"五、學生省思與心情分享"},{id:"s11",t:"六、外部觀察與學術研究（互動網頁）"},{id:"s12",t:"七、精選照片"},{id:"s13",t:"八、佐證資料清單"}]},"4-1":{html:'<h2 id="s1">一、指標原文</h2><blockquote>相關經費之運用與執行</blockquote><hr><h2 id="s2">二、學校現況說明</h2><p>本校辦理學校型態原住民族實驗教育計畫，經費來源主要為行政院原住民族委員會補助款（以下簡稱央款）及宜蘭縣政府鼓勵學校推動實驗教育補助款（以下簡稱縣款），歷年均依核定項目規劃執行，並依規定程序辦理核銷結報。</p><h3 id="s3">（一）本評鑑期間經費執行情形</h3><div class="tablewrap"><table class=""><tr><th scope="col">學年度</th><th scope="col">計畫名稱</th><th scope="col">補助來源</th><th scope="col">核定金額</th><th scope="col">實際執行數</th><th scope="col">餘款繳回</th><th scope="col">執行率</th></tr><tr><td>112</td><td>學校型態原住民族實驗教育計畫</td><td>央款</td><td>1,500,000 元</td><td>1,462,194 元</td><td>37,806 元</td><td>97.48％</td></tr><tr><td>112</td><td>鼓勵學校型態實驗教育學校推動實驗教育補助計畫</td><td>縣款</td><td>300,000 元</td><td>300,000 元</td><td>0 元</td><td>100％</td></tr><tr><td>113</td><td>學校型態原住民族實驗教育計畫</td><td>央款</td><td>1,500,000 元</td><td>1,486,473 元</td><td>13,527 元</td><td>99.10％</td></tr><tr><td>113</td><td>鼓勵學校型態實驗教育學校推動實驗教育補助計畫</td><td>縣款</td><td>300,000 元</td><td>300,000 元</td><td>0 元</td><td>100％</td></tr><tr><td>114</td><td>學校型態原住民族實驗教育計畫</td><td>央款</td><td>1,300,000 元</td><td>1,289,919 元</td><td>10,081 元</td><td>99.22％</td></tr><tr><td>114</td><td>鼓勵學校型態實驗教育學校推動實驗教育補助計畫</td><td>縣款</td><td>300,000 元</td><td>300,000 元</td><td>0 元</td><td>100％</td></tr></table></div><h3 id="s4">（二）逐年執行說明</h3><ul><li><b>112 學年度</b>：央款核定 150 萬元，全年實際執行 1,462,194 元，餘款 37,806 元依規繳回，執行率 97.48％；縣款核定 30 萬元，全數執行完畢。支出涵蓋約僱文化指導員薪資、部落耆老外聘授課鐘點費、教材教具費、材料費、交通費等，均依核定補助項目辦理。</li><li><b>113 學年度</b>：央款核定 150 萬元，全年實際執行 1,486,473 元，餘款 13,527 元依規繳回，執行率 99.10％；縣款核定 30 萬元，全數執行完畢。執行項目除延續文化課程相關支出外，另依計畫辦理部落耆老授課、教師文化增能研習等，並聘請具國家文化資產保存者資格之耆老入校授課，強化課程文化深度。</li><li><b>114 學年度</b>：央款核定 130 萬元，全年實際執行 1,289,919 元，餘款 10,081 元依規繳回，執行率 99.22％；縣款核定 30 萬元，全數執行完畢。本年度執行項目持續涵蓋泰雅文化課程、耆老協同教學及教師增能研習等。</li></ul><h3 id="s5">（三）財務管理原則</h3><p>本校行政團隊在運用實驗教育經費時，秉持<b>專款專用、透明公開</b>之原則，所有收支均設置專帳獨立處理，並依規定保存合法憑證及完備會計紀錄。各學年度央款均依規辦理第一期、第二期及全期經費結報，縣款則按年度編製收支結報表，確保財務健全，符合實驗教育財務透明健全之精神。</p><hr><h2 id="s6">三、經費執行分析對照（互動圖表）</h2><figure class="embed"><iframe src="https://bacon-sys.github.io/115-eval-expenditure/4-1.html" title="實驗教育經費執行情形（112–114 學年度）" loading="lazy" allowfullscreen></iframe><figcaption>實驗教育經費執行情形（112–114 學年度）　<a href="https://bacon-sys.github.io/115-eval-expenditure/4-1.html" target="_blank" rel="noopener">在新分頁開啟 ↗</a></figcaption></figure><p class="c-gray"><i>圖表右上可切換「執行率」與「支出結構」；點選右下「開啟完整版分析」可見各項目逐年實支明細。</i></p><hr><div class="callout bg-gray_bg"><span class="ci" aria-hidden="true">ℹ️</span><div class="cb"><p>本指標以經費結報文件與執行率數據為主要佐證方式，故未設精選照片。經費所支持之課程與活動實況，請見 <a class="mention" href="#p3-1" data-page="3-1"><span class="mi">🌿</span>3-1 課程教學、發展與落實</a> 及 <a class="mention" href="#p6-2" data-page="6-2"><span class="mi">🌾</span>6-2 學生學習部落歲時生活情形</a>。</p></div></div><hr><h2 id="s7">四、佐證資料清單</h2><div class="drive"><div class="dh"><span class="dico" aria-hidden="true">📁</span><b>佐證資料夾（Google 雲端硬碟）</b><a href="https://drive.google.com/drive/folders/18miG_7V2dMiUjuKMMZu_d6veAdysD7RT?usp=sharing" target="_blank" rel="noopener">在新分頁開啟 ↗</a></div><iframe src="https://drive.google.com/embeddedfolderview?id=18miG_7V2dMiUjuKMMZu_d6veAdysD7RT#list" title="佐證資料夾" loading="lazy"></iframe></div>',toc:[{id:"s1",t:"一、指標原文"},{id:"s2",t:"二、學校現況說明"},{id:"s6",t:"三、經費執行分析對照（互動圖表）"},{id:"s7",t:"四、佐證資料清單"}]},"4-2":{html:'<h2 id="s1">一、指標原文</h2><blockquote>學校外部資源支持情況</blockquote><hr><h2 id="s2">二、學校現況說明</h2><p>本校積極向各級政府機關及民間資源提出申請，廣泛爭取外部資源挹注，以充實實驗教育辦學能量。茲依資源性質分述如下。</p><h3 id="s3">（一）競爭型計畫</h3><div class="tablewrap"><table class=""><tr><th scope="col">計畫名稱</th><th scope="col">用途與成果</th></tr><tr><td>學美・美學－校園美感設計實踐計畫（圖書館改善）</td><td>改善圖書館空間，提升閱讀環境品質，核定 1,800,000 元</td></tr><tr><td>112 年度營造原住民族文化學習場域實施計畫</td><td>建置校園泰雅傳統建築群（穀倉、文化廊道），核定 1,997,872 元</td></tr><tr><td>115 年度營造原住民族文化學習場域實施計畫</td><td>文化學習場域之整建與修繕（各項傳統建築屋頂與結構），核定 954,000 元</td></tr></table></div><h3 id="s4">（二）部落與地方資源合作</h3><p>學校與大同鄉公所保持長期合作關係，共同推動文化復振工作。113 學年度本校配合鄉公所辦理「大同鄉守月文化復振及推廣微電影」計畫，提供校園文化場景作為拍攝場地，展現學校作為部落文化資源核心之角色定位。</p><div class="callout bg-gray_bg"><span class="ci" aria-hidden="true">🔗</span><div class="cb"><p>該計畫後續因溝通疏失衍生場地使用爭議，本校依泰雅傳統 gaga 精神推動三方 sbalay 和解儀式，妥善處理並維繫與公所之合作關係。事件經過與關係修復歷程詳見 <a class="mention" href="#p6-1" data-page="6-1"><span class="mi">🏘️</span>6-1 部落互動與家長參與情形</a>；此一機制之創新意義詳見 <a class="mention" href="#p6-3" data-page="6-3"><span class="mi">💡</span>6-3 學校辦理民族教育之創新與省思</a>。</p></div></div><h3 id="s5">（三）各處室爭取之學生及教學支持資源（互動網頁）</h3><p>本校各處室長期積極爭取多元外部資源，近三年（112 至 114 學年度）主要爭取方向如下：</p><div class="cols" style="--tpl:50.00fr 50.00fr"><div class="col"><div class="callout bg-blue_bg"><span class="ci" aria-hidden="true">📘</span><div class="cb"><p><b>教務處</b></p><p>學習扶助計畫、數位學習精進方案、英語教學圖書充實計畫、充實圖書館藏書計畫；自 113 學年度起爭取 ELTA 外籍英語教學助理計畫；並積極為學生申請各項獎助學金</p></div></div><div class="callout bg-orange_bg"><span class="ci" aria-hidden="true">🏫</span><div class="cb"><p><b>總務處</b></p><p>校園設施設備改善相關計畫，涵蓋排水工程改善、廚房設施更新、老舊廁所整修、屋頂防水隔熱工程、飲用水設備改善、防災校園建置及災損復建等</p></div></div></div><div class="col"><div class="callout bg-green_bg"><span class="ci" aria-hidden="true">🏃</span><div class="cb"><p><b>學務處</b></p><p>原民會鼓勵原住民學生發展多元智能補助計畫、教育部學產基金補助培訓學生特殊專長、國教署教育優先區計畫（發展原住民教育文化特色）、教育部體育署原住民族學生體育運動發展計畫</p></div></div><div class="callout bg-purple_bg"><span class="ci" aria-hidden="true">🧭</span><div class="cb"><p><b>輔導室（組）</b></p><p>國教署技藝教育專案編班計畫、生涯發展教育計畫、圓夢助學計畫（全聯佩樺基金會）；自 114 年度起新增關懷動物生命教育計畫</p></div></div></div></div><div class="callout bg-blue_bg"><span class="ci" aria-hidden="true">📊</span><div class="cb"><p><b>各處室爭取之外部資源（112–114 學年度）互動網頁</b></p><p>以泰雅織紋形式呈現三年 56 案之規模與用途結構，並可依學年度、處室、用途篩選查詢完整明細。</p><p><a href="https://bacon-sys.github.io/115-eval-external-resources/" target="_blank" rel="noopener">在新分頁開啟 ↗</a></p></div></div><details class="tg"><summary>112 學年度爭取計畫資源一覽（18 案）</summary><div class="tb"><div class="tablewrap"><table class=""><tr><th scope="col">計畫名稱</th><th scope="col">核定金額（元）</th><th scope="col">主責處室</th></tr><tr><td>112 泰雅傳統家屋維護整修計畫</td><td>158,000</td><td>教務處</td></tr><tr><td>112 學年度學力提升支持與獎勵計畫</td><td>60,000</td><td>教務處</td></tr><tr><td>112 學年度學生學習扶助實施計畫</td><td>58,310</td><td>教務處</td></tr><tr><td>112 年度推動中小學數位學習精進方案</td><td>12,000</td><td>教務處</td></tr><tr><td>112 學年度宜蘭縣充實國民中小學英語教學圖書計畫</td><td>18,000</td><td>教務處</td></tr><tr><td>宜蘭縣 113 年充實各國中小圖書館藏書量經費計畫</td><td>100,000</td><td>教務處</td></tr><tr><td>112 年度營造原住民族文化學習場域實施計畫</td><td>1,997,872</td><td>教務處／總務處</td></tr><tr><td>112 學年度教育優先區計畫－發展原住民教育文化特色及充實設備材料</td><td>149,856</td><td>學務處</td></tr><tr><td>112 學年教育優先區－親職教育計畫</td><td>16,960</td><td>學務處</td></tr><tr><td>112 年度鼓勵原住民學生發展多元智能補助計畫</td><td>249,000</td><td>學務處</td></tr><tr><td>教育部學產基金 112 年度補助培訓學生特殊專長經費計畫</td><td>100,000</td><td>學務處</td></tr><tr><td>教育部體育署 112 年度補助中小學原住民族學生體育運動發展經費計畫</td><td>150,000</td><td>學務處</td></tr><tr><td>112 年廚房遮雨棚和廚餘垃圾暫放區申請計畫</td><td>150,000</td><td>總務處</td></tr><tr><t img/thumb/2d08ec7147.jpg" alt="112 年度營造原住民族文化學習場域計畫 - 傳統穀倉 改善後" loading="lazy" width="1600" height="1200"></button><figcaption>112 年度營造原住民族文化學習場域計畫 - 傳統穀倉 改善後</figcaption></figure></div><hr><h2 id="s9">四、佐證資料清單</h2><div class="drive"><div class="dh"><span class="dico" aria-hidden="true">📁</span><b>佐證資料夾（Google 雲端硬碟）</b><a href="https://drive.google.com/drive/folders/140bIHYoi27SSFJljulosi9obHHthQsJs?usp=sharing" target="_blank" rel="noopener">在新分頁開啟 ↗</a></div><iframe src="https://drive.google.com/embeddedfolderview?id=140bIHYoi27SSFJljulosi9obHHthQsJs#list" title="佐證資料夾" loading="lazy"></iframe></div>',toc:[{id:"s1",t:"一、指標原文"},{id:"s2",t:"二、學校現況說明"},{id:"s8",t:"三、精選照片"},{id:"s9",t:"四、佐證資料清單"}]},"5-1":{html:'<h2 id="s1">一、指標原文</h2><blockquote>學校訂定或檢視符合實驗教育精神之相關法規</blockquote><hr><h2 id="s2">二、學校現況說明</h2><p>本校推動原住民族實驗教育，始終以《學校型態實驗教育實施條例》及《原住民族教育法》為依循基礎。每學年度依規定修訂實驗教育計畫書，明確載明課程架構、教學目標、多元評量方式及師資安排等核心內容，並於學年度前報請主管機關核定後實施，確保各項辦學作為均在法規框架內穩健推進。</p><p>在計畫書修訂過程中，本校不僅完成規定程序，更落實實驗教育精神於細節之中；舉凡課程調整、師資聘用、祭儀活動融入課程等事項，均逐一檢視是否符合實驗教育精神與理念，並作為計畫書滾動修正之依據。凡校內活動辦法或相關規定有訂定或修訂之需要時，亦主動檢視其內容是否與實驗教育精神相符，以確保學校整體運作方向之一致性。</p><p>為確保計畫書內容貼近實驗教育精神與民族教育發展目標，本校每學期接受國立東華大學原住民族課程發展協作中心之輔導諮詢訪視，由課程學者專家及協作中心委員就課程設計、教學實施及計畫執行情形提供專業意見，協助檢核辦學方向是否符合實驗教育精神及相關法規之要求。</p><div class="callout bg-gray_bg"><span class="ci" aria-hidden="true">📌</span><div class="cb"><p><b>辦理依據</b>：本校自 107 學年度起經審議通過辦理「宜蘭縣 llaqi na llyung Mnibu ta Tayal 民族實驗國民中學」學校型態原住民族實驗教育，核定期程自 107 年 8 月 1 日起至 119 年 7 月 31 日止，共 12 年；每學年度實驗教育計畫均報經原住民族委員會及宜蘭縣政府核定後實施。</p></div></div><hr><h2 id="s3">三、依法規逐項自我檢視（互動網頁）</h2><p>以下依《學校型態實驗教育實施條例》相關條文，逐項檢視本校辦學符合實驗教育精神之情形。</p><div class="callout bg-brown_bg"><span class="ci" aria-hidden="true">🔗</span><div class="cb"><p><b>互動網頁｜檢視符合實驗教育精神之補充說明</b></p><p>依《學校型態實驗教育實施條例》逐條列示法規依據與本校辦學情形之完整對照。</p><p><a href="https://bacon-sys.github.io/115-eval-rules/" target="_blank" rel="noopener">在新分頁開啟完整說明 ↗</a></p></div></div><p class="c-gray"><i>下方五個項目為完整網頁之文字版，並加上對應指標頁面之連結，可直接於本頁展開閱讀。</i></p><details class="tg"><summary>項目一　教育理念及計畫特色（條例第 1 條、第 3 條第 1 項）</summary><div class="tb"><p><b>法規依據</b></p><blockquote>第 1 條　為鼓勵教育創新，實施學校型態實驗教育，以保障人民學習及受教育權利，增加人民選擇教育方式與內容之機會，促進教育多元化發展。</blockquote><blockquote>第 3 條第 1 項　學校型態實驗教育，指依據特定教育理念，以學校為範圍，從事教育理念之實踐，並就學校制度、行政運作、組織型態、設備設施、校長資格與產生方式、教職員工之資格與進用方式、課程教學、學生入學、學習成就評量、學生事務及輔導、社區及家長參與等事項，進行整合性實驗之教育。</blockquote><p><b>本校說明</b></p><ul><li>以「Tayal balay（真正的泰雅人）」為特定教育理念，以泰雅 gaga 為核心精神，聚焦愛土地、負責、合作、感恩四項核心特質，透過七至九年級三階段主題文化課程實踐教育理念。</li><li>本校實驗教育屬<b>整合性教育實驗</b>，就課程教學、學習成就評量、行政運作與組織型態、學生入學、學生事務及輔導、社區及家長參與等事項整體推動，並將歲時祭儀融入校園生活，與僅就個別項目進行之教育實驗不同。</li><li>採<b>大學區（自由學區）制</b>，打破既有學區界線，設籍宜蘭縣之學生皆可申請入學，滿足家長教育選擇權。</li></ul><p><b>對應指標</b>：<a class="mention" href="#p1-1" data-page="1-1"><span class="mi">🌱</span>1-1 民族教育理念之落實與實施情形</a>、<a class="mention" href="#p1-2" data-page="1-2"><span class="mi">📋</span>1-2 與計畫書符合情形</a>、<a class="mention" href="#p2-2" data-page="2-2"><span class="mi">🎓</span>2-2 學生入學與就學情形</a>、<a class="mention" href="#p6-3" data-page="6-3"><span class="mi">💡</span>6-3 學校辦理民族教育之創新與省思</a></p></div></details><details class="tg"><summary>項目二　課程及教學規劃、學習成就評量（條例第 3 條第 2 項）</summary><div class="tb"><p><b>法規依據</b></p><blockquote>第 3 條第 2 項　特定教育理念之實踐，應以學生為中心，尊重學生之多元文化、信仰及多元智能，課程、教學、教材、教法或評量之規劃，並以引導學生適性學習及促進多元教育發展為目標。</blockquote><p><b>本校說明</b></p><ul><li>課程採<b>雙文化模式</b>：每週泰雅文化課程 9 節、族語課程 1 節，以族語為主要教學語言；由文化教師、部落耆老與各領域教師協同教學，教學活動依部落歲時生活時序安排，強調實地體驗學習。</li><li>課程與教學以學生為中心，尊重學生之多元文化與多元智能，並注意學生特性與傳統文化學習之關聯，提供適性學習機會。</li><li>學習成就評量採<b>多元模式</b>：紙筆測驗、學習紀錄本、課堂形成性評量、分組合作學習、自然實境體驗，以及部落歲時活動參與之觀察與訪談等，兼顧認知、技能與情意。</li></ul><p><b>對應指標</b>：<a class="mention" href="#p3-1" data-page="3-1"><span class="mi">🌿</span>3-1 課程教學、發展與落實</a>、<a class="mention" href="#p3-2" data-page="3-2"><span class="mi">🧭</span>3-2 學生多元學習與適性發展</a>、<a class="mention" href="#p3-3" data-page="3-3"><span class="mi">📝</span>3-3 學習成就多元評量</a>、<a class="mention" href="#p3-4" data-page="3-4"><span class="mi">🪶</span>3-4 學生民族文化認知與認同</a></p></div></details><details class="tg"><summary>項目三　學生入學、學生事務及輔導（條例第 6 條第 1 項）</summary><div class="tb"><p><b>法規依據</b></p><blockquote>第 6 條第 1 項　學校型態實驗教育應維護學生基本人權，積極營造友善校園之教育環境，並遵守下列事項：實驗教育之實施應事前徵得學生本人及其法定代理人之同意或事先載明於招生簡章中；接受退出實驗教育之申請，不得以任何理由拒絕；學生不適應實驗教育並提出轉學需求時，學校應予以協助；無正當理由，不得於招生或教育過程中，使學生受差別待遇等。</blockquote><p><b>本校說明</b></p><ul><li>招生依公告之優先序位原則辦理，<b>無入學限制，亦無差別待遇</b>；學生或其家庭長期無法適應、配合時，得隨時主動提出轉學申請，學校並予以協助。</li><li>學生事務及輔導以學生為中心，維護學生基本人權，營造友善校園環境，協助學生提升文化認同、發展熱愛生命與族群認同之情操。</li></ul><p><b>對應指標</b>：<a class="mention" href="#p2-2" data-page="2-2"><span class="mi">🎓</span>2-2 學生入學與就學情形</a>、<a class="mention" href="#p3-2" data-page="3-2"><span class="mi">🧭</span>3-2 學生多元學習與適性發展</a></p></div></details><details class="tg"><summary>項目四　行政運作、組織型態、設備設施（條例第 23 條第 4 項、第 7 項）</summary><div class="tb"><p><b>法規依據</b></p><blockquote>第 23 條第 4 項　公立學校辦理學校型態實驗教育，應擬訂實驗規範，報學校主管機關核轉中央主管機關核定；於實驗規範之範圍內，得不適用國民教育法、高級中等教育法、特殊教育法、師資培育法、學生輔導法、國民體育法及其相關法規之部分規定，並應載明其不適用之相關規定。</blockquote><blockquote>第 23 條第 7 項　公立學校辦理學校型態實驗教育，得依相關法規規定以契約方式進用編制外之教職員。</blockquote><p><b>本校說明</b></p><ul><li>本校實驗規範業經教育部 107 年 12 月 3 日臺教授國部字第 1070146647 號函核定，<b>排除範圍以課程教學為限</b>，並以泰雅族本位課程架構替代。</li><li>行政運作、組織型態、設備設施等其餘事項皆無特定排除，仍依相關法規推行校務；課程計畫每學年度經實驗教育課程計畫審查小組審查後送教育處備查。</li><li>為強化實驗課程研發能量，111 學年度起於教務處下增設「<b>課程研究組</b>」，並依條例第 23 條第 7 項以契約方式進用文化教師、文化指導員及行政助理等編制外人力。</li></ul><p><b>對應指標</b>：<a class="mention" href="#p2-1" data-page="2-1"><span class="mi">🏘️</span>2-1 學習環境與設備資源</a>、<a class="mention" href="#p2-3" data-page="2-3"><span class="mi">👩‍🏫</span>2-3 師資結構與教學增能</a>、<a class="mention" href="#p4-1" data-page="4-1"><span class="mi">📊</span>4-1 經費運用情形</a>、<a class="mention" href="#p5-2" data-page="5-2"><span class="mi">🔍</span>5-2 符合實驗規範排除規定</a>、<a class="mention" href="#p5-3" data-page="5-3"><span class="mi">🗂️</span>5-3 縣訂訪評項目實施情形</a></p></div></details><details class="tg"><summary>項目五　社區及家長參與（條例第 3 條第 1 項、第 26 條第 2 項）</summary><div class="tb"><p><b>法規依據</b></p><blockquote>第 26 條第 2 項　實驗教育得與在地社區或組織合作，結合地方產業、地方創生活化教學，並得聘請業界專家協助教學。</blockquote><p><b>本校說明</b></p><ul><li>聘請<b>部落耆老、牧師、族語教師</b>等擔任文化課程協同師資，並以學區各部落、傳統領域獵場及小米園區等為教學場域，結合部落資源實施課程。</li><li>配合泰雅傳統歲時舉辦各項祭儀，學生實際參與部落歲時生活；並透過家長面談、說明與溝通，促進家長參與學校事務，深化學校與部落之夥伴關係。</li></ul><p><b>對應指標</b>：<a class="mention" href="#p6-1" data-page="6-1"><span class="mi">🏘️</span>6-1 部落互動與家長參與情形</a>、<a class="mention" href="#p6-2" data-page="6-2"><span class="mi">🌾</span>6-2 學生學習部落歲時生活情形</a>、<a class="mention" href="#p1-1" data-page="1-1"><span class="mi">🌱</span>1-1 民族教育理念之落實與實施情形</a></p></div></details><hr><h2 id="s4">四、外部檢核與備查機制</h2><figure class="embed local"><iframe src="embed/external_review_mechanism.html" title="外部檢核與備查機制｜四階段持續精進流程" loading="lazy" data-autosize></iframe><figcaption>外部檢核與備查機制｜四階段持續精進流程</figcaption></figure><hr><div class="callout bg-gray_bg"><span class="ci" aria-hidden="true">ℹ️</span><div class="cb"><p>本指標以法規檢視與核定文件為主要佐證方式，故未設精選照片。</p></div></div><hr><h2 id="s5">五、佐證資料清單</h2><div class="drive"><div class="dh"><span class="dico" aria-hidden="true">📁</span><b>佐證資料夾（Google 雲端硬碟）</b><a href="https://drive.google.com/drive/folders/1W8xlu0dpIVEqJix8te4pZJwgZBmevOFx?usp=sharing" target="_blank" rel="noopener">在新分頁開啟 ↗</a></div><iframe src="https://drive.google.com/embeddedfolderview?id=1W8xlu0dpIVEqJix8te4pZJwgZBmevOFx#list" title="佐證資料夾" loading="lazy"></iframe></div>',toc:[{id:"s1",t:"一、指標原文"},{id:"s2",t:"二、學校現況說明"},{id:"s3",t:"三、依法規逐項自我檢視（互動網頁）"},{id:"s4",t:"四、外部檢核與備查機制"},{id:"s5",t:"五、佐證資料清單"}]},"5-2":{html:'<h2 id="s1">一、指標原文</h2><blockquote>實驗規範排除法規與執行</blockquote><hr><h2 id="s2">二、學校現況說明</h2><h3 id="s3">（一）實驗規範之核定</h3><p>本校「107–118 學年度宜蘭縣立大同國民中學學校型態實驗教育規範」業經教育部 <b>107 年 12 月 3 日臺教授國部字第 1070146647 號函</b>核定（變更核定版）。縣府並於 107 年 9 月 3 日核定 107 學年度總計畫。</p><p>依實驗規範所載，本校排除範圍<b>以課程教學為限</b>，行政運作、組織型態、設備設施、師資進用等其餘事項均無特定排除，仍依相關法規推行校務。</p><h3 id="s4">（二）排除之法規、替代方案與說明</h3><div class="tablewrap"><table class=""><tr><th scope="col">實驗範圍</th><th scope="col">不適用法規</th><th scope="col">替代方案</th></tr><tr><td>課程教學</td><td>《國民教育法》有關中央主管機關訂定國民中小學課程綱要及其實施規定之條文；《十二年國民基本教育課程綱要》陸、課程架構及柒、實施要點</td><td>發展泰雅族本位之課程架構，以取代現行課程綱要，並於實驗教育計畫「課程及教學規劃」項下明定各領域節數配置</td></tr><tr><td>課程教學</td><td>依《國民教育法》授權訂定之課程綱要實施要點中，有關學校課程計畫應含各領域課程計畫及彈性學習節數課程計畫，並載明學年／學期學習目標、能力指標、對應能力指標之單元名稱、節數、評量方式等項目之規定</td><td>基本學力課程配合選用教科書與自編部分教材，進行動態單元文化回應教學；文化課程依年級設計主題課並統整教學。課程計畫由學校依自訂格式編寫，於學年度開學前經校內外審查小組審查後送教育處備查</td></tr></table></div><div class="callout bg-yellow_bg"><span class="ci" aria-hidden="true">📌</span><div class="cb"><p><b>條次變更說明</b></p><p>本校實驗規範係依當年度有效之《國民教育法》申請並經核定，其中課程架構部分所引《國民教育法》第 8 條，係當時規範中央主管機關訂定課程綱要之依據條文。《國民教育法》嗣於 112 年 6 月 21 日華總一義字第 11200052771 號令修正公布，全文分章重新編排，原第 8 條有關課程綱要之規定移列至第七章「課程、教學及學習評量」第 34 條，規範內容與文字並無實質變更。爰此，本實驗規範原文引用之「第 8 條」，對應現行法之「<b>第 34 條</b>」；規範內容維持核定原貌。</p></div></div><h3 id="s5">（三）替代之課程架構與節數配置</h3><p>本校依實驗規範所定替代方案，每週各領域節數配置如下：</p><figure class="embed local"><iframe src="embed/curriculum_hours_notion_agent_chart.html" title="每週完整課程節數配置｜國文與英語分列各 4 節" loading="lazy" data-autosize></iframe><figcaption>每週完整課程節數配置｜國文與英語分列各 4 節</figcaption></figure><p>替代方案之設計原則：依十二年國教總綱精神規劃；主題探索課程依各主題的學習需求，彈性安排連續課節，以利進行跨領域統整、實作與探究學習；空白課程為預留之彈性時段，學期中由行政處室統籌安排課程未涵蓋之議題宣導、專題講座等活動，並由導師視班級需求規劃相關班級活動。</p><h3 id="s6">（四）執行情形</h3><p>上述排除規定之執行，均以實驗規範所載之理由及替代方案為依據，確保學生基本學力不受影響。泰雅文化課程並非取消學生接受一般教育之機會，而是在整合文化脈絡之前提下，強化學生之學習深度、文化素養與族群認同，使民族教育與一般教育相輔相成，共同達成實驗教育之教育目標。一般學科領域課程均依課程綱要正常安排授課並辦理定期評量，相關情形詳見 <a class="mention" href="#p3-1" data-page="3-1"><span class="mi">🌿</span>3-1 課程教學、發展與落實</a>。</p><hr><div class="callout bg-gray_bg"><span class="ci" aria-hidden="true">ℹ️</span><div class="cb"><p>本指標以實驗規範核定文件與法規對照為主要佐證方式，故未設精選照片。</p></div></div><hr><h2 id="s7">三、佐證資料清單</h2><div class="drive"><div class="dh"><span class="dico" aria-hidden="true">📁</span><b>佐證資料夾（Google 雲端硬碟）</b><a href="https://drive.google.com/drive/folders/1UcNYNDb7LQcw6ZckxlXwmeQF8-Y6LFXZ?usp=sharing" target="_blank" rel="noopener">在新分頁開啟 ↗</a></div><iframe src="https://drive.google.com/embeddedfolderview?id=1UcNYNDb7LQcw6ZckxlXwmeQF8-Y6LFXZ#list" title="佐證資料夾" loading="lazy"></iframe></div>',toc:[{id:"s1",t:"一、指標原文"},{id:"s2",t:"二、學校現況說明"},{id:"s7",t:"三、佐證資料清單"}]},"5-3":{html:'<h2 id="s1">一、指標原文</h2><blockquote>國防教育、交通安全、閱讀推動、家庭教育、環境教育及特教評鑑（無特教班則免）實施情形</blockquote><hr><h2 id="s2">二、學校現況說明</h2><h3 id="s3">（一）國防教育</h3><ol><li>採議題融入式教學，將國防軍事、全民防衛等概念融入現行教學活動。</li><li>結合體育課程與山野教育，規劃體能強化訓練，並透過戶外紮營、野炊、搭帳篷等實作活動，於真實情境中培養學生體魄與團隊韌性；另辦理「走回家的路」徒步活動，結合部落路徑認識與體能鍛鍊。</li><li>每學期配合相關單位辦理緊急事件演練及安全防護活動，並辦理防災演練與消防防災講座，強化學生防衛知能。</li></ol><h3 id="s4">（二）交通安全</h3><ol><li>設有交通安全教育推動小組並訂定實施計畫，由校長擔任主任委員，統籌學校交通安全相關事務，定期召開委員會議進行規劃、檢討與改進。</li><li>每學年定期辦理交通安全教育宣導，並透過課程教學、升旗宣導、與學校活動結合及值周巡查等方式落實。</li><li>因應學生多搭乘公車往返山區部落之特殊情況，加強山區道路安全教育。</li><li>114 學年度以「路跑賽暨交通安全教育」、開學校園安全週、週會宣導等多元方式辦理；並辦理教職員交通安全知能研習（「打造安全校園的第一步」、「科技導入交通安全教育」）。</li><li>校內建置交通標誌情境與「安心走廊」，並與周邊商家簽訂「愛心服務站」，協力守護學生通學安全。</li><li>114 學年度已依縣府規定完成交通安全評鑑自評作業，自評表依十項向度逐項檢附佐證。</li></ol><h3 id="s5">（三）閱讀推動</h3><ol><li>推動晨間閱讀活動，由導師帶領學生至圖書館自主閱讀。</li><li>連續三年（112 至 114 學年度）學生獲選宜蘭縣「世界閱讀日—閱讀達人」。</li><li>持續爭取「充實圖書館藏書量」「充實英語教學圖書」「新生閱讀推廣（閱讀起步走）」等計畫充實館藏。</li><li>辦理好讀週報閱讀回饋，並以品學堂閱讀素養線上評測檢視學生閱讀理解成效。</li><li>圖書教師參與全國圖書教師磨課師研習精進專業知能。</li></ol><h3 id="s6">（四）家庭教育</h3><ol><li>依規推動每年四小時家庭教育課程，透過週會、主題講座及學科融入等多元方式辦理，並逐學期編製親職教育手冊。</li><li>gaga 課程融入泰雅族家庭倫理與責任觀念，深化學生對家庭關係之文化認同。</li><li>定期辦理親師座談及專題講座，並視需要提供線上輔導資源，強化家校合作。</li><li>辦理教師家庭教育專業知能研習，提升教師教學能量。</li></ol><h3 id="s7">（五）環境教育</h3><ol><li>每年訂定環境教育實施計畫，設置環境教育推動小組，辦理空氣品質教育活動並定期維護校園環境衛生。</li><li>泰雅文化課程「燒墾生活」與「山林智慧」單元融入傳統生態知識，引導學生認識山林環境、理解人與自然共生的泰雅智慧。</li><li>逐年（112 至 115 年度）完成學校環境教育自評檢核並訂定節能減碳計畫，持續推動校園綠化美化與環境衛生管理。</li><li>參與「臺美生態學校」認證並辦理環境教育成果發表。</li></ol><h3 id="s8">（六）特殊教育</h3><p>本校目前無特殊教育班，依規免辦特教評鑑。</p><hr><h2 id="s9">三、五項訪評項目辦理概覽</h2><figure class="img"><button type="button" class="ph" data-full="img/full/03a44731ca.png" data-cap="" aria-label="放大照片："><img src="img/full/03a44731ca.png" alt="" loading="lazy" width="1440" height="900"></button></figure><hr><h2 id="s10">四、精選照片</h2><div class="gallery" style="--cols:3"><figure><button type="button" class="ph" data-full="img/full/03b8744cfa.jpg" data-cap="國防教育結合山野教育" aria-label="放大照片：國防教育結合山野教育"><img src="img/thumb/03b8744cfa.jpg" alt="國防教育結合山野教育" loading="lazy" width="1600" height="1200"></button><figcaption>國防教育結合山野教育</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/443cfd6390.jpg" data-cap="防災演練，學生依指令於教室內就地掩護" aria-label="放大照片：防災演練，學生依指令於教室內就地掩護"><img src="img/thumb/443cfd6390.jpg" alt="防災演練，學生依指令於教室內就地掩護" loading="lazy" width="1477" height="1108"></button><figcaption>防災演練，學生依指令於教室內就地掩護</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/4dce9b316b.jpg" data-cap="全校路跑賽暨推動交通安全教育活動" aria-label="放大照片：全校路跑賽暨推動交通安全教育活動"><img src="img/thumb/4dce9b316b.jpg" alt="全校路跑賽暨推動交通安全教育活動" loading="lazy" width="1600" height="1067"></button><figcaption>全校路跑賽暨推動交通安全教育活動</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/6513992b39.jpg" data-cap="交通安全宣導活動" aria-label="放大照片：交通安全宣導活動"><img src="img/thumb/6513992b39.jpg" alt="交通安全宣導活動" loading="lazy" width="1600" height="1200"></button><figcaption>交通安全宣導活動</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/78ef992754.jpg" data-cap="學生於圖書館閱讀區自主閱讀" aria-label="放大照片：學生於圖書館閱讀區自主閱讀"><img src="img/thumb/78ef992754.jpg" alt="學生於圖書館閱讀區自主閱讀" loading="lazy" width="1477" height="1108"></button><figcaption>學生於圖書館閱讀區自主閱讀</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/e13c0cafb0.jpg" data-cap="學生於圖書館閱讀區自主閱讀" aria-label="放大照片：學生於圖書館閱讀區自主閱讀"><img src="img/thumb/e13c0cafb0.jpg" alt="學生於圖書館閱讀區自主閱讀" loading="lazy" width="1477" height="1108"></button><figcaption>學生於圖書館閱讀區自主閱讀</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/b408c64bf2.jpg" data-cap="家庭教育－南山部落親師座談" aria-label="放大照片：家庭教育－南山部落親師座談"><img src="img/thumb/b408c64bf2.jpg" alt="家庭教育－南山部落親師座談" loading="lazy" width="1600" height="1200"></button><figcaption>家庭教育－南山部落親師座談</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/ef9d14e6ac.jpg" data-cap="家庭教育－四季部落親師座談" aria-label="放大照片：家庭教育－四季部落親師座談"><img src="img/thumb/ef9d14e6ac.jpg" alt="家庭教育－四季部落親師座談" loading="lazy" width="1600" height="900"></button><figcaption>家庭教育－四季部落親師座談</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/6751313953.jpg" data-cap="家庭教育－英士部落親師座談" aria-label="放大照片：家庭教育－英士部落親師座談"><img src="img/thumb/6751313953.jpg" alt="家庭教育－英士部落親師座談" loading="lazy" width="1600" height="900"></button><figcaption>家庭教育－英士部落親師座談</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/1d9307bda9.jpg" data-cap="環境教育－淨零碳排宣導" aria-label="放大照片：環境教育－淨零碳排宣導"><img src="img/thumb/1d9307bda9.jpg" alt="環境教育－淨零碳排宣導" loading="lazy" width="1600" height="1200"></button><figcaption>環境教育－淨零碳排宣導</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/39512f4463.jpg" data-cap="環境教育－淨零碳排宣導" aria-label="放大照片：環境教育－淨零碳排宣導"><img src="img/thumb/39512f4463.jpg" alt="環境教育－淨零碳排宣導" loading="lazy" width="1600" height="1200"></button><figcaption>環境教育－淨零碳排宣導</figcaption></figure><figure><button type="button" class="ph" data-full="img/full/f5cced3f93.jpg" data-cap="環境教育－自然永續與小米採收" aria-label="放大照片：環境教育－自然永續與小米採收"><img src="img/thumb/f5cced3f93.jpg" alt="環境教育－自然永續與小米採收" loading="lazy" width="1600" height="1200"></button><figcaption>環境教育－自然永續與小米採收</figcaption></figure></div><hr><h2 id="s11">五、佐證資料清單</h2><div class="drive"><div class="dh"><span class="dico" aria-hidden="true">📁</span><b>佐證資料夾（Google 雲端硬碟）</b><a href="https://drive.google.com/drive/folders/1bUlOt-ybpoRT1hmRpDuRcwofdCxWy3Yn?usp=sharing" target="_blank" rel="noopener">在新分頁開啟 ↗</a></div><iframe src="https://drive.google.com/embeddedfolderview?id=1bUlOt-ybpoRT1hmRpDuRcwofdCxWy3Yn#list" title="佐證資料夾" loading="lazy"></iframe></div>',toc:[{id:"s1",t:"一、指標原文"},{id:"s2",t:"二、學校現況說明"},{id:"s9",t:"三、五項訪評項目辦理概覽"},{id:"s10",t:"四、精選照片"},{id:"s11",t:"五、佐證資料清單"}]},"6-1":{html:`<h2 id="s1">一、指標原文</h2><blockquote>學校與部落互動、家長參與學校事務</blockquote><hr><h2 id="s2">二、學校現況說明</h2><p>本校與大同鄉各部落長期維持深厚且具體之合作關係，並持續強化家長參與學校事務之管道與深度。</p><h3 id="s3">（一）耆老協同教學：學校與部落之常態合作機制</h3><p>文化課程以聘請在地部落耆老擔任協同教師為核心機制，與文化教師共備共授，學生學習場域亦延伸至部落，落實學校與部落共同推動民族文化教育。本校每學年度編製耆老授課課程主題對照表，明列各單元之協同耆老與授課主題。</p><div class="tablewrap"><table class=""><tr><th scope="col">學年度</th><th scope="col">外聘耆老協同課程節數</th></tr><tr><td>112</td><td>453 節</td></tr><tr><td>113</td><td>418 節</td></tr><tr><td>114</td><td>291 節</td></tr></table></div><p>家長及耆老對學校文化教育方向高度認同。（耆老名單與授課單元對照詳見 <a class="mention" href="#p2-3" data-page="2-3"><span class="mi">👩‍🏫</span>2-3 師資結構與教學增能</a>）</p><p><b>115 學年度之因應</b>：外聘耆老協同節數之逐年調整，主要反映實驗教育計畫經費核定數之變動，以及文化教師經專業增能後逐步承接部分單元之教學。為維持耆老參與的深度，而非僅以授課節數衡量，115 學年度已採行：（1）節數配置優先化——將耆老協同節數集中於須由耆老親授之關鍵單元（如傳統地機編織、藤製器具、祭儀）；（2）協同型態調整——部分單元改由文化教師主授、耆老以示範或成果驗收方式參與。</p><h3 id="s4">（二）學生走入部落：以文化能力回饋社區</h3><p>學校與部落之互動並非單向。114 學年度下學期，本校學生前往英士部落文化健康站，由學生擔任教學者，帶領站內長輩共同製作藤環鑰匙圈。</p><p>在文化課程的常態情境中，耆老是傳授者、學生是學習者；此次活動則使這一關係暫時反轉——學生把從耆老身上學到的技藝，帶回部落、交到長輩手中。對學生而言，能夠教會長輩，是文化學習成果最直接的檢驗；對部落而言，則具體看見學校所培育的下一代確實承接了族群技藝。</p><div class="callout bg-gray_bg"><span class="ci" aria-hidden="true">ℹ️</span><div class="cb"><p>本校文化課程之藤編技法分見於七年級「藤製生活器具（takil）」與九年級「藤製生活器具（qbubu／gonyu）」單元，學生於課程中由耆老指導習得選藤與編製工法。此次至文健站之教學，即以上述課程所學為基礎。</p></div></div><h3 id="s5">（三）sbalay 傳統和解儀式：以 gaga 修復公共關係</h3><p>113 學年度，本校配合大同鄉公所「守月文化復振及推廣微電影」計畫，提供校園文化場景作為拍攝場地。拍攝期間因溝通疏失造成校園文化場域（包含珍貴苧麻園）受損，引發校方強烈回應。本校並未循一般行政申訴程序處理，而是回到泰雅族的傳統規範尋求解決。</p><div class="tablewrap"><table class=""><tr><th scope="col">時間</th><th scope="col">處理歷程</th></tr><tr><td>113 年 9 月 18 日</td><td>三方溝通會議中，本校率先提出「應循泰雅族 gaga 精神，以 sbalay 方式解決」</td></tr><tr><td>113 年 9 月 20 日</td><td>公所採納此建議，正式來函道歉，並承諾遵照傳統以 sbalay 儀式親赴本校致歉</td></tr><tr><td>113 年 9 月 27 日</td><td>由樂水部落簡連一耆老主持、葉儒亮耆老見證，本校與公所、拍攝廠商三方依傳統儀式流程完成 sbalay</td></tr></table></div><p>sbalay 儀式依傳統流程進行，包含 pnuhu'（生火）、lmuhuw（傳統吟唱）、mphaw ru msbalay（雙方陳述求和）、lmuhuw ru pmumu ke（耆老祈告祖靈）、sblayan（埋石立約）與 msqun mhgop sblayan（共飲見證）。</p><p>此次 sbalay 並非文化展演，而是在真實公共爭議中啟動傳統規範之實際運作。本校在事件中所扮演之角色不只是受害方，更是引導各方回歸泰雅 gaga 精神的主體，具體落實「學校即部落」之辦學理念。（此一機制之創新意義與省思詳見 <a class="mention" href="#p6-3" data-page="6-3"><span class="mi">💡</span>6-3 學校辦理民族教育之創新與省思</a>）</p><h3 id="s6">（四）村校聯運暨部落宣傳</h3><p>本校積極參與南山、四季村校聯運、大同鄉鄉運等活動，主動走入各部落設置實驗教育宣傳攤位，展示學生文化作品、播放學校影片並辦理互動活動。</p><div class="tablewrap"><table class=""><tr><th scope="col">調查項目</th><th scope="col">結果</th></tr><tr><td>有效問卷</td><td>98 份</td></tr><tr><td>受訪者組成</td><td>部落居民 66.3％、家長 24.5％</td></tr><tr><td>認同學校推動文化課程之方向</td><td>96.9％</td></tr><tr><td>表示對實驗教育之理解有所提升</td><td>92.9％</td></tr><tr><td>過去從未聽說學校推動實驗教育</td><td>9 人（9.2％），透過本次活動首次建立連結</td></tr></table></div><p class="c-gray"><i>（對外推廣之辦學成果 DM、校慶展架、畢業典禮邀請函等文宣設計實例，另見 </i><i><a class="mention" href="#p3-1" data-page="3-1"><span class="mi">🌿</span>3-1 課程教學、發展與落實</a></i><i> 駐校助理協作紀錄之文宣設計）</i></p><h3 id="s7">（五）學區招生宣導</h3><p>每學年於學區各國小辦理招生宣傳說明，113 學年度共 5 場次、114 學年度共 7 場次，觸及更多來自大同鄉的學生與家長。（場次與宣導學校詳見 <a class="mention" href="#p2-2" data-page="2-2"><span class="mi">🎓</span>2-2 學生入學與就學情形</a>）</p><h3 id="s8">（六）家長參與學校事務</h3><div class="tablewrap"><table class=""><tr><th scope="col">參與型態</th><th scope="col">辦理情形</th></tr><tr><td>親職座談</td><td>每學期辦理，透過實驗教育理念與課程成果之分享與討論，增進親師互動；近年家長出席率逐步提升，並普遍給予正向回饋</td></tr><tr><td>文化成果展暨校園活動</td><td>每學年結合校慶辦理文化課程教學成果展，並邀請家長參與校慶、畢業典禮、運動會等重要校園活動</td></tr><tr><td>家長協力文化課程</td><td>部分單元引導學生訪問家長或請家長協助備材，使家長由旁觀者逐漸轉化為參與者，乃至協同教學的支持者</td></tr><tr><td>親職教育計畫</td><td>112～114 學年度均依教育優先區親職教育計畫辦理，並提出推動成果報告</td></tr></table></div><hr><h2 id="s9">三、村校聯運宣傳活動問卷統計（互動圖表）</h2><figure class="embed"><iframe src="https://bacon-sys.github.io/115-eval-sports/6-1.html" title="村校聯運宣傳攤位問卷統計（有效問卷 98 份）" loading="lazy" allowfullscreen></iframe><figcaption>村校聯運宣傳攤位問卷統計（有效問卷 98 份）　<a href="https://bacon-sys.github.io/115-eval-sports/6-1.html" target="_blank" rel="noopener">在新分頁開啟 ↗</a></figcaption></figure><p class="c-gray"><i>圖表右上可切換「認同度」與「受訪者組成」；點選右下「開啟完整版報告」可見各題逐項統計與綜合評估。</i></p><hr><h2 id="s10">四、精選照片</h2><div class="gallery" style="--cols:3"><figure><button type="button" class="ph" data-full="img/full/1e0b34c53d.jpg" data-cap="學生至英士文健站教導長輩製作藤環鑰匙圈（1）" aria-label="放大照片：學生至英士文健站教導長輩製作藤環鑰匙圈（1）"><im
