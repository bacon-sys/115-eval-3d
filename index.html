互動網頁）","互動網頁｜檢視符合實驗教育精神之補充說明"],["5-1","s3","三、依法規逐項自我檢視（互動網頁）","依《學校型態實驗教育實施條例》逐條列示法規依據與本校辦學情形之完整對照。"],["5-1","s3","三、依法規逐項自我檢視（互動網頁）","在新分頁開啟完整說明 ↗"],["5-1","s3","三、依法規逐項自我檢視（互動網頁）","下方五個項目為完整網頁之文字版，並加上對應指標頁面之連結，可直接於本頁展開閱讀。"],["5-1","s3","三、依法規逐項自我檢視（互動網頁）","項目一 教育理念及計畫特色（條例第 1 條、第 3 條第 1 項）"],["5-1","s3","三、依法規逐項自我檢視（互動網頁）","法規依據"],["5-1","s3","三、依法規逐項自我檢視（互動網頁）","第 1 條 為鼓勵教育創新，實施學校型態實驗教育，以保障人民學習及受教育權利，增加人民選擇教育方式與內容之機會，促進教育多元化發展。"],["5-1","s3","三、依法規逐項自我檢視（互動網頁）","第 3 條第 1 項 學校型態實驗教育，指依據特定教育理念，以學校為範圍，從事教育理念之實踐，並就學校制度、行政運作、組織型態、設備設施、校長資格與產生方式、教職員工之資格與進用方式、課程教學、學生入學、學習成就評量、學生事務及輔導、社區及家長參與等事項，進行整合性實驗之教育。"],["5-1","s3","三、依法規逐項自我檢視（互動網頁）","本校說明"],["5-1","s3","三、依法規逐項自我檢視（互動網頁）","以「Tayal balay（真正的泰雅人）」為特定教育理念，以泰雅 gaga 為核心精神，聚焦愛土地、負責、合作、感恩四項核心特質，透過七至九年級三階段主題文化課程實踐教育理念。"],["5-1","s3","三、依法規逐項自我檢視（互動網頁）","本校實驗教育屬整合性教育實驗，就課程教學、學習成就評量、行政運作與組織型態、學生入學、學生事務及輔導、社區及家長參與等事項整體推動，並將歲時祭儀融入校園生活，與僅就個別項目進行之教育實驗不同。"],["5-1","s3","三、依法規逐項自我檢視（互動網頁）","採大學區（自由學區）制，打破既有學區界線，設籍宜蘭縣之學生皆可申請入學，滿足家長教育選擇權。"],["5-1","s3","三、依法規逐項自我檢視（互動網頁）","對應指標：🌱1-1 民族教育理念之落實與實施情形、📋1-2 與計畫書符合情形、🎓2-2 學生入學與就學情形、💡6-3 學校辦理民族教育之創新與省思"],["5-1","s3","三、依法規逐項自我檢視（互動網頁）","項目二 課程及教學規劃、學習成就評量（條例第 3 條第 2 項）"],["5-1","s3","三、依法規逐項自我檢視（互動網頁）","法規依據"],["5-1","s3","三、依法規逐項自我檢視（互動網頁）","第 3 條第 2 項 特定教育理念之實踐，應以學生為中心，尊重學生之多元文化、信仰及多元智能，課程、教學、教材、教法或評量之規劃，並以引導學生適性學習及促進多元教育發展為目標。"],["5-1","s3","三、依法規逐項自我檢視（互動網頁）","本校說明"],["5-1","s3","三、依法規逐項自我檢視（互動網頁）","課程採雙文化模式：每週泰雅文化課程 9 節、族語課程 1 節，以族語為主要教學語言；由文化教師、部落耆老與各領域教師協同教學，教學活動依部落歲時生活時序安排，強調實地體驗學習。"],["5-1","s3","三、依法規逐項自我檢視（互動網頁）","課程與教學以學生為中心，尊重學生之多元文化與多元智能，並注意學生特性與傳統文化學習之關聯，提供適性學習機會。"],["5-1","s3","三、依法規逐項自我檢視（互動網頁）","學習成就評量採多元模式：紙筆測驗、學習紀錄本、課堂形成性評量、分組合作學習、自然實境體驗，以及部落歲時活動參與之觀察與訪談等，兼顧認知、技能與情意。"],["5-1","s3","三、依法規逐項自我檢視（互動網頁）","對應指標：🌿3-1 課程教學、發展與落實、🧭3-2 學生多元學習與適性發展、📝3-3 學習成就多元評量、🪶3-4 學生民族文化認知與認同"],["5-1","s3","三、依法規逐項自我檢視（互動網頁）","項目三 學生入學、學生事務及輔導（條例第 6 條第 1 項）"],["5-1","s3","三、依法規逐項自我檢視（互動網頁）","法規依據"],["5-1","s3","三、依法規逐項自我檢視（互動網頁）","第 6 條第 1 項 學校型態實驗教育應維護學生基本人權，積極營造友善校園之教育環境，並遵守下列事項：實驗教育之實施應事前徵得學生本人及其法定代理人之同意或事先載明於招生簡章中；接受退出實驗教育之申請，不得以任何理由拒絕；學生不適應實驗教育並提出轉學需求時，學校應予以協助；無正當理由，不得於招生或教育過程中，使學生受差別待遇等。"],["5-1","s3","三、依法規逐項自我檢視（互動網頁）","本校說明"],["5-1","s3","三、依法規逐項自我檢視（互動網頁）","招生依公告之優先序位原則辦理，無入學限制，亦無差別待遇；學生或其家庭長期無法適應、配合時，得隨時主動提出轉學申請，學校並予以協助。"],["5-1","s3","三、依法規逐項自我檢視（互動網頁）","學生事務及輔導以學生為中心，維護學生基本人權，營造友善校園環境，協助學生提升文化認同、發展熱愛生命與族群認同之情操。"],["5-1","s3","三、依法規逐項自我檢視（互動網頁）","對應指標：🎓2-2 學生入學與就學情形、🧭3-2 學生多元學習與適性發展"],["5-1","s3","三、依法規逐項自我檢視（互動網頁）","項目四 行政運作、組織型態、設備設施（條例第 23 條第 4 項、第 7 項）"],["5-1","s3","三、依法規逐項自我檢視（互動網頁）","法規依據"],["5-1","s3","三、依法規逐項自我檢視（互動網頁）","第 23 條第 4 項 公立學校辦理學校型態實驗教育，應擬訂實驗規範，報學校主管機關核轉中央主管機關核定；於實驗規範之範圍內，得不適用國民教育法、高級中等教育法、特殊教育法、師資培育法、學生輔導法、國民體育法及其相關法規之部分規定，並應載明其不適用之相關規定。"],["5-1","s3","三、依法規逐項自我檢視（互動網頁）","第 23 條第 7 項 公立學校辦理學校型態實驗教育，得依相關法規規定以契約方式進用編制外之教職員。"],["5-1","s3","三、依法規逐項自我檢視（互動網頁）","本校說明"],["5-1","s3","三、依法規逐項自我檢視（互動網頁）","本校實驗規範業經教育部 107 年 12 月 3 日臺教授國部字第 1070146647 號函核定，排除範圍以課程教學為限，並以泰雅族本位課程架構替代。"],["5-1","s3","三、依法規逐項自我檢視（互動網頁）","行政運作、組織型態、設備設施等其餘事項皆無特定排除，仍依相關法規推行校務；課程計畫每學年度經實驗教育課程計畫審查小組審查後送教育處備查。"],["5-1","s3","三、依法規逐項自我檢視（互動網頁）","為強化實驗課程研發能量，111 學年度起於教務處下增設「課程研究組」，並依條例第 23 條第 7 項以契約方式進用文化教師、文化指導員及行政助理等編制外人力。"],["5-1","s3","三、依法規逐項自我檢視（互動網頁）","對應指標：🏘️2-1 學習環境與設備資源、👩‍🏫2-3 師資結構與教學增能、📊4-1 經費運用情形、🔍5-2 符合實驗規範排除規定、🗂️5-3 縣訂訪評項目實施情形"],["5-1","s3","三、依法規逐項自我檢視（互動網頁）","項目五 社區及家長參與（條例第 3 條第 1 項、第 26 條第 2 項）"],["5-1","s3","三、依法規逐項自我檢視（互動網頁）","法規依據"],["5-1","s3","三、依法規逐項自我檢視（互動網頁）","第 26 條第 2 項 實驗教育得與在地社區或組織合作，結合地方產業、地方創生活化教學，並得聘請業界專家協助教學。"],["5-1","s3","三、依法規逐項自我檢視（互動網頁）","本校說明"],["5-1","s3","三、依法規逐項自我檢視（互動網頁）","聘請部落耆老、牧師、族語教師等擔任文化課程協同師資，並以學區各部落、傳統領域獵場及小米園區等為教學場域，結合部落資源實施課程。"],["5-1","s3","三、依法規逐項自我檢視（互動網頁）","配合泰雅傳統歲時舉辦各項祭儀，學生實際參與部落歲時生活；並透過家長面談、說明與溝通，促進家長參與學校事務，深化學校與部落之夥伴關係。"],["5-1","s3","三、依法規逐項自我檢視（互動網頁）","對應指標：🏘️6-1 部落互動與家長參與情形、🌾6-2 學生學習部落歲時生活情形、🌱1-1 民族教育理念之落實與實施情形"],["5-1","s4","四、外部檢核與備查機制","四、外部檢核與備查機制"],["5-1","s4","四、外部檢核與備查機制","外部檢核與備查機制｜四階段持續精進流程"],["5-1","s4","四、外部檢核與備查機制","本指標以法規檢視與核定文件為主要佐證方式，故未設精選照片。"],["5-1","s5","五、佐證資料清單","五、佐證資料清單"],["5-2","s1","一、指標原文","一、指標原文"],["5-2","s1","一、指標原文","實驗規範排除法規與執行"],["5-2","s2","二、學校現況說明","二、學校現況說明"],["5-2","s3","（一）實驗規範之核定","（一）實驗規範之核定"],["5-2","s3","（一）實驗規範之核定","本校「107–118 學年度宜蘭縣立大同國民中學學校型態實驗教育規範」業經教育部 107 年 12 月 3 日臺教授國部字第 1070146647 號函核定（變更核定版）。縣府並於 107 年 9 月 3 日核定 107 學年度總計畫。"],["5-2","s3","（一）實驗規範之核定","依實驗規範所載，本校排除範圍以課程教學為限，行政運作、組織型態、設備設施、師資進用等其餘事項均無特定排除，仍依相關法規推行校務。"],["5-2","s4","（二）排除之法規、替代方案與說明","（二）排除之法規、替代方案與說明"],["5-2","s4","（二）排除之法規、替代方案與說明","實驗範圍 不適用法規 替代方案"],["5-2","s4","（二）排除之法規、替代方案與說明","課程教學 《國民教育法》有關中央主管機關訂定國民中小學課程綱要及其實施規定之條文；《十二年國民基本教育課程綱要》陸、課程架構及柒、實施要點 發展泰雅族本位之課程架構，以取代現行課程綱要，並於實驗教育計畫「課程及教學規劃」項下明定各領域節數配置"],["5-2","s4","（二）排除之法規、替代方案與說明","課程教學 依《國民教育法》授權訂定之課程綱要實施要點中，有關學校課程計畫應含各領域課程計畫及彈性學習節數課程計畫，並載明學年／學期學習目標、能力指標、對應能力指標之單元名稱、節數、評量方式等項目之規定 基本學力課程配合選用教科書與自編部分教材，進行動態單元文化回應教學；文化課程依年級設計主題課並統整教學。課程計畫由學校依自訂格式編寫，於學年度開學前經校內外審查小組審查後送教育處備查"],["5-2","s4","（二）排除之法規、替代方案與說明","條次變更說明"],["5-2","s4","（二）排除之法規、替代方案與說明","本校實驗規範係依當年度有效之《國民教育法》申請並經核定，其中課程架構部分所引《國民教育法》第 8 條，係當時規範中央主管機關訂定課程綱要之依據條文。《國民教育法》嗣於 112 年 6 月 21 日華總一義字第 11200052771 號令修正公布，全文分章重新編排，原第 8 條有關課程綱要之規定移列至第七章「課程、教學及學習評量」第 34 條，規範內容與文字並無實質變更。爰此，本實驗規範原文引用之「第 8 條」，對應現行法之「第 34 條」；規範內容維持核定原貌。"],["5-2","s5","（三）替代之課程架構與節數配置","（三）替代之課程架構與節數配置"],["5-2","s5","（三）替代之課程架構與節數配置","本校依實驗規範所定替代方案，每週各領域節數配置如下："],["5-2","s5","（三）替代之課程架構與節數配置","每週完整課程節數配置｜國文與英語分列各 4 節"],["5-2","s5","（三）替代之課程架構與節數配置","替代方案之設計原則：依十二年國教總綱精神規劃；主題探索課程依各主題的學習需求，彈性安排連續課節，以利進行跨領域統整、實作與探究學習；空白課程為預留之彈性時段，學期中由行政處室統籌安排課程未涵蓋之議題宣導、專題講座等活動，並由導師視班級需求規劃相關班級活動。"],["5-2","s6","（四）執行情形","（四）執行情形"],["5-2","s6","（四）執行情形","上述排除規定之執行，均以實驗規範所載之理由及替代方案為依據，確保學生基本學力不受影響。泰雅文化課程並非取消學生接受一般教育之機會，而是在整合文化脈絡之前提下，強化學生之學習深度、文化素養與族群認同，使民族教育與一般教育相輔相成，共同達成實驗教育之教育目標。一般學科領域課程均依課程綱要正常安排授課並辦理定期評量，相關情形詳見 🌿3-1 課程教學、發展與落實。"],["5-2","s6","（四）執行情形","本指標以實驗規範核定文件與法規對照為主要佐證方式，故未設精選照片。"],["5-2","s7","三、佐證資料清單","三、佐證資料清單"],["5-3","s1","一、指標原文","一、指標原文"],["5-3","s1","一、指標原文","國防教育、交通安全、閱讀推動、家庭教育、環境教育及特教評鑑（無特教班則免）實施情形"],["5-3","s2","二、學校現況說明","二、學校現況說明"],["5-3","s3","（一）國防教育","（一）國防教育"],["5-3","s3","（一）國防教育","採議題融入式教學，將國防軍事、全民防衛等概念融入現行教學活動。"],["5-3","s3","（一）國防教育","結合體育課程與山野教育，規劃體能強化訓練，並透過戶外紮營、野炊、搭帳篷等實作活動，於真實情境中培養學生體魄與團隊韌性；另辦理「走回家的路」徒步活動，結合部落路徑認識與體能鍛鍊。"],["5-3","s3","（一）國防教育","每學期配合相關單位辦理緊急事件演練及安全防護活動，並辦理防災演練與消防防災講座，強化學生防衛知能。"],["5-3","s4","（二）交通安全","（二）交通安全"],["5-3","s4","（二）交通安全","設有交通安全教育推動小組並訂定實施計畫，由校長擔任主任委員，統籌學校交通安全相關事務，定期召開委員會議進行規劃、檢討與改進。"],["5-3","s4","（二）交通安全","每學年定期辦理交通安全教育宣導，並透過課程教學、升旗宣導、與學校活動結合及值周巡查等方式落實。"],["5-3","s4","（二）交通安全","因應學生多搭乘公車往返山區部落之特殊情況，加強山區道路安全教育。"],["5-3","s4","（二）交通安全","114 學年度以「路跑賽暨交通安全教育」、開學校園安全週、週會宣導等多元方式辦理；並辦理教職員交通安全知能研習（「打造安全校園的第一步」、「科技導入交通安全教育」）。"],["5-3","s4","（二）交通安全","校內建置交通標誌情境與「安心走廊」，並與周邊商家簽訂「愛心服務站」，協力守護學生通學安全。"],["5-3","s4","（二）交通安全","114 學年度已依縣府規定完成交通安全評鑑自評作業，自評表依十項向度逐項檢附佐證。"],["5-3","s5","（三）閱讀推動","（三）閱讀推動"],["5-3","s5","（三）閱讀推動","推動晨間閱讀活動，由導師帶領學生至圖書館自主閱讀。"],["5-3","s5","（三）閱讀推動","連續三年（112 至 114 學年度）學生獲選宜蘭縣「世界閱讀日—閱讀達人」。"],["5-3","s5","（三）閱讀推動","持續爭取「充實圖書館藏書量」「充實英語教學圖書」「新生閱讀推廣（閱讀起步走）」等計畫充實館藏。"],["5-3","s5","（三）閱讀推動","辦理好讀週報閱讀回饋，並以品學堂閱讀素養線上評測檢視學生閱讀理解成效。"],["5-3","s5","（三）閱讀推動","圖書教師參與全國圖書教師磨課師研習精進專業知能。"],["5-3","s6","（四）家庭教育","（四）家庭教育"],["5-3","s6","（四）家庭教育","依規推動每年四小時家庭教育課程，透過週會、主題講座及學科融入等多元方式辦理，並逐學期編製親職教育手冊。"],["5-3","s6","（四）家庭教育","gaga 課程融入泰雅族家庭倫理與責任觀念，深化學生對家庭關係之文化認同。"],["5-3","s6","（四）家庭教育","定期辦理親師座談及專題講座，並視需要提供線上輔導資源，強化家校合作。"],["5-3","s6","（四）家庭教育","辦理教師家庭教育專業知能研習，提升教師教學能量。"],["5-3","s7","（五）環境教育","（五）環境教育"],["5-3","s7","（五）環境教育","每年訂定環境教育實施計畫，設置環境教育推動小組，辦理空氣品質教育活動並定期維護校園環境衛生。"],["5-3","s7","（五）環境教育","泰雅文化課程「燒墾生活」與「山林智慧」單元融入傳統生態知識，引導學生認識山林環境、理解人與自然共生的泰雅智慧。"],["5-3","s7","（五）環境教育","逐年（112 至 115 年度）完成學校環境教育自評檢核並訂定節能減碳計畫，持續推動校園綠化美化與環境衛生管理。"],["5-3","s7","（五）環境教育","參與「臺美生態學校」認證並辦理環境教育成果發表。"],["5-3","s8","（六）特殊教育","（六）特殊教育"],["5-3","s8","（六）特殊教育","本校目前無特殊教育班，依規免辦特教評鑑。"],["5-3","s9","三、五項訪評項目辦理概覽","三、五項訪評項目辦理概覽"],["5-3","s10","四、精選照片","四、精選照片"],["5-3","s10","四、精選照片","國防教育結合山野教育"],["5-3","s10","四、精選照片","防災演練，學生依指令於教室內就地掩護"],["5-3","s10","四、精選照片","全校路跑賽暨推動交通安全教育活動"],["5-3","s10","四、精選照片","交通安全宣導活動"],["5-3","s10","四、精選照片","學生於圖書館閱讀區自主閱讀"],["5-3","s10","四、精選照片","學生於圖書館閱讀區自主閱讀"],["5-3","s10","四、精選照片","家庭教育－南山部落親師座談"],["5-3","s10","四、精選照片","家庭教育－四季部落親師座談"],["5-3","s10","四、精選照片","家庭教育－英士部落親師座談"],["5-3","s10","四、精選照片","環境教育－淨零碳排宣導"],["5-3","s10","四、精選照片","環境教育－淨零碳排宣導"],["5-3","s10","四、精選照片","環境教育－自然永續與小米採收"],["5-3","s11","五、佐證資料清單","五、佐證資料清單"],["6-1","s1","一、指標原文","一、指標原文"],["6-1","s1","一、指標原文","學校與部落互動、家長參與學校事務"],["6-1","s2","二、學校現況說明","二、學校現況說明"],["6-1","s2","二、學校現況說明","本校與大同鄉各部落長期維持深厚且具體之合作關係，並持續強化家長參與學校事務之管道與深度。"],["6-1","s3","（一）耆老協同教學：學校與部落之常態合作機制","（一）耆老協同教學：學校與部落之常態合作機制"],["6-1","s3","（一）耆老協同教學：學校與部落之常態合作機制","文化課程以聘請在地部落耆老擔任協同教師為核心機制，與文化教師共備共授，學生學習場域亦延伸至部落，落實學校與部落共同推動民族文化教育。本校每學年度編製耆老授課課程主題對照表，明列各單元之協同耆老與授課主題。"],["6-1","s3","（一）耆老協同教學：學校與部落之常態合作機制","學年度 外聘耆老協同課程節數"],["6-1","s3","（一）耆老協同教學：學校與部落之常態合作機制","112 453 節"],["6-1","s3","（一）耆老協同教學：學校與部落之常態合作機制","113 418 節"],["6-1","s3","（一）耆老協同教學：學校與部落之常態合作機制","114 291 節"],["6-1","s3","（一）耆老協同教學：學校與部落之常態合作機制","家長及耆老對學校文化教育方向高度認同。（耆老名單與授課單元對照詳見 👩‍🏫2-3 師資結構與教學增能）"],["6-1","s3","（一）耆老協同教學：學校與部落之常態合作機制","115 學年度之因應：外聘耆老協同節數之逐年調整，主要反映實驗教育計畫經費核定數之變動，以及文化教師經專業增能後逐步承接部分單元之教學。為維持耆老參與的深度，而非僅以授課節數衡量，115 學年度已採行：（1）節數配置優先化——將耆老協同節數集中於須由耆老親授之關鍵單元（如傳統地機編織、藤製器具、祭儀）；（2）協同型態調整——部分單元改由文化教師主授、耆老以示範或成果驗收方式參與。"],["6-1","s4","（二）學生走入部落：以文化能力回饋社區","（二）學生走入部落：以文化能力回饋社區"],["6-1","s4","（二）學生走入部落：以文化能力回饋社區","學校與部落之互動並非單向。114 學年度下學期，本校學生前往英士部落文化健康站，由學生擔任教學者，帶領站內長輩共同製作藤環鑰匙圈。"],["6-1","s4","（二）學生走入部落：以文化能力回饋社區","在文化課程的常態情境中，耆老是傳授者、學生是學習者；此次活動則使這一關係暫時反轉——學生把從耆老身上學到的技藝，帶回部落、交到長輩手中。對學生而言，能夠教會長輩，是文化學習成果最直接的檢驗；對部落而言，則具體看見學校所培育的下一代確實承接了族群技藝。"],["6-1","s4","（二）學生走入部落：以文化能力回饋社區","本校文化課程之藤編技法分見於七年級「藤製生活器具（takil）」與九年級「藤製生活器具（qbubu／gonyu）」單元，學生於課程中由耆老指導習得選藤與編製工法。此次至文健站之教學，即以上述課程所學為基礎。"],["6-1","s5","（三）sbalay 傳統和解儀式：以 gaga 修復公共關係","（三）sbalay 傳統和解儀式：以 gaga 修復公共關係"],["6-1","s5","（三）sbalay 傳統和解儀式：以 gaga 修復公共關係","113 學年度，本校配合大同鄉公所「守月文化復振及推廣微電影」計畫，提供校園文化場景作為拍攝場地。拍攝期間因溝通疏失造成校園文化場域（包含珍貴苧麻園）受損，引發校方強烈回應。本校並未循一般行政申訴程序處理，而是回到泰雅族的傳統規範尋求解決。"],["6-1","s5","（三）sbalay 傳統和解儀式：以 gaga 修復公共關係","時間 處理歷程"],["6-1","s5","（三）sbalay 傳統和解儀式：以 gaga 修復公共關係","113 年 9 月 18 日 三方溝通會議中，本校率先提出「應循泰雅族 gaga 精神，以 sbalay 方式解決」"],["6-1","s5","（三）sbalay 傳統和解儀式：以 gaga 修復公共關係","113 年 9 月 20 日 公所採納此建議，正式來函道歉，並承諾遵照傳統以 sbalay 儀式親赴本校致歉"],["6-1","s5","（三）sbalay 傳統和解儀式：以 gaga 修復公共關係","113 年 9 月 27 日 由樂水部落簡連一耆老主持、葉儒亮耆老見證，本校與公所、拍攝廠商三方依傳統儀式流程完成 sbalay"],["6-1","s5","（三）sbalay 傳統和解儀式：以 gaga 修復公共關係","sbalay 儀式依傳統流程進行，包含 pnuhu'（生火）、lmuhuw（傳統吟唱）、mphaw ru msbalay（雙方陳述求和）、lmuhuw ru pmumu ke（耆老祈告祖靈）、sblayan（埋石立約）與 msqun mhgop sblayan（共飲見證）。"],["6-1","s5","（三）sbalay 傳統和解儀式：以 gaga 修復公共關係","此次 sbalay 並非文化展演，而是在真實公共爭議中啟動傳統規範之實際運作。本校在事件中所扮演之角色不只是受害方，更是引導各方回歸泰雅 gaga 精神的主體，具體落實「學校即部落」之辦學理念。（此一機制之創新意義與省思詳見 💡6-3 學校辦理民族教育之創新與省思）"],["6-1","s6","（四）村校聯運暨部落宣傳","（四）村校聯運暨部落宣傳"],["6-1","s6","（四）村校聯運暨部落宣傳","本校積極參與南山、四季村校聯運、大同鄉鄉運等活動，主動走入各部落設置實驗教育宣傳攤位，展示學生文化作品、播放學校影片並辦理互動活動。"],["6-1","s6","（四）村校聯運暨部落宣傳","調查項目 結果"],["6-1","s6","（四）村校聯運暨部落宣傳","有效問卷 98 份"],["6-1","s6","（四）村校聯運暨部落宣傳","受訪者組成 部落居民 66.3％、家長 24.5％"],["6-1","s6","（四）村校聯運暨部落宣傳","認同學校推動文化課程之方向 96.9％"],["6-1","s6","（四）村校聯運暨部落宣傳","表示對實驗教育之理解有所提升 92.9％"],["6-1","s6","（四）村校聯運暨部落宣傳","過去從未聽說學校推動實驗教育 9 人（9.2％），透過本次活動首次建立連結"],["6-1","s6","（四）村校聯運暨部落宣傳","（對外推廣之辦學成果 DM、校慶展架、畢業典禮邀請函等文宣設計實例，另見 🌿3-1 課程教學、發展與落實 駐校助理協作紀錄之文宣設計）"],["6-1","s7","（五）學區招生宣導","（五）學區招生宣導"],["6-1","s7","（五）學區招生宣導","每學年於學區各國小辦理招生宣傳說明，113 學年度共 5 場次、114 學年度共 7 場次，觸及更多來自大同鄉的學生與家長。（場次與宣導學校詳見 🎓2-2 學生入學與就學情形）"],["6-1","s8","（六）家長參與學校事務","（六）家長參與學校事務"],["6-1","s8","（六）家長參與學校事務","參與型態 辦理情形"],["6-1","s8","（六）家長參與學校事務","親職座談 每學期辦理，透過實驗教育理念與課程成果之分享與討論，增進親師互動；近年家長出席率逐步提升，並普遍給予正向回饋"],["6-1","s8","（六）家長參與學校事務","文化成果展暨校園活動 每學年結合校慶辦理文化課程教學成果展，並邀請家長參與校慶、畢業典禮、運動會等重要校園活動"],["6-1","s8","（六）家長參與學校事務","家長協力文化課程 部分單元引導學生訪問家長或請家長協助備材，使家長由旁觀者逐漸轉化為參與者，乃至協同教學的支持者"],["6-1","s8","（六）家長參與學校事務","親職教育計畫 112～114 學年度均依教育優先區親職教育計畫辦理，並提出推動成果報告"],["6-1","s9","三、村校聯運宣傳活動問卷統計（互動圖表）","三、村校聯運宣傳活動問卷統計（互動圖表）"],["6-1","s9","三、村校聯運宣傳活動問卷統計（互動圖表）","村校聯運宣傳攤位問卷統計（有效問卷 98 份） 在新分頁開啟 ↗"],["6-1","s9","三、村校聯運宣傳活動問卷統計（互動圖表）","圖表右上可切換「認同度」與「受訪者組成」；點選右下「開啟完整版報告」可見各題逐項統計與綜合評估。"],["6-1","s10","四、精選照片","四、精選照片"],["6-1","s10","四、精選照片","學生至英士文健站教導長輩製作藤環鑰匙圈（1）"],["6-1","s10","四、精選照片","學生至英士文健站教導長輩製作藤環鑰匙圈（2）"],["6-1","s10","四、精選照片","學生至英士文健站教導長輩製作藤環鑰匙圈（3）"],["6-1","s10","四、精選照片","校慶暨泰雅文化教育成果展"],["6-1","s10","四、精選照片","校慶暨泰雅文化教育成果展"],["6-1","s10","四、精選照片","校慶暨泰雅文化教育成果展"],["6-1","s10","四、精選照片","校園卡拉 OK 比賽－家長參賽"],["6-1","s10","四、精選照片","運用村校聯運進行學校實驗教育宣傳"],["6-1","s10","四、精選照片","運用村校聯運進行學校實驗教育宣傳"],["6-1","s10","四、精選照片","家長參與親師座談（1）"],["6-1","s10","四、精選照片","家長參與親師座談（2）"],["6-1","s10","四、精選照片","家長參與親師座談（3）"],["6-1","s10","四、精選照片","sbalay 和解儀式現場：耆老吟唱"],["6-1","s10","四、精選照片","sbalay 和解儀式現場：雙方陳述求和"],["6-1","s10","四、精選照片","sbalay 和解儀式現場：班級代表一同參與"],["6-1","s10","四、精選照片","sbalay 和解儀式現場：耆老祈告祖靈"],["6-1","s10","四、精選照片","sbalay 和解儀式現場：埋石立約"],["6-1","s10","四、精選照片","文化老師向班級代表闡述事件來龍去脈"],["6-1","s11","五、佐證資料清單","五、佐證資料清單"],["6-2","s1","一、指標原文","一、指標原文"],["6-2","s1","一、指標原文","學生對於部落事務之學習"],["6-2","s2","二、學校現況說明","二、學校現況說明"],["6-2","s2","二、學校現況說明","隨著現代化的推進，傳統泰雅歲時生活之節奏已逐漸在部落中淡去，學生普遍缺乏親身體驗傳統祭儀與歲時文化之機會。本校透過文化課程之系統性設計，以小米生命週期為核心軸線，將傳統歲時生活之各項環節轉化為具體之學習體驗，使學生在三年國中生涯中完整走過泰雅族之歲時生活節奏。"],["6-2","s3","（一）歲時祭儀之完整實踐","（一）歲時祭儀之完整實踐"],["6-2","s3","（一）歲時祭儀之完整實踐","學校依循傳統 gaga 規範，每學年辦理完整之祭儀序列。"],["6-2","s3","（一）歲時祭儀之完整實踐","泰雅歲時祭儀年度循環圖"],["6-2","s3","（一）歲時祭儀之完整實踐","從守月到祭儀的完整歷程，使學生理解泰雅族歲時生活與祖靈信仰、土地倫理之間的深刻連結。各祭儀均留有籌備會議紀錄、儀式流程文件與現場紀錄。"],["6-2","s3","（一）歲時祭儀之完整實踐","守月除了包含準備祭儀之技能的學習，也具有「謹言慎行」的倫理要求。113 學年度起，本校進一步將此一倫理面向導入學生事務與輔導工作，使歲時祭儀不只是課程實作，也成為校園生活的規範依據。"],["6-2","s3","（一）歲時祭儀之完整實踐","（守月期間之學輔工作機制、文化回應宣導與全校集體省思，詳見 💡6-3 學校辦理民族教育之創新與省思 之「magu byaling 與 sbalay 之校內制度化實踐」）"],["6-2","s4","（二）課程結合歲時生活節奏","（二）課程結合歲時生活節奏"],["6-2","s4","（二）課程結合歲時生活節奏","各年段文化課程配合小米、苧麻之生長週期與山林季節之更迭，安排對應之學習單元。"],["6-2","s4","（二）課程結合歲時生活節奏","年級 對應之歲時生活面向 主要學習內容"],["6-2","s4","（二）課程結合歲時生活節奏","七年級 農耕燒墾之歲時循環 燒墾管理、植物辨識、食物製作與藤編工藝，感受泰雅人與土地共生之傳統智慧"],["6-2","s4","（二）課程結合歲時生活節奏","八年級 苧麻生長與家族分工 深入 gaga 組織與傳統信仰，學習地機編織技藝，理解家族分工與文化傳承之意義"],["6-2","s4","（二）課程結合歲時生活節奏","九年級 山林季節與狩獵漁撈時序 狩獵生態知識、傳統建築及口簧琴等學習，體現山林歲時之生活底蘊"],["6-2","s4","（二）課程結合歲時生活節奏","課程脈絡對應傳統泰雅生活節奏，使歲時文化不停留於知識層面，而能透過實作與體驗內化為學生之生命經驗。"],["6-2","s4","（二）課程結合歲時生活節奏","各單元配合歲時生活一覽圖"],["6-2","s5","（三）部落事務之參與與連結","（三）部落事務之參與與連結"],["6-2","s5","（三）部落事務之參與與連結","學生與部落之連結，透過九年級課程中之部落踏查具體落實：以部落山川與傳統領域、部落遷徙與族群關係、部落地圖繪製等單元為學習主軸，引導學生走入學區各部落，實地認識部落之歷史脈絡與土地關係。此外，部落如有辦理歲時活動，學校亦安排學生共同參與，在與部落族人之真實互動中，加深對部落生活之理解與文化認同。"],["6-2","s6","（四）Pinsbkan 尋根之旅","（四）Pinsbkan 尋根之旅"],["6-2","s6","（四）Pinsbkan 尋根之旅","完成三年泰雅民族文化課程後，九年級學生於畢業前踏上回到祖居地 Pinsbkan 之尋根之旅，沿著泰雅族之遷徙路線重新認識自身之族群歷史與文化根源。本校 112 至 114 學年度均辦理，各年度均備有籌備會議紀錄、行程表、行前通知單、學生手冊、器材清單及活動成果報告，並於行前完成場勘。"],["6-2","s6","（四）Pinsbkan 尋根之旅","Pinsbkan 尋根之旅於 114 學年度文化課程學習回饋問卷中，獲九年級過半數學生票選為最有收穫之課程；學生之感受與回饋詳見 🪶3-4 學生民族文化認知與認同。"],["6-2","s7","三、精選照片","三、精選照片"],["6-2","s7","三、精選照片","小米生長的歲時祭儀年度行事曆"],["6-2","s7","三、精選照片","守月期間之小米醃肉製作"],["6-2","s7","三、精選照片","守月期間之小米酒製作"],["6-2","s7","三、精選照片","守月期間之放置陷阱捕捉獵物"],["6-2","s7","三、精選照片","小米播種祭（Smgatu），師生於清晨在傳統家屋內"],["6-2","s7","三、精選照片","學生至小米田進行小米播種"],["6-2","s7","三、精選照片","小米收割日，師生於校園小米田旁"],["6-2","s7","三、精選照片","九年級四季部落踏查"],["6-2","s7","三、精選照片","九年級 Pinsbkan 尋根之旅"],["6-2","s8","四、佐證資料清單","四、佐證資料清單"],["6-3","s1","一、指標原文","一、指標原文"],["6-3","s1","一、指標原文","請學校提供亮點活動說明及省思過程"],["6-3","s2","二、亮點活動說明","二、亮點活動說明"],["6-3","s3","（一）榮獲教育部教學卓越獎銀質獎","（一）榮獲教育部教學卓越獎銀質獎"],["6-3","s3","（一）榮獲教育部教學卓越獎銀質獎","本校以 Smgatu 課程方案參加 113 年度教育部教學卓越獎全國賽，榮獲銀質獎。評審委員肯定本校在民族文化傳承與創新教學上之突破與深度，為宜蘭縣原住民族實驗教育學校爭取全國性最高殊榮，亦是對本校多年來系統性推動民族教育成果之具體認可。"],["6-3","s3","（一）榮獲教育部教學卓越獎銀質獎","創新之處在於：Smgatu 課程方案並未把祭儀視為年度性的體驗活動，而是將單一祭儀發展為具完整結構的課程設計——從守月期的月相觀測與擇日、籌備會議的分工、祭儀當日的實作，到事後的集體省思，構成一個可逐年檢討與滾動修正的完整歷程。得獎所肯定的並非活動本身，而是這套把歲時祭儀轉化為可操作課程的方法。"],["6-3","s4","（二）sbalay 傳統和解儀式：將傳統規範延伸為公共事務之處理方式","（二）sbalay 傳統和解儀式：將傳統規範延伸為公共事務之處理方式"],["6-3","s4","（二）sbalay 傳統和解儀式：將傳統規範延伸為公共事務之處理方式","113 學年度，本校在處理校園文化場域借用爭議時，由學校主動倡議以泰雅族傳統 sbalay 機制取代行政申訴程序，引導公所、拍攝廠商與學校三方回歸 gaga 精神尋求和解。"],["6-3","s4","（二）sbalay 傳統和解儀式：將傳統規範延伸為公共事務之處理方式","創新之處在於：將傳統規範從文化課程的教學內容，延伸為學校實際參與地方公共事務的處理方式。sbalay 不再只是課堂上講述的文化知識，而是學校在真實情境中選擇信任並啟動的解決機制。這也是本校「學校即部落」辦學理念之具體實踐——當衝突發生，學校選擇以祖先留下的方式回應，而非訴諸外部行政機制。"],["6-3","s4","（二）sbalay 傳統和解儀式：將傳統規範延伸為公共事務之處理方式","（事件經過、時序與三方處理歷程詳見 🏘️6-1 部落互動與家長參與情形）"],["6-3","s5","（三）國際跨文化交流與文化能見度","（三）國際跨文化交流與文化能見度"],["6-3","s5","（三）國際跨文化交流與文化能見度","本校已連續四年與臺北歐洲學校、連續兩年與日本田園調布學園締結跨文化交流合作，每年接待外籍師生到校深度體驗泰雅文化技藝；前期亦曾接待新加坡花菲衛理中學等校師生來訪。交流活動中，學生不再只是文化的學習者，更化身為文化的傳遞者，以自身所學親自引導外國師生認識傳統工藝、理解泰雅文化的深度與精神。"],["6-3","s5","（三）國際跨文化交流與文化能見度","這樣的跨文化對話，為學生創造了一個獨特的學習情境：當他們必須向來自不同文化背景的人說明自己的傳統，便是最深刻的文化理解與認同的時刻。數年交流累積下來，學生在真實的跨文化互動中逐漸建立對自身文化之自信，泰雅文化亦因此在國際場域中被看見。"],["6-3","s5","（三）國際跨文化交流與文化能見度","114 學年度末，文化課程的學習成果進一步走入更大的國際場域。115 年 6 月 13 至 17 日於臺北舉行之國際扶輪年會，匯聚約 140 個國家、近 4 萬名扶輪領袖與國際賓客。本校提供學生於文化課程中依傳統工序釀製之小米酒，由扶輪社作為致贈全球扶輪貴賓之見面禮，並於瓶身設計泰雅文化介紹與說明，使國際賓客得以循瓶身文字理解其文化脈絡。"],["6-3","s5","（三）國際跨文化交流與文化能見度","小米酒為泰雅族歲時祭儀之必備祭品。學生係於文化課程中及守月（magu byaling）期間，由耆老及文化老師指導釀製要領與相關禁忌，進而理解其在祭儀流程與家族倫理中之意義；此次對外致贈之小米酒，即以上述文化課程之學習成果為基礎。"],["6-3","s5","（三）國際跨文化交流與文化能見度","創新之處在於：文化課程的產出不再只停留於校內成果展示，而成為跨文化溝通的實體媒介。當學生的作品隨賓客帶回一百四十個國家，瓶身本身即是一份文化解說——學生雖不在現場，泰雅文化仍能為自己發聲。"],["6-3","s5","（三）國際跨文化交流與文化能見度","相關報導：工商時報、PChome 新聞、蕃薯藤 yam。完整媒體報導清單（共 16 家）另存於佐證資料夾。"],["6-3","s6","（四）九年級 Pinsbkan 尋根之旅作為課程總結設計","（四）九年級 Pinsbkan 尋根之旅作為課程總結設計"],["6-3","s6","（四）九年級 Pinsbkan 尋根之旅作為課程總結設計","完成三年泰雅民族文化課程後，九年級學生於畢業前踏上回到祖居地 Pinsbkan 之尋根之旅。此一設計之意義在於：尋根之旅既是三年課程的總結，也是學生文化認同旅程的起點，象徵真正意義上的畢業與傳承。（行程規劃與辦理情形詳見 🌾6-2 學生學習部落歲時生活情形）"],["6-3","s6","（四）九年級 Pinsbkan 尋根之旅作為課程總結設計","創新之處在於：以「回到祖居地」作為三年課程的總結性設計，取代一般以紙筆測驗或書面報告收束課程的作法。學生走過遷徙路徑、站上族群起源之地，所檢驗的並非記得多少知識，而是能否將三年所學串連起來，形成對自身來處更深刻的理解。畢業前的最後一堂課因此不在教室裡，而在祖先出發的地方。"],["6-3","s7","（五）magu byaling 與 sbalay 之校內制度化實踐（互動網頁）","（五）magu byaling 與 sbalay 之校內制度化實踐（互動網頁）"],["6-3","s7","（五）magu byaling 與 sbalay 之校內制度化實踐（互動網頁）","113 學年度小米播種祭（Smgatu）前之守月（magu byaling）期間，本校將泰雅族傳統規範導入學生事務與輔導工作，形成一套具文化脈絡之運作機制。該機制以守月時序為框架（113 年 11 月 27 日至 12 月 27 日），由學輔團隊辦理文化回應宣導，引導學生理解族人處理「未解之事」之傳統智慧；學生於期間內以四項核心特質檢視自身與群體之言行，並於期末以組織團體方式進行集體省思，形成全校共同的反思脈絡。"],["6-3","s7","（五）magu byaling 與 sbalay 之校內制度化實踐（互動網頁）","期間所發生之各項團體事件，無論正向表現或人際議題，均循 sbalay 之精神處理：先使事實浮現，再由當事人表達彼此之感受與需求，最後完成和解。校內並設置求助管道，供學生主動提出尚待處理之人際議題。祭儀是否照常舉辦，亦由各班級代表與校長開會共議後決定，使學生成為文化實踐之決策參與者。"],["6-3","s7","（五）magu byaling 與 sbalay 之校內制度化實踐（互動網頁）","創新之處在於：將 gaga 由課程內容與對外事務，進一步落實至校內學生事務與輔導工作之日常運作。一般學校處理學生人際衝突多依獎懲規定與個別晤談辦理，本校則以祭儀時序為框架、以 sbalay 為處理程序、以四項核心特質為檢視軸線，使輔導管教工作本身成為文化實踐的一環，而非僅是文化課程的行政配套。"],["6-3","s7","（五）magu byaling 與 sbalay 之校內制度化實踐（互動網頁）","互動網頁｜MAGU BYALING 謹言慎行：守月時期的自我省思與 sbalay 和解實踐"],["6-3","s7","（五）magu byaling 與 sbalay 之校內制度化實踐（互動網頁）","113 學年度學輔工作文化回應宣導之完整內容，含未解之事之徵候、sbalay 處理四步驟、「來得及」與「來不及」之對照，以及全校學生集體省思心智圖。內容較長，建議於新分頁全螢幕檢視。"],["6-3","s7","（五）magu byaling 與 sbalay 之校內制度化實踐（互動網頁）","在新分頁開啟完整內容 ↗"],["6-3","s8","（六）回應前次評鑑建議：主動走入部落","（六）回應前次評鑑建議：主動走入部落"],["6-3","s8","（六）回應前次評鑑建議：主動走入部落","前次評鑑（112 學年度）委員建議學校加強與部落社區之主動連結與互動。本校於 114 學年度積極回應：配合各村落國小辦理村校聯運，於活動現場設置實驗教育宣傳攤位，主動向部落居民與家長說明學校辦學成果；問卷調查顯示 96.9％ 之參與者認同學校推動文化課程之方向，並有 9.2％ 之受訪者表示過去從未聽說學校推動實驗教育，顯示本次宣傳確實接觸到過去尚未了解本校實驗教育的居民。此外，本校持續推動文化青年團之運作，招收畢業校友參與泰雅文化知能研習，延伸文化教育至離校後之生命歷程。"],["6-3","s8","（六）回應前次評鑑建議：主動走入部落","以下依「宜蘭縣 112 學年度原住民族實驗教育評鑑結果報告書」中各項委員書面審查意見，摘錄具體建議事項，對照本校 112 至 115 年度之回應作法。委員意見中屬肯定性之敘述不列入本表。"],["6-3","s8","（六）回應前次評鑑建議：主動走入部落","互動網頁｜前次評鑑（112 學年度）委員建議回應對照表"],["6-3","s8","（六）回應前次評鑑建議：主動走入部落","五大項目、共 13 項委員建議及本校回應作法之完整對照。表格較長，建議於新分頁全螢幕檢視。"],["6-3","s8","（六）回應前次評鑑建議：主動走入部落","在新分頁開啟完整對照表 ↗"],["6-3","s8","（六）回應前次評鑑建議：主動走入部落","下方五個項目為完整網頁之文字版，可直接於本頁展開閱讀。"],["6-3","s8","（六）回應前次評鑑建議：主動走入部落","項目一 實驗教育計畫之執行（3 項建議）"],["6-3","s8","（六）回應前次評鑑建議：主動走入部落","委員建議（摘錄） 本校回應作法"],["6-3","s8","（六）回應前次評鑑建議：主動走入部落","建議於特定評鑑項目，以「愛土地、負責、合作、感恩」四項人格特質為軸線，更具體呈現計畫理念之落實狀況。 彙整 112～114 學年度文化領域教學研究會會議紀錄，製作「112～114 學年度民族教育理念與泰雅文化實踐情形（四大特質視覺化）」，以四項特質為軸線逐學年呈現實踐運作方式與各年級課程實施情形，並引述會議紀錄中師生表現之具體實例。另推動質性成績單制度，由教師以文字具體描述學生展現四項特質之事例。"],["6-3","s8","（六）回應前次評鑑建議：主動走入部落","建議於新一期實驗教育計畫中，就例行性工作以外之內外活動參與，明列原則（甚至包括數量），以摸索合理工作負擔量。 本項未明列於新一期實驗教育計畫書；惟已於校務會議中，就外部活動之參與原則凝聚共識，以合理工作負擔量作為衡酌參與外部活動之依據。"],["6-3","s8","（六）回應前次評鑑建議：主動走入部落","提報下一期實驗教育計畫前，宜進行總檢討；對具挑戰之面向，宜有不同或創新的實驗作為。 113 學年度起依多年執行經驗啟動課程單元滾動式修正；114 學年度完成課程架構滾動式修正，調整三大年級主軸之單元架構，並新增專題研究實作課程。每學年參與課程計畫備查會議並依結論修正計畫書，每學期接受東華協作中心輔導諮詢並據委員意見調整。"],["6-3","s8","（六）回應前次評鑑建議：主動走入部落","項目二 學生權益之維護（1 項建議）"],["6-3","s8","（六）回應前次評鑑建議：主動走入部落","委員建議（摘錄） 本校回應作法"],["6-3","s8","（六）回應前次評鑑建議：主動走入部落","建議未來文化課程可以結合領域課程再做深化，例如族語課程和英語課程和國語文課程，形成主題教學。 114 學年度起針對自然領域推動文化回應教學，已完成六份教案並依七至九年級課程進度規劃實施。委員原例示之語文領域結合，為本校後續持續推動之方向（詳見省思四）。"],["6-3","s8","（六）回應前次評鑑建議：主動走入部落","項目三 師生教學之發展（6 項建議）"],["6-3","s8","（六）回應前次評鑑建議：主動走入部落","委員建議（摘錄） 本校回應作法"],["6-3","s8","（六）回應前次評鑑建議：主動走入部落","建議持續深化親知熟稔的教學方式，並逐步提升學生傳統知識文字撰寫及表達能力，促進新一代原住民未來能在原民知識文獻化工作上承擔部分角色。 學生於各課程單元持續記錄學習紀錄本，內容涵蓋課程內容、技術要點與文化知識。各年級學期末辦理課程統整口頭發表；114 學年度新增七、八年級專題基礎實務課程，九年級進入專題研究實作，以分組形式發表完整專題研究作品。"],["6-3","s8","（六）回應前次評鑑建議：主動走入部落","建議系統性檢視歸納哪些部定領域學習內容可與民族知識結合，分年選擇若干主題推動兩類知識的合作教學。 自然科文化回應教學教案即依年段分年選題：七年級（生殖與苧麻小米繁殖、燒墾碳循環）、八年級（蒸桶熱傳播、苧麻染線反應速率）、九年級（日地月相對運動與守月期），將部定自然領域學習內容與泰雅民族知識系統性結合。"],["6-3","s8","（六）回應前次評鑑建議：主動走入部落","有關 3-4 學生民族文化認知與認同之評估，建議結合學生參與各類校外競賽表現，透過自我檢討或教師側寫觀察，呈現學生文化認同認知的成長歷程。 已將族語朗讀、族語單詞、族語戲劇等各類競賽之準備與參賽歷程列為觀察學生文化認同提升情形之重要窗口，由帶隊教師觀察；並輔以每學期文化課程學習回饋問卷之質性彙整，及畢業生現況調查與文化認同回饋。"],["6-3","s8","（六）回應前次評鑑建議：主動走入部落","建議在既有經驗及材料的累積下，逐步建立模式或模組，讓後續新接手的各類教師能較快進入狀況。 持續累積並保存各年級文化課程教案及族語文本（已完成七至九年級四季語與賽考利克語族語文本）；教學研究會每週固定召開，進行教案共備、說課、議課（112 學年度 33 場次、113 學年度 30 場次、114 學年度 32 場次），使課程經驗得以傳承。課程模組化為持續推動之方向。"],["6-3","s8","（六）回應前次評鑑建議：主動走入部落","學校累積多年的田調及教學資料（包括文本及影音），建議尋求外部單位專業協助進行數位化儲存。 本校以攝影及資訊設備完整保存課程歷程紀錄，涵蓋課前備課、課中教學、課後省思、田野調查與成果展示等面向。與外部單位（如國教院原教中心、政大泰雅族知識中心）合作進行數位化儲存部分，尚未辦理。後續規劃：擬將田野調查影音資料之系統性數位化列為 115 學年度待辦事項，預計先完成校內現有資料之清點與分類，再洽詢外部專業單位協助之可行性。"],["6-3","s8","（六）回應前次評鑑建議：主動走入部落","學生與外校或國際交流是讓學生知己知彼最好機會，也是展現自信與瞭解多元文化最好的方式，充足的準備與規劃是必要的。 本校自 111 學年度起連續四年與臺北歐洲學校辦理跨文化交流，連續兩年與日本田園調布學園締結交流合作，並接待新加坡花菲衛理中學師生來訪；交流活動中由學生以自身所學引導外籍師生認識傳統工藝與泰雅文化。"],["6-3","s8","（六）回應前次評鑑建議：主動走入部落","項目四 財務之透明健全（1 項建議）"],["6-3","s8","（六）回應前次評鑑建議：主動走入部落","委員建議（摘錄） 本校回應作法"],["6-3","s8","（六）回應前次評鑑建議：主動走入部落","建議經費做成表格統計，方便檢視瞭解。 115 年度評鑑報告書 4-1 已以表格統計各年度經費之計畫名稱、款別、核定數、執行數、賸餘數及執行率，便於檢視瞭解。本網站 📊4-1 經費運用情形 亦同步以表格呈現。"],["6-3","s8","（六）回應前次評鑑建議：主動走入部落","項目五 民族教育發展特色（2 項建議）"],["6-3","s8","（六）回應前次評鑑建議：主動走入部落","委員建議（摘錄） 本校回應作法"],["6-3","s8","（六）回應前次評鑑建議：主動走入部落","建議加強部落家長溝通，配合家長農閒時期安排家長說明會和文化體驗課程。 114 學年度配合各村落國小辦理村校聯運，設置實驗教育宣傳攤位，主動向部落居民與家長說明辦學成果，問卷有效回收 98 份、96.9％ 認同文化課程方向。學區招生宣導由 113 學年度 5 場次擴增至 114 學年度 7 場次。每學期辦理親職座談，家長出席率逐步提升；文化課程部分單元引導學生訪問家長或請家長協助備材。每學年結合校慶辦理文化課程教學成果展。"],["6-3","s8","（六）回應前次評鑑建議：主動走入部落","建議未來民族教育課程加強跟一般領域的主題串聯，加深加廣，並導入部落創生、部落發展議題的專題報告。 領域主題串聯：114 學年度起推動自然科文化回應教學。部落議題專題：114 學年度九年級專題研究實作主題均為部落文化與發展議題，包括「大同泰雅三石灶的構造與家庭意義」「國民政府時期南山四季傳統地名由來」「現代對於男性織布的看法」「口簧琴影音製作與介紹」，於學期末分組發表完整研究作品。"],["6-3","s9","三、民族教育省思（互動網頁）","三、民族教育省思（互動網頁）"],["6-3","s9","三、民族教育省思（互動網頁）","省思一至四為本校辦理民族教育八年來持續自我追問之課題，照錄評鑑報告書原文。省思五就支撐課程運作之制度面限制加以說明。"],["6-3","s9","三、民族教育省思（互動網頁）","互動網頁｜民族教育省思與具體作為對照說明"],["6-3","s9","三、民族教育省思（互動網頁）","五項省思之完整說明與對應之具體作為。"],["6-3","s9","三、民族教育省思（互動網頁）","在新分頁開啟完整說明 ↗"],["6-3","s9","三、民族教育省思（互動網頁）","下方為完整網頁之文字版，可直接於本頁展開閱讀。"],["6-3","s9","三、民族教育省思（互動網頁）","省思一 我們為什麼要辦實驗教育？"],["6-3","s9","三、民族教育省思（互動網頁）","本校自 107 學年度轉型實驗教育，出發點只有一個：讓這裡的孩子能夠真正認識自己的文化，成為 Tayal balay。這不是口號，而是一個需要在每一堂課、每一個學習決定中反覆檢視的問題。"],["6-3","s9","三、民族教育省思（互動網頁）","八年來，外界對實驗教育的期待多元，有人看學科成績，有人看競賽名次，有人看活動辦得熱不熱鬧。每一次面對這些期待，我們都必須重新問自己：這是我們原本想走的路嗎？ 這樣的自我追問，是本校推動民族教育最基本的起點，也是以下各點省思的共同背景。"],["6-3","s9","三、民族教育省思（互動網頁）","省思二 學校的文化課程，和體驗營隊有什麼不同？"],["6-3","s9","三、民族教育省思（互動網頁）","在推動文化課程的過程中，我們持續面對一個值得直視的問題：如果學生只是「做過」醃肉、「織過」布、「參加過」播種祭，而課程沒有引發反思、沒有建立認同，那麼學校存在的意義，就需要被重新檢視。"],["6-3","s9","三、民族教育省思（互動網頁）","傳藝工坊與體驗營隊傳授的是技術，但學校能做的，是在三年連貫的時間軸上，將技藝、文化、信仰、土地倫理與族群認同編織在一起，讓學生不只「學過」，而是「理解為什麼」、「知道這對我意味著什麼」。"],["6-3","s9","三、民族教育省思（互動網頁）","這條路仍在持續深化之中。如何確保每一個文化學習的當下都有足夠的反思空間，讓學生從操作者成為思考者，最終成為文化的認同者與傳承者，是本校課程發展最重要的方向，也是持續努力的目標。"],["6-3","s9","三、民族教育省思（互動網頁）","省思三 為了維持計畫，我們在課程上做了哪些讓步？"],["6-3","s9","三、民族教育省思（互動網頁）","這是我們必須誠實面對的困境：當績效成為評估實驗教育成效的主要方式，學校便承受著以競賽成績、得獎紀錄來回應外部期待的壓力。為維持計畫經費補助、通過評鑑檢核，我們有時不得不在課程設計與資源分配上，部分讓步於「看得見的成果」。"],["6-3","s9","三、民族教育省思（互動網頁）","我們必須自問：讓學生密集備賽、追求名次，是在彰顯泰雅文化的價值，還是在用主流教育的邏輯，重新框架了原本應該是另一種樣貌的學習？競賽得名固然能帶來能見度與資源，但若因此壓縮了學生沉浸於文化學習的時間與空間，甚至讓學生將文化技藝視為表演而非生活，這樣的「績效」，恐怕正在侵蝕實驗教育最核心的意義。"],["6-3","s9","三、民族教育省思（互動網頁）","面對這樣的拉扯，我們想要的選擇是：在必要的績效回應之外，堅守文化學習的本質，不以競賽準備取代課程深耕，並持續透過質性評量、學習歷程紀錄等方式，讓真實的學習成果被看見。我們也期待，評估框架能逐步納入更符合民族教育本質的指標，讓每一所實驗教育學校都能在不失去自己的前提下，繼續走這條值得走的路。"],["6-3","s9","三、民族教育省思（互動網頁）","省思四 文化融入各領域，為何推動起來這麼難？"],["6-3","s9","三、民族教育省思（互動網頁）","實驗教育的理想中，民族文化應能滲透至各領域的日常學習，然而實際推動上，結構性的困難遠比想像中大：國中各領域課程專業分工明確，學科目標與文化課程的節奏未必吻合，若強行結合，反而可能使文化融入流於形式，失去應有的深度。"],["6-3","s9","三、民族教育省思（互動網頁）","面對這樣的困境，我們選擇誠實承認整合的難度，在可行之處逐步嘗試。114 學年度起，我們針對自然領域進行較深入的討論，尋找更適切的課程連結點。真正的文化回應教學，需要時間、信任與專業的長期積累，無法一蹴可幾，但這也正是實驗教育學校必須持續面對的課題。"],["6-3","s9","三、民族教育省思（互動網頁）","省思五 撐住這套課程的，為什麼始終是人而不是制度？"],["6-3","s9","三、民族教育省思（互動網頁）","本校民族文化課程推動至今八年，運作穩定。但支撐這份穩定的主要是教師的使命感與團隊默契，而非制度化的資源。這一點本校必須誠實指出。"],["6-3","s9","三、民族教育省思（互動網頁）","師資：文化課程尚無對應之教師證照與師資培育管道，本校文化教師均以代理教師身分聘用。本校自 107 學年度以來文化教師未曾異動，然而這是個人選擇的結果，不是制度保障的結果；一旦有教師離開，本校並無替補來源。族語教師之鐘點與交通條件，亦不利於長期投入。"],["6-3","s9","三、民族教育省思（互動網頁）","教材：文化課程沒有教科書，也沒有課綱。三個年級共 21 個主題單元之教學內容，均由文化教師訪談耆老、查閱文獻後逐年自行建構。教師投入於「準備教什麼」的時間，明顯多於投入「怎麼教得更好」。"],["6-3","s9","三、民族教育省思（互動網頁）","族語：族語在課堂之內是教學語言，走出教室即回到華語環境。部分年輕教師之族語能力尚不足以直接與耆老對談，文化知識之採集因而受限。本校以耆老協同教學與競賽輔導因應，但課堂之外的語言環境非學校單獨所能營造。"],["6-3","s9","三、民族教育省思（互動網頁）","行政：人力編制與經費核銷仍須依一般學校制度辦理。耆老鐘點、傳統材料採購等支出不易取得一般核銷所需之憑證，行政人員需另尋處理方式。"],["6-3","s9","三、民族教育省思（互動網頁）","以上四項均非本校可自行解決，本校亦不以此作為成效不足之理由。本校能做的是把課程與教材留下來、把人留住，並在各項會議與全國性討論場合持續反映制度需求。若原住民族學校法及相關配套能完成立法，上述限制方有制度性的解方。"],["6-3","s9","三、民族教育省思（互動網頁）","外部觀察與學術研究對本項省思之對照"],["6-3","s9","三、民族教育省思（互動網頁）","本項省思所述之制度性限制，於兩份外部研究中均獲得相近記錄。其一為觀課與訪談報告，於教師訪談中記錄本校文化課程面臨「耆老與長輩入班難度逐漸增加」、「缺乏族語語言環境，難以真正落實以族語教學」等困境，與本節陳述情形一致。其二為國立臺灣大學人類學系碩士論文（鄧教東，2024；田野期間涵蓋 112 學年度完整一學年），以整章篇幅論證文化教師因現行教育體制中無對應之學習科目而無法以正式教師聘任，並指出民族實驗教育體制並非為原住民族教育之需求所設計。兩項觀察均係在未與本校討論之情況下形成。"],["6-3","s9","三、民族教育省思（互動網頁）","在新分頁開啟 ↗"],["6-3","s9","三、民族教育省思（互動網頁）","五項省思與具體作為對照圖"],["6-3","s9","三、民族教育省思（互動網頁）","省思與具體作為對照表（文字版）"],["6-3","s9","三、民族教育省思（互動網頁）","省思 對應之具體作為 佐證位置"],["6-3","s9","三、民族教育省思（互動網頁）","一、我們為什麼要辦實驗教育？ 每學期接受東華原民課程發展協作中心輔導諮詢，定期檢視民族教育理念及文化課程落實情形；每學年依課程計畫備查會議結論滾動修正實驗教育課程計畫書 指標 1-1（東華協作輔導諮詢會議資料）"],["6-3","s9","三、民族教育省思（互動網頁）","二、學校的文化課程，和體驗營隊有什麼不同？ 三年連貫課程架構；質性成績單以文字描述取代單一分數；各年級學期末課程統整分享與專題研究發表 指標 3-1（文化課程教案）、指標 3-4（文化課程回饋質性描述）"],["6-3","s9","三、民族教育省思（互動網頁）","三、為了維持計畫，我們在課程上做了哪些讓步？ 以質性評量、學習歷程紀錄呈現真實學習成果：學生學習紀錄本、每學期文化課程學習回饋問卷、畢業生現況調查與文化認同回饋 指標 3-3、指標 3-4"],["6-3","s9","三、民族教育省思（互動網頁）","四、文化融入各領域，為何推動起來這麼難？ 114 學年度起針對自然領域發展文化回應教學，已完成六份教案並實際教學 指標 3-1（自然科文化回應教學教案）"],["6-3","s9","三、民族教育省思（互動網頁）","五、撐住這套課程的，為什麼始終是人而不是制度？ 保存各年級教案、族語文本與學生學習歷程紀錄；每週教學研究會共備、說課、議課；校內外增能與跨校共備交流；於課程計畫備查、輔導諮詢及全國性討論場合，持續反映師資培育管道與法規鬆綁之需求 指標 2-3（師資結構與教學增能）、指標 3-1（文化課程教案）"],["6-3","s10","四、精選照片","四、精選照片"],["6-3","s10","四、精選照片","學校團隊榮獲教育部教學卓越獎銀質獎"],["6-3","s10","四、精選照片","九年級回到祖居地－Pinsbkan 尋根之旅"],["6-3","s10","四、精選照片","透過扶輪社致贈學生親釀小米酒給外國賓客"],["6-3","s10","四、精選照片","運用村校聯運時間進行學校實驗教育宣傳（1）"],["6-3","s10","四、精選照片","運用村校聯運時間進行學校實驗教育宣傳（2）"],["6-3","s10","四、精選照片","運用村校聯運時間進行學校實驗教育宣傳（3）"],["6-3","s10","四、精選照片","與日本田園調布學園的學生交流泰雅文化技藝"],["6-3","s10","四、精選照片","與臺北歐洲學校的學生交流泰雅文化技藝"],["6-3","s10","四、精選照片","與新加坡花菲衛理中學的學生交流泰雅文化技藝"],["6-3","s11","五、佐證資料清單","五、佐證資料清單"],["home","s1","壹、學校簡介","壹、學校簡介"],["home","s1","壹、學校簡介","校名 宜蘭縣立大同國民中學 校址 宜蘭縣大同鄉泰雅路四段 35 號"],["home","s1","壹、學校簡介","學校網址 www.dtjh.ilc.edu.tw 電話 （03）9809611"],["home","s1","壹、學校簡介","班級數 普通班 3 班、技藝教育專班 1 班 學生數 33 人（七年級 11、八年級 9、九年級 13）"],["home","s1","壹、學校簡介","教職員工數 28 人 編制教師數 11 人（含校長）"],["home","s1","壹、學校簡介","校長 林武聰（115 學年度到職） 學生主要族群 泰雅族"],["home","s1","壹、學校簡介","本校位居蘭陽溪上游、省道台七甲線五公里處，群山環抱。校區由省道分隔為南、北兩區，教學區約 14,000 平方公尺，運動區約 16,000 平方公尺，設有二座光電球場、200 公尺簡易田徑場與傳統小米園區。"],["home","s1","壹、學校簡介","本校採自由學區，學生來自南山、四季、茂安及英士等四村，與學校距離 6 至 25 公里不等，學區內計有南山國小、四季國小、四季國小英士分校及四季國小茂安分班等四所本、分、班校，學生主要族群為泰雅族。"],["home","s2","貳、Tayal balay 實驗教育願景","貳、Tayal balay 實驗教育願景"],["home","s2","貳、Tayal balay 實驗教育願景","肯定原住民教育價值，找回原住民教育本質，讓學生成為 Tayal balay（真正的泰雅人）。"],["home","s2","貳、Tayal balay 實驗教育願景","gaga 是泰雅生活裡最重要的精神信仰，是祖靈的話語與訓誡、是族人必須遵循的規範，涵蓋泰雅族對土地、自然、祖先、家族與共同體的關係準則。本校經全校師生共同討論，自 gaga 中析出四項核心特質，作為課程設計與校園生活之指導原則。"],["home","s2","貳、Tayal balay 實驗教育願景","愛土地 mlahang rhzyal"],["home","s2","貳、Tayal balay 實驗教育願景","透過農耕體驗、植物辨識與部落踏查，培養學生對自然環境的敬重與守護意識。"],
