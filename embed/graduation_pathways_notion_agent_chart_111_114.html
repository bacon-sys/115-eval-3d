<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}</style>
</head>
<body>
<style>
	:root {
		color-scheme: light dark;
		--bg-base: transparent;
		--bg-muted: #f6f5f4;
		--bg-elevated: #ffffff;
		--content-primary: #191918;
		--content-secondary: #615d59;
		--content-tertiary: #78736f;
		--border-primary: rgba(25, 25, 24, 0.12);
		--border-strong: rgba(25, 25, 24, 0.2);
		--grid: rgba(25, 25, 24, 0.08);
		--shadow-elevated: 0 4px 12px rgba(25, 25, 24, 0.1);
		--blue: #7fb4ec;
		--yellow: #eac26b;
		--green: #72bc8f;
		--purple: #bf8eda;
		--orange: #eda86e;
		--pink: #df84a8;
		--teal: #4fb9c9;
		--red: #e97366;
		--neutral: #a39e98;
		--text: var(--content-primary);
		--muted: var(--content-secondary);
		--border: var(--border-primary);
		--surface: var(--bg-muted);
		--tooltip-bg: var(--bg-elevated);
		--aqua: var(--teal);
		--magenta: var(--pink);
		--violet: var(--purple);
		--canvas: var(--bg-base);
	}
	@media (prefers-color-scheme: dark) {
		:root {
			--bg-muted: #31302e;
			--bg-elevated: #31302e;
			--content-primary: #f6f5f4;
			--content-secondary: #a39e98;
			--content-tertiary: #78736f;
			--border-primary: rgba(255, 255, 255, 0.14);
			--border-strong: rgba(255, 255, 255, 0.22);
			--grid: rgba(255, 255, 255, 0.09);
			--shadow-elevated: 0 6px 16px rgba(0, 0, 0, 0.32);
			--neutral: #78736f;
		}
	}
	* {
		box-sizing: border-box;
	}
	html,
	body {
		margin: 0;
		padding: 0;
		overflow-x: clip;
		background: var(--canvas);
	}
	body {
		inline-size: 100%;
		max-inline-size: none;
		padding-block: 16px 4px;
		color: var(--text);
		font: 450 14px/20px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica,
			Arial, sans-serif;
	}
	.figure-header {
		display: flex;
		align-items: baseline;
		justify-content: space-between;
		gap: 16px;
		inline-size: 100%;
		margin-block-end: 12px;
	}
	.figure-title {
		color: var(--content-primary);
		font-size: 14px;
		font-weight: 550;
		line-height: 20px;
	}
	.panel-title {
		font-size: 13px;
		font-weight: 550;
		line-height: 18px;
		margin-block-end: 8px;
		color: var(--content-primary);
	}
	.panel-aside {
		color: var(--content-tertiary);
		font-size: 12px;
		line-height: 16px;
		margin-block: -4px 12px;
	}
	.panel + .panel {
		margin-block-start: 24px;
	}
	.figure-aside {
		flex: 0 1 auto;
		max-inline-size: 50%;
		color: var(--content-tertiary);
		font-size: 12px;
		line-height: 16px;
		text-align: end;
	}
	.legend {
		display: flex;
		flex-wrap: wrap;
		align-items: center;
		gap: 12px;
		margin: 0 0 12px;
		font-size: 12px;
		line-height: 16px;
		color: var(--muted);
	}
	.key-sq {
		display: inline-block;
		inline-size: 10px;
		block-size: 10px;
		border-radius: 2px;
		background: var(--neutral);
		margin-inline-end: 6px;
		vertical-align: middle;
	}
	.key-line {
		display: inline-block;
		inline-size: 14px;
		border-top: 2px solid var(--neutral);
		margin-inline-end: 6px;
		vertical-align: middle;
	}
	.chart-wrap,
	.plot {
		position: relative;
		inline-size: 100%;
		max-inline-size: none;
	}
	.chart-wrap {
		height: 300px;
	}
	.chart-wrap > canvas,
	.chart-wrap > svg,
	.plot > svg {
		display: block;
		inline-size: 100% !important;
		max-inline-size: none;
	}
	.axis-line {
		stroke: var(--border);
		stroke-width: 1;
	}
	.grid-line,
	.guide {
		stroke: var(--grid);
		stroke-width: 1;
	}
	.guide {
		stroke: var(--border-strong);
	}
	.tick-text,
	.x-text {
		fill: var(--muted);
		font-size: 12px;
	}
	.x-text {
		text-anchor: middle;
	}
	.data-mark {
		outline: none;
	}
	.data-mark:focus-visible {
		outline: 2px solid var(--blue);
		outline-offset: -2px;
	}
	.chart-tooltip {
		position: absolute;
		z-index: 1;
		max-inline-size: min(320px, calc(100% - 8px));
		padding: 8px;
		border: 1px solid var(--border-strong);
		border-radius: 8px;
		background: var(--tooltip-bg);
		box-shadow: var(--shadow-elevated);
		color: var(--text);
		font-size: 12px;
		line-height: 16px;
		pointer-events: none;
		visibility: hidden;
		opacity: 0;
		transition: opacity 120ms cubic-bezier(0.33, 1, 0.68, 1);
	}
	.chart-tooltip[data-visible="true"] {
		visibility: visible;
		opacity: 1;
	}
	.tip-title {
		margin-block-end: 6px;
		font-size: 13px;
		font-weight: 550;
		line-height: 18px;
	}
	.tip-row {
		display: grid;
		grid-template-columns: 8px minmax(0, 1fr) auto;
		align-items: center;
		column-gap: 8px;
		min-inline-size: 160px;
	}
	.tip-key {
		inline-size: 8px;
		block-size: 8px;
		border-radius: 1px;
	}
	.tip-label,
	.tip-value,
	.tip-extra {
		color: var(--content-secondary);
	}
	.tip-title,
	.tip-label,
	.tip-extra {
		min-inline-size: 0;
		overflow-wrap: anywhere;
		white-space: normal;
	}
	.tip-value {
		white-space: nowrap;
		font-variant-numeric: tabular-nums;
		font-weight: 550;
		text-align: end;
	}
	.tip-extra {
		margin-block-start: 8px;
		padding-block-start: 6px;
		border-block-start: 1px solid var(--border);
	}
	@media (prefers-reduced-motion: reduce) {
		.chart-tooltip {
			transition: none;
		}
	}
	@media (max-width: 520px) {
		.figure-header {
			display: block;
		}
		.figure-aside {
			max-inline-size: none;
			margin-block-start: 2px;
			text-align: start;
		}
	}
	.legend-toggle {
		display: inline-flex;
		align-items: center;
		padding: 2px 6px;
		border: 0;
		border-radius: 6px;
		background: transparent;
		color: var(--muted);
		font: inherit;
		font-size: 12px;
		line-height: 16px;
		cursor: pointer;
	}
	.legend-toggle:hover {
		background: var(--bg-muted);
	}
	.legend-toggle[aria-pressed="false"] {
		opacity: 0.45;
	}
	.legend-toggle:focus-visible {
		outline: 2px solid var(--blue);
		outline-offset: 1px;
	}
	.view-toggle {
		font: inherit;
		font-size: 12px;
		line-height: 16px;
		padding: 4px 10px;
		border: 0.5px solid var(--border-strong);
		border-radius: 6px;
		background: transparent;
		color: var(--muted);
		cursor: pointer;
	}
	.view-toggle[aria-pressed="true"] {
		background: var(--bg-muted);
		color: var(--content-primary);
		font-weight: 550;
	}
	.sr-only {
		position: absolute;
		inline-size: 1px;
		block-size: 1px;
		overflow: hidden;
		clip-path: inset(50%);
		contain: strict;
		white-space: nowrap;
	}
	table.sr-only {
		display: block;
	}
</style>

			const container = chart.canvas.parentElement
			const tip = container.querySelector(".chart-tooltip")
			if (!tooltip || tooltip.opacity === 0) {
				tip.dataset.visible = "false"
				tip.setAttribute("aria-hidden", "true")
				return
			}
			const rows = tooltip.dataPoints.flatMap(point => {
				const isLine = (point.dataset.type ?? chart.config.type) === "line"
				const rawColor = isLine
					? point.dataset.borderColor
					: point.dataset.backgroundColor
				const color = Array.isArray(rawColor)
					? rawColor[point.dataIndex]
					: rawColor
				let mark = "square"
				if (isLine) mark = "line"
				if (point.dataset.borderDash) mark = "dashed"
				const isXY =
					point.raw !== null &&
					typeof point.raw === "object" &&
					Object.prototype.hasOwnProperty.call(point.raw, "y")
				const row = {
					color,
					mark,
					label: point.dataset.label,
					value: formatValue(
						isXY ? point.raw.y : point.raw,
						point.dataset.valueKind,
					),
				}
				if (isXY && typeof point.dataset.xSeriesKey === "string") {
					return [
						{
							color,
							mark,
							label: point.dataset.xSeriesKey,
							value: formatValue(point.raw.x, point.dataset.xValueKind),
						},
						row,
					]
				}
				return [row]
			})
			if (contextLabel !== "") rows.push({ extra: contextLabel })
			const pointLabel =
				chart.data.labels?.[tooltip.dataPoints[0]?.dataIndex] ?? ""
			buildTooltip(tip, formatTitle(tooltip.title[0] || pointLabel), rows)
			tip.dataset.visible = "true"
			tip.setAttribute("aria-hidden", "false")
			positionTooltip(
				tip,
				container,
				chart.canvas.offsetLeft + tooltip.caretX,
				chart.canvas.offsetTop + tooltip.caretY,
			)
		}
	const crosshair = {
		id: "crosshair",
		beforeDatasetsDraw: chart => {
			const active = chart.tooltip?.getActiveElements?.() ?? []
			if (!active.length) return
			const x = active[0].element.x
			const area = chart.chartArea
			const ctx = chart.ctx
			ctx.save()
			ctx.beginPath()
			ctx.moveTo(x, area.top)
			ctx.lineTo(x, area.bottom)
			ctx.lineWidth = 1
			ctx.strokeStyle = cssVar("--border-strong") || "rgba(25,25,24,0.2)"
			ctx.stroke()
			ctx.restore()
		},
	}
	const stabilizationCleanup = new WeakMap()
	const createChartAudit = spec => {
		let retry
		const unsafeReason = chart => {
			const kinds = [
				...new Set(chart.data.datasets.map(dataset => dataset.valueKind)),
			]
			if (kinds.length !== 1 || !kinds[0]) {
				return "every dataset must declare one shared valueKind"
			}
			if (spec.valueKind && kinds[0] !== spec.valueKind) {
				return "axis expects valueKind " + spec.valueKind + ", got " + kinds[0]
			}
			for (const dataset of chart.data.datasets) {
				for (const value of dataset.data) {
					const parts =
						value !== null &&
						typeof value === "object" &&
						Object.prototype.hasOwnProperty.call(value, "x") &&
						Object.prototype.hasOwnProperty.call(value, "y")
							? [value.x, value.y]
							: Array.isArray(value)
								? value
								: [value]
					for (const part of parts) {
						if (part === null) continue
						if (typeof part !== "number" || !Number.isFinite(part)) {
							return "non-finite data value; missing must be null"
						}
					}
				}
			}
			const axisName = spec.valueAxis || "y"
			if (!chart.scales[axisName]) return "missing value axis " + axisName
			return ""
		}
		const policyReason = chart => {
			const kind = chart.data.datasets[0]?.valueKind
			const axis = chart.scales[spec.valueAxis || "y"]
			if (axis.ticks.length < 4 || axis.ticks.length > 6) {
				return "value axis needs 4-6 ticks, has " + axis.ticks.length
			}
			if (
				["count", "currency", "number"].includes(kind) &&
				Math.max(Math.abs(axis.min), Math.abs(axis.max)) >= 10000
			) {
				for (const tick of axis.ticks) {
					if (/[\d,]{5}/.test(String(tick.label).split(".")[0])) {
						return (
							"axis ticks must use compact formatting above 10K, found " +
							tick.label
						)
					}
				}
			}
			if (chart.options.animation !== false) return "animation must be false"
			if (chart.options.plugins?.tooltip?.enabled !== false) {
				return "canvas tooltip must be disabled (use the external tooltip)"
			}
			if (chart.config.type === "bar") {
				const meta = chart.getDatasetMeta(0)
				for (const element of meta.data) {
					const thickness =
						chart.options.indexAxis === "y" ? element.height : element.width
					if (thickness > 64) return "bar thickness exceeds the 64px cap"
				}
			}
			return ""
		}
		return {
			id: "audit",
			afterDestroy: chart => {
				retry?.reset()
				stabilizationCleanup.get(chart)?.()
				stabilizationCleanup.delete(chart)
			},
			afterUpdate: chart => {
				const host = chart.canvas.parentElement
				if (!host || host.dataset.auditFailed) return
				if (!retry) {
					retry = createAuditRetry(host, 2, [100, 500], reason => {
						host.dataset.auditFailed = "true"
						host.dataset.auditReason = reason
						host.textContent = "Chart failed validation: " + reason
					})
				}
				const unsafe = unsafeReason(chart)
				const policy = unsafe ? "" : policyReason(chart)
				if (policy) host.dataset.auditPolicy = policy
				else delete host.dataset.auditPolicy
				if (unsafe) {
					retry.fail(unsafe, () => {
						if (!chart.canvas?.isConnected || host.dataset.auditFailed) return
						chart.resize()
						chart.update("none")
					})
					return
				}
				retry.reset()
			},
		}
	}
	const stabilize = chart => {
		stabilizationCleanup.get(chart)?.()
		let frame = 0
		const host = chart.canvas.parentElement
		const retry = createAuditRetry(host, 2, [100, 500], () => {})
		const redraw = () => {
			frame = 0
			if (chart.canvas === null || !host.isConnected) return
			chart.draw()
			const canvas = chart.canvas
			canvas.style.opacity = canvas.style.opacity === "0.999" ? "1" : "0.999"
		}
		const scheduleRedraw = () => {
			if (frame) cancelAnimationFrame(frame)
			frame = requestAnimationFrame(() => {
				frame = requestAnimationFrame(redraw)
			})
		}
		const settle = () => {
			scheduleRedraw()
			retry.runAll(redraw)
		}
		const observer =
			typeof ResizeObserver === "undefined"
				? undefined
				: new ResizeObserver(scheduleRedraw)
		observer?.observe(host)
		stabilizationCleanup.set(chart, () => {
			if (frame) cancelAnimationFrame(frame)
			retry.reset()
			observer?.disconnect()
			window.removeEventListener("load", settle)
			window.removeEventListener("resize", scheduleRedraw)
		})
		if (document.readyState === "complete") settle()
		else window.addEventListener("load", settle, { once: true })
		window.addEventListener("resize", scheduleRedraw)
		return chart
	}
	const createLegendToggles = (chart, legendEl) => {
		chart.data.datasets.forEach((dataset, index) => {
			const button = document.createElement("button")
			button.type = "button"
			button.className = "legend-toggle"
			button.setAttribute("aria-pressed", "true")
			const isLine = chart.config.type === "line"
			const key = document.createElement("span")
			key.className = isLine ? "key-line" : "key-sq"
			if (dataset.borderDash) key.dataset.dash = "dashed"
			const color = dataset.borderColor || dataset.backgroundColor
			if (isLine) key.style.borderTopColor = color
			else key.style.background = color
			const label = document.createElement("span")
			label.textContent = dataset.label
			button.append(key, label)
			button.addEventListener("click", () => {
				const visible = chart.data.datasets.map((value, datasetIndex) =>
					chart.isDatasetVisible(datasetIndex),
				)
				visible[index] = !visible[index]
				if (!visible.some(Boolean)) return
				chart.setDatasetVisibility(index, visible[index])
				button.setAttribute("aria-pressed", String(visible[index]))
				chart.update("none")
			})
			legendEl.appendChild(button)
		})
	}
	const SVGNS = "http://www.w3.org/2000/svg"
	const el = (tag, attrs, parent) => {
		const node = document.createElementNS(SVGNS, tag)
		for (const key in attrs) node.setAttribute(key, attrs[key])
		if (parent) parent.appendChild(node)
		return node
	}
	const attachTooltip = (plot, onLineIndex) => {
		const tip = plot.querySelector(".chart-tooltip")
		const guide = plot.querySelector(".guide")
		const hide = () => {
			tip.dataset.visible = "false"
			tip.setAttribute("aria-hidden", "true")
			if (guide) guide.setAttribute("visibility", "hidden")
		}
		const show = (mark, clientX, clientY) => {
			const bounds = plot.getBoundingClientRect()
			let title = mark.dataset.heading
			let rows = [
				{
					color: "var(" + mark.dataset.color + ")",
					mark: mark.dataset.mark || "square",
					label: mark.dataset.label,
					value: mark.dataset.value,
				},
			]
			if (mark.dataset.extra) rows.push({ extra: mark.dataset.extra })
			if (mark.dataset.kind === "line" && onLineIndex) {
				const detail = onLineIndex(Number(mark.dataset.index), guide)
				if (Array.isArray(detail)) rows = detail
				else if (detail) {
					title = detail.title || title
					rows = detail.rows || rows
				}
			}
			buildTooltip(tip, title, rows)
			tip.dataset.visible = "true"
			tip.setAttribute("aria-hidden", "false")
			positionTooltip(tip, plot, clientX - bounds.left, clientY - bounds.top)
		}
		plot.addEventListener("pointermove", event => {
			const mark = event.target.closest
				? event.target.closest(".data-mark")
				: null
			if (mark) show(mark, event.clientX, event.clientY)
			else hide()
		})
		plot.addEventListener("pointerleave", hide)
		plot.addEventListener("focusin", event => {
			const mark = event.target.closest(".data-mark")
			if (!mark) return
			const bounds = mark.getBoundingClientRect()
			show(mark, bounds.left + bounds.width / 2, bounds.top)
		})
		plot.addEventListener("focusout", hide)
	}
	const svgAuditRetries = new WeakMap()
	const svgAudit = (plot, expectedMarks, rerender) => {
		let retry = svgAuditRetries.get(plot)
		if (!retry) {
			retry = createAuditRetry(plot, 2, [100, 500], reason => {
				plot.dataset.auditFailed = "true"
				plot.dataset.auditReason = reason
				plot.textContent = "Chart failed validation: " + reason
			})
			svgAuditRetries.set(plot, retry)
		}
		const fail = reason => retry.fail(reason, rerender)
		const svgNode = plot.querySelector("svg")
		if (!svgNode) return fail("missing svg")
		const marks = svgNode.querySelectorAll(".data-mark").length
		if (marks !== expectedMarks) {
			return fail("expected " + expectedMarks + " marks, found " + marks)
		}
		const rect = svgNode.getBoundingClientRect()
		const viewBox = (svgNode.getAttribute("viewBox") || "")
			.split(/[\s,]+/)
			.map(Number)
		if (rect.width > 0 && viewBox.length === 4 && viewBox[2] > 0) {
			const scale = rect.width / viewBox[2]
			for (const text of svgNode.querySelectorAll("text")) {
				const fontSize = parseFloat(getComputedStyle(text).fontSize || "12")
				if (fontSize * scale < 11) {
					return fail("effective text size below 11px after viewBox scaling")
				}
			}
			for (const text of svgNode.querySelectorAll("text")) {
				try {
					const box = text.getBBox()
					if (box.x < -1 || box.x + box.width > viewBox[2] + 1) {
						return fail("text clips at the plot edge: " + text.textContent)
					}
				} catch (error) {
					if (error instanceof TypeError || error instanceof DOMException) break
					throw error
				}
			}
			const labels = [...svgNode.querySelectorAll(".x-text")]
			for (let index = 1; index < labels.length; index += 1) {
				try {
					const previous = labels[index - 1].getBBox()
					const current = labels[index].getBBox()
					if (
						previous.x + previous.width > current.x &&
						current.x + current.width > previous.x
					) {
						return fail("category labels overlap")
					}
				} catch (error) {
					if (error instanceof TypeError || error instanceof DOMException) break
					throw error
				}
			}
		}
		retry.reset()
		delete plot.dataset.auditRetries
		delete plot.dataset.auditRetryPending
		return true
	}
	const chartJs = {
		createTooltip,
		crosshair,
		createAudit: createChartAudit,
		stabilize,
		createLegendToggles,
	}
	const svg = { el, attachTooltip, audit: svgAudit }
	return {
		formatValue,
		axisRange,
		barPath,
		lineLayout,
		cssVar,
		buildTooltip,
		positionTooltip,
		createAuditRetry,
		chartJs,
		svg,
	}
})()

		const blue = InlineChartRuntime.cssVar("--blue") || "#7fb4ec"
		const yellow = InlineChartRuntime.cssVar("--yellow") || "#eac26b"
		const green = InlineChartRuntime.cssVar("--green") || "#72bc8f"
		const purple = InlineChartRuntime.cssVar("--purple") || "#bf8eda"
		const muted = InlineChartRuntime.cssVar("--muted") || "#615d59"
		const grid = InlineChartRuntime.cssVar("--grid") || "rgba(25,25,24,0.08)"
		const border = InlineChartRuntime.cssVar("--border-strong") || "rgba(25,25,24,0.2)"
		const labels = ["111", "112", "113", "114"]
		const series = [
			{ label: "就業", color: purple, data: [0, 0, 2, 1] },
			{ label: "五專", color: green, data: [7, 3, 2, 2] },
			{ label: "高職", color: yellow, data: [6, 8, 11, 6] },
			{ label: "高中", color: blue, data: [3, 4, 3, 3] },
		]
		const totals = labels.map((_, index) => series.reduce((sum, item) => sum + item.data[index], 0))
		const range = InlineChartRuntime.axisRange(0, Math.max(...totals), { zero: true, target: 5 })
		const chart = new Chart(document.getElementById("graduateFlow"), {
			type: "bar",
			plugins: [InlineChartRuntime.chartJs.createAudit({ valueAxis: "y", valueKind: "count" })],
			data: {
				labels,
				datasets: series.map(item => ({
					label: item.label,
					valueKind: "count",
					data: item.data,
					backgroundColor: item.color,
					borderRadius: 4,
					maxBarThickness: 64,
					stack: "flow",
				})),
			},
			options: {
				responsive: true,
				maintainAspectRatio: false,
				layout: { padding: { left: 0, right: 0, top: 0, bottom: 0 } },
				animation: false,
				interaction: { mode: "index", intersect: false },
				plugins: {
					legend: { display: false },
					tooltip: {
						enabled: false,
						external: InlineChartRuntime.chartJs.createTooltip(value => value + "學年度"),
						itemSort: (a, b) => b.datasetIndex - a.datasetIndex,
					},
				},
				scales: {
					y: {
						stacked: true,
						min: range.min,
						max: range.max,
						ticks: { stepSize: range.step, color: muted, callback: value => InlineChartRuntime.formatValue(value, "count") },
						grid: { color: context => (context.tick.value === 0 ? border : grid) },
					},
					x: {
						stacked: true,
						grid: { display: false },
						ticks: { color: muted, autoSkip: false, maxRotation: 0 },
					},
				},
			},
		})
		InlineChartRuntime.chartJs.stabilize(chart)
	})()
</script>

</body>
